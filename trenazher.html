<html lang="ru">
<head>

<title>Тренажёр неравенств · ОГЭ</title>

<script defer src="_движок/katex/katex.min.js"></script>
<!--
  Тренажёр неравенств ОГЭ № 13 и № 20 (ТЗ 32, D 24.11.2026). Сервер — vk_bot/trenazher.py (флаг TREN_ON).
  Ученик: trenazher.html?s=<журнал>.<ключ> (личная ссылка) или память Дневника на этом устройстве (zh:sk / zh:ck).
  D: trenazher.html#d — таблица «ученик × раздел», ключ входа журнала на этом устройстве.
  Стенд: ?api=http://127.0.0.1:<порт>/cabinet
  Белый фон, чёрная математика, без украшений (D: «украшать потом»).
-->
<style>
  :root { --ink: #111; --mute: #666; --line: #e3e3e3; --blue: #2f6fb5; --ok: #1d7a3a; --bad: #b3261e; --warn: #a15c00; --soft: #f5f6f8; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px 32px; }
  main.wide { max-width: 1100px; }
  h1 { font-size: 21px; margin: 6px 0 12px; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .btn { min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid #cfd3d8; background: #fff; }
  .btn.main { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; width: 100%; font-size: 19px; min-height: 56px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .link { background: none; border: 0; color: var(--blue); padding: 10px 4px; min-height: 44px; }
  .mute { color: var(--mute); }
  .small { font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tabs button { flex: 1; min-height: 48px; border: 1px solid #cfd3d8; border-radius: 12px; background: #fff; }
  .tabs button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
  .tabs small { display: block; font-size: 12px; color: var(--mute); font-weight: 400; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .row3 .btn { padding: 8px 6px; font-size: 15px; }
  .row3 b { display: block; font-size: 18px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } }
  .tile { text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff; min-height: 96px; }
  .tile .nm { font-weight: 600; display: block; margin-bottom: 4px; }
  .tile .st { font-size: 13px; color: var(--mute); display: block; }
  .lv { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid #cfd3d8; color: var(--mute); margin-bottom: 4px; }
  .lv.nach { border-color: #d9a0a0; color: var(--bad); }
  .lv.zn { border-color: #c9a227; color: #7a5d00; }
  .lv.um { border-color: var(--blue); color: var(--blue); }
  .lv.osv { border-color: var(--ok); color: #fff; background: var(--ok); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .why { font-size: 14px; color: var(--mute); margin: 4px 0 10px; }
  .cond { margin: 8px 0 12px; }
  .cond .tx { margin-bottom: 8px; }
  .disp { overflow-x: auto; overflow-y: hidden; padding: 4px 0; text-align: center; }
  .disp .katex-display { margin: .3em 0; }
  .pic { text-align: center; margin: 8px 0; }
  .pic img { max-width: 100%; height: auto; }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid #cfd3d8; border-radius: 12px; background: #fff; padding: 8px 12px; min-height: 56px; width: 100%; }
  .opt .no { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .opt .body { flex: 1; min-width: 0; overflow-x: auto; font-size: 19px; }
  .opt.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .opt.wrongpick { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .nl { position: relative; height: 62px; }
  .nl svg { position: absolute; left: 0; top: 0; width: 100%; height: 40px; }
  .nl .lab { position: absolute; top: 38px; transform: translateX(-50%); font-size: 14px; white-space: nowrap; }
  .ans { border: 2px solid var(--ink); border-radius: 12px; min-height: 58px; padding: 10px 12px; font-size: 22px; display: flex; align-items: center; overflow-x: auto; margin-bottom: 8px; }
  .ans .ph { color: #999; font-size: 16px; }
  .hintline { min-height: 22px; font-size: 15px; color: var(--warn); margin: 0 0 6px; }
  .kb { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; user-select: none; -webkit-user-select: none; }
  .kb button { min-height: 50px; border: 1px solid #cfd3d8; border-radius: 10px; background: var(--soft); font-size: 21px; padding: 0; }
  .kb button.fn { background: #e9ebef; }
  .kb button:active { background: #dfe3e8; }
  .kb .go { grid-column: 1 / -1; background: var(--blue); border-color: var(--blue); color: #fff; font-size: 19px; font-weight: 600; min-height: 54px; }
  .verdict { font-size: 20px; font-weight: 700; margin: 12px 0 4px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .sol { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 6px; }
  .sol p { margin: 6px 0; }
  .sol p.otv { font-weight: 600; }
  .trap { width: 100%; border-collapse: collapse; margin: 8px 0; table-layout: fixed; }
  .trap th, .trap td { border: 1px solid var(--line); padding: 6px; vertical-align: top; font-size: 15px; }
  .trap th { background: var(--soft); text-align: left; }
  .trap td { overflow-x: auto; }
  .tagline { text-align: right; font-size: 15px; margin: -4px 0 6px; overflow-x: auto; }
  .star { background: none; border: 0; font-size: 15px; color: var(--mute); min-height: 44px; padding: 0 4px; }
  .star.on { color: #b88600; }
  .prog { font-size: 15px; color: var(--mute); }
  .center { text-align: center; }
  .msg { padding: 40px 10px; text-align: center; }
  .toggle { display: flex; align-items: center; gap: 8px; margin: -4px 0 8px; font-size: 15px; }
  .toggle input { width: 22px; height: 22px; }
  table.d { border-collapse: collapse; font-size: 13px; }
  table.d th, table.d td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.d th { background: var(--soft); font-weight: 600; vertical-align: bottom; }
  table.d td.nm { text-align: left; white-space: nowrap; }
  table.d td.c { cursor: pointer; min-width: 64px; }
  table.d td.c:hover { background: var(--soft); }
  .dwrap { overflow-x: auto; }
  .olist .it { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 15px; }
  footer { max-width: 640px; margin: 0 auto; padding: 0 14px 24px; font-size: 12px; color: var(--mute); }
  footer a { color: var(--mute); }
</style>
</head>
<body>
<main id="app"><div class="msg mute">Загружаю…</div></main>
<footer>© 2026 Дмитрий Дружков · <a href="pravila.html">Правила</a> · задачи — открытый банк заданий ФИПИ</footer>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ── память и адрес сервера (как у Дневника: прямой RF и запасной через шлюз) ── */
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без памяти */ } }
  var APIS = (function () {
    try {
      var q = new URLSearchParams(location.search).get('api') || '';
      if (/^http:\/\/(127\.0\.0\.1|localhost)(:\d{2,5})?(\/[\w\/-]*)?$/.test(q)) return [q.replace(/\/$/, '')];
    } catch (e) { /* старый браузер */ }
    var list = ['https://194-87-110-53.nip.io/cabinet', 'https://hw.157-228-128-116.nip.io/cabinet'];
    var saved = lsGet('kab:api', '');
    return list.indexOf(saved) > 0 ? [saved].concat(list.filter(function (a) { return a !== saved; })) : list;
  })();
  var API = APIS[0];
  var TZ = -new Date().getTimezoneOffset();
  var MODE = /(^#|&)d(&|$)/.test(location.hash) ? 'd' : 's';
  var ZN_RE = /^[a-z0-9]{2,16}\.[0-9a-f]{32}$/;

  function stuH() {
    var q = '';
    try { q = new URLSearchParams(location.search).get('s') || ''; } catch (e) { /* нет */ }
    if (ZN_RE.test(q)) { lsSet('tren:s', q); return { 'X-Stu-Key': q }; }
    var s = lsGet('tren:s', '') || lsGet('zh:sk', '');
    if (ZN_RE.test(s)) return { 'X-Stu-Key': s };
    var c = lsGet('zh:ck', '');
    return c ? { 'X-Chat-Key': c } : null;
  }
  function dH() {
    var k = lsGet('zh:key', '') || lsGet('kab:key', '') || lsGet('zh:us', '');
    return k ? { Authorization: 'Bearer ' + k } : null;
  }

  function post(path, body, retried) {
    var h = MODE === 'd' ? dH() : stuH();
    if (!h) return Promise.resolve({ status: 401, data: {} });
    var hh = { 'Content-Type': 'application/json' };
    Object.keys(h).forEach(function (k) { hh[k] = h[k]; });
    body = body || {};
    body.tz = TZ;
    var ctrl = window.AbortController ? new AbortController() : null;
    var guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    return fetch(API + path, { method: 'POST', headers: hh, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(guard);
        return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; });
      }, function (e) {
        clearTimeout(guard);
        if (!retried && APIS.length > 1) {   // прямой адрес молчит (VPN) — запасной
          API = APIS[(APIS.indexOf(API) + 1) % APIS.length];
          return post(path, body, true);
        }
        throw e;
      });
  }

  /* ── KaTeX и разметка ── */
  var app = document.getElementById('app');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function tex(target, s, display) {
    try { katex.render(String(s), target, { throwOnError: false, displayMode: !!display, strict: 'ignore' }); }
    catch (e) { target.textContent = s; }
    return target;
  }
  // строка с $…$ и **жирным** → узлы; ничего не идёт в innerHTML (в формулах есть «<x»)
  function rich(target, s) {
    String(s).split(/(\$[^$]+\$)/).forEach(function (part) {
      if (!part) return;
      if (part.charAt(0) === '$' && part.length > 1 && part.charAt(part.length - 1) === '$') { tex(target.appendChild(el('span')), part.slice(1, -1)); return; }
      part.split(/\*\*(.+?)\*\*/).forEach(function (t, i) {
        if (t) target.appendChild(i % 2 ? el('b', null, t) : document.createTextNode(t));
      });
    });
    return target;
  }
  var NARROW = function () { return window.innerWidth < 600; };
  // пометка действия \tag*{…}: на широком экране KaTeX ставит её справа от формулы, на телефоне она наезжает
  // на формулу — там выносим её строкой под формулу, справа
  function splitTag(f) {
    var i = f.indexOf('\\tag*{');
    if (i < 0) return [f, ''];
    var d = 0, j = i + 5;
    for (; j < f.length; j++) { if (f[j] === '{') d++; else if (f[j] === '}' && --d === 0) break; }
    var inner = f.slice(i + 6, j).trim().replace(/^\$|\$$/g, '');
    return [f.slice(0, i) + f.slice(j + 1), inner];
  }
  function formula(target, f) {
    var parts = NARROW() ? splitTag(f) : [f, ''];
    tex(target.appendChild(el('div', 'disp')), parts[0], true);
    if (parts[1]) tex(target.appendChild(el('div', 'tagline')), parts[1]);
  }
  function displays(target, s) {   // «$$a$$ $$b$$» → формулы по центру одна под другой
    var m = String(s).match(/\$\$[\s\S]+?\$\$/g) || [];
    m.forEach(function (f) { formula(target, f.slice(2, -2)); });
    var rest = String(s).replace(/\$\$[\s\S]+?\$\$/g, '').trim();
    if (rest) rich(target.appendChild(el('p')), rest);
    return target;
  }
  // версия банка в адресе: исправленный рисунок не застрянет в кеше телефона на сутки
  function imgUrl(name) { return API + '/tren/img/' + encodeURIComponent(name) + (S.me && S.me.v ? '?v=' + S.me.v : ''); }
  function pic(target, name) {
    var d = target.appendChild(el('div', 'pic'));
    var im = d.appendChild(el('img'));
    im.alt = 'рисунок';
    im.src = imgUrl(name);
    return d;
  }
  function segs(s) { return String(s || '').split(/\s*▸\s*/).filter(Boolean); }

  // решение (ТЗ 32, § 10): текст — абзац, $$…$$ — по центру, ![…](…) — рисунок, «Ответ: …» — последняя строка
  function solution(target, s) {
    segs(s).forEach(function (line) {
      var im = line.match(/^!\[[^\]]*\]\(([^)]+)\)$/);
      if (im) { pic(target, im[1]); return; }
      if (line.indexOf('$$') === 0) { displays(target, line); return; }
      var p = rich(target.appendChild(el('p')), line);
      if (/^Ответ:/.test(line)) p.className = 'otv';
    });
  }
  // ловушка № 20: «Ловушка: … ▸ Неверно: $$…$$ ▸ Верно: $$…$$» → строка и табличка в два столбца
  function trapNotes(target, s) {
    var head = [], bad = null, good = null;
    segs(s).forEach(function (line) {
      if (/^Неверно:/.test(line)) bad = line.replace(/^Неверно:\s*/, '');
      else if (/^Верно:/.test(line)) good = line.replace(/^Верно:\s*/, '');
      else head.push(line);
    });
    head.forEach(function (h) { rich(target.appendChild(el('p')), h); });
    if (bad != null || good != null) {
      var t = target.appendChild(el('table', 'trap'));
      if (NARROW()) {   // на телефоне два столбца режут формулы — один под другим
        [['Неверно', bad], ['Верно', good]].forEach(function (x) {
          t.appendChild(el('tr')).appendChild(el('th', null, x[0]));
          displays(t.appendChild(el('tr')).appendChild(el('td')), x[1] || '');
        });
      } else {
        var tr = t.appendChild(el('tr'));
        tr.appendChild(el('th', null, 'Неверно'));
        tr.appendChild(el('th', null, 'Верно'));
        var tr2 = t.appendChild(el('tr'));
        displays(tr2.appendChild(el('td')), bad || '');
        displays(tr2.appendChild(el('td')), good || '');
      }
    }
  }

  /* ── множество из LaTeX — для рисунка на прямой (вариант № 13) ── */
  function normTex(s) {
    s = String(s)
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2')
      .replace(/\\sqrt\{(\d+)\}/g, '√$1')
      .replace(/\\text\{нет решений\}|\\varnothing/g, '∅')
      .replace(/\\left|\\right|\\,|\\;|\s/g, '')
      .replace(/\{,\}/g, ',')
      .replace(/\\infty/g, '∞').replace(/\\cup/g, '∪').replace(/\\\{/g, '{').replace(/\\\}/g, '}')
      .replace(/[−–]/g, '-');
    return s;
  }
  function numVal(t) {   // «-1/3», «0,88», «7+√11» → число (только чтобы расставить точки по порядку)
    if (t === '-∞') return -Infinity;
    if (t === '+∞' || t === '∞') return Infinity;
    var v = 0;
    (t.match(/[+-]?[^+-]+/g) || []).forEach(function (term) {
      var sg = term.charAt(0) === '-' ? -1 : 1;
      term = term.replace(/^[+-]/, '');
      var m = term.match(/^(\d+(?:,\d+)?)?(?:\/(\d+(?:,\d+)?))?(?:√(\d+(?:,\d+)?))?$/);
      if (!m) return;
      var x = m[1] ? parseFloat(m[1].replace(',', '.')) : 1;
      if (m[2]) x /= parseFloat(m[2].replace(',', '.'));
      if (m[3]) x *= Math.sqrt(parseFloat(m[3].replace(',', '.')));
      v += sg * x;
    });
    return v;
  }
  function labTex(t) { return t.replace(/(\d+(?:,\d+)?)\/(\d+(?:,\d+)?)/g, '\\dfrac{$1}{$2}').replace(/√(\d+)/g, '\\sqrt{$1}').replace(/,/g, '{,}').replace(/∞/g, '\\infty'); }
  function partsOf(s) {   // → [{a, ac, b, bc, la, lb}] ; точки — a = b
    s = normTex(s);
    if (s === '∅') return [];
    var out = [];
    s.split('∪').forEach(function (p) {
      var m = p.match(/^([(\[])([^;]+);([^;]+)([)\]])$/);
      if (m) { out.push({ a: numVal(m[2]), ac: m[1] === '[', b: numVal(m[3]), bc: m[4] === ']', la: m[2], lb: m[3] }); return; }
      var q = p.match(/^\{(.+)\}$/);
      if (q) q[1].split(';').forEach(function (x) { out.push({ a: numVal(x), ac: true, b: numVal(x), bc: true, la: x, lb: x }); });
    });
    return out;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  var hatchN = 0;
  function numberLine(target, s) {   // прямая со штриховкой, как в КИМ: точки по порядку, без масштаба
    var parts = partsOf(s), pts = [];
    parts.forEach(function (p) {
      [[p.a, p.la], [p.b, p.lb]].forEach(function (x) {
        if (isFinite(x[0]) && !pts.some(function (y) { return Math.abs(y[0] - x[0]) < 1e-9; })) pts.push(x);
      });
    });
    pts.sort(function (x, y) { return x[0] - y[0]; });
    var W = 300, L = 14, R = 286;
    function X(v) {
      if (v === -Infinity) return L;
      if (v === Infinity) return R;
      var i = pts.findIndex(function (y) { return Math.abs(y[0] - v) < 1e-9; });
      return L + (R - L) * (i + 1) / (pts.length + 1);
    }
    var box = target.appendChild(el('div', 'nl'));
    var svg = sv('svg', { viewBox: '0 0 ' + W + ' 40', preserveAspectRatio: 'none' }, box);
    var id = 'h' + (++hatchN);
    var pat = sv('pattern', { id: id, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, sv('defs', {}, svg));
    sv('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: '#111', 'stroke-width': 1.4 }, pat);
    parts.forEach(function (p) {
      if (p.a !== p.b) sv('rect', { x: X(p.a), y: 10, width: Math.max(1, X(p.b) - X(p.a)), height: 14, fill: 'url(#' + id + ')' }, svg);
    });
    sv('line', { x1: 2, y1: 24, x2: W - 4, y2: 24, stroke: '#111', 'stroke-width': 1.5 }, svg);
    sv('path', { d: 'M' + (W - 10) + ',19 L' + (W - 2) + ',24 L' + (W - 10) + ',29', fill: 'none', stroke: '#111', 'stroke-width': 1.5 }, svg);
    pts.forEach(function (pt) {
      var closed = parts.some(function (p) { return (Math.abs(p.a - pt[0]) < 1e-9 && p.ac) || (Math.abs(p.b - pt[0]) < 1e-9 && p.bc); });
      sv('circle', { cx: X(pt[0]), cy: 24, r: 4.5, fill: closed ? '#111' : '#fff', stroke: '#111', 'stroke-width': 1.5 }, svg);
      var lab = box.appendChild(el('span', 'lab'));
      lab.style.left = (X(pt[0]) / W * 100) + '%';
      tex(lab, labTex(pt[1]));
    });
    return box;
  }

  /* ── экранная клавиатура № 20 (ТЗ 32, § 5) ── */
  var KEYS = ['(', '[', '7', '8', '9', '⌫', ')', ']', '4', '5', '6', '◀', '{', '}', '1', '2', '3', '▶',
    ';', ',', '0', '−', '+', '∪', '√', '∞', '∅', '/', '∩', 'x'];
  var FN = { '⌫': 1, '◀': 1, '▶': 1 };
  var TEXOF = { '{': '\\{', '}': '\\}', ';': ';\\,', ',': '{,}', '−': '-', '∪': '\\cup ', '∩': '\\cap ', '∞': '\\infty ', '∅': '\\text{нет решений}' };
  var CUR = '\\textcolor{#2f6fb5}{\\vert}';
  function isDig(t) { return /^[0-9]$/.test(t); }
  // набор → LaTeX: √ — следующие цифры под корень, любая не-цифра закрывает корень
  function inputTex(tokens, cur) {
    var out = '', root = false, rootEmpty = false;
    for (var i = 0; i <= tokens.length; i++) {
      var t = tokens[i];
      if (root && (i === tokens.length ? false : !(isDig(t) || (t === ',' && isDig(tokens[i - 1] || '') && isDig(tokens[i + 1] || ''))))) {
        out += (rootEmpty ? '\\phantom{0}' : '') + '}';
        root = false;
      }
      if (i === cur) out += CUR;
      if (i === tokens.length) break;
      if (t === '√') { out += '\\sqrt{'; root = true; rootEmpty = true; continue; }
      if (root) rootEmpty = false;
      out += TEXOF[t] || t;
    }
    if (root) out += (rootEmpty ? '\\phantom{0}' : '') + '}';
    return out;
  }
  function rawTex(raw) {   // что ввёл ученик (строкой) → LaTeX без курсора — для таблицы D
    var toks = Array.from(String(raw || ''));
    return inputTex(toks, -1);
  }
  function keyboard(target, onCheck) {
    var tokens = [], cur = 0;
    var line = target.appendChild(el('div', 'ans'));
    var hint = target.appendChild(el('div', 'hintline'));
    function draw() {
      line.textContent = '';
      if (!tokens.length) { line.appendChild(el('span', 'ph', 'Набери ответ кнопками ниже')); return; }
      tex(line.appendChild(el('span')), inputTex(tokens, cur));   // cur = -1 — ответ отправлен, курсора нет
    }
    var kb = target.appendChild(el('div', 'kb'));
    KEYS.forEach(function (k) {
      var b = kb.appendChild(el('button', FN[k] ? 'fn' : '', k));
      b.type = 'button';
      b.setAttribute('aria-label', { '⌫': 'стереть', '◀': 'курсор влево', '▶': 'курсор вправо', '∅': 'нет решений' }[k] || k);
      b.addEventListener('click', function () {
        hint.textContent = '';
        if (k === '⌫') { if (cur > 0) { tokens.splice(cur - 1, 1); cur--; } }
        else if (k === '◀') cur = Math.max(0, cur - 1);
        else if (k === '▶') cur = Math.min(tokens.length, cur + 1);
        else if (tokens.length < 80) { tokens.splice(cur, 0, k); cur++; }
        draw();
      });
    });
    var go = kb.appendChild(el('button', 'go', 'Проверить'));
    go.type = 'button';
    go.addEventListener('click', function () {
      if (!tokens.length) { hint.textContent = 'Сначала набери ответ.'; return; }
      onCheck(tokens.join(''), function (msg) { hint.textContent = msg; }, go);
    });
    line.addEventListener('click', function () { if (cur >= 0) { cur = tokens.length; draw(); } });
    draw();
    return { hide: function () { kb.style.display = 'none'; cur = -1; draw(); } };
  }

  /* ── состояние и экраны ── */
  var S = { me: null, zal: lsGet('tren:zal', '13'), mixAll: false, ser: null };
  function zalOf(id) { return (S.me.zaly || []).filter(function (z) { return z.id === id; })[0]; }
  function razOf(zal, id) { return (S.me.razdely || []).filter(function (r) { return r.zal === zal && r.id === id; })[0]; }

  function fail(r) {
    app.textContent = '';
    var m = app.appendChild(el('div', 'msg'));
    if (r && r.status === 404) m.textContent = 'Тренажёр пока закрыт.';
    else if (r && r.status === 401) {
      m.appendChild(el('p', null, MODE === 'd' ? 'Войди в журнал на этом устройстве — и открой эту страницу снова.'
        : 'Открой тренажёр по своей ссылке из Дневника.'));
      if (MODE === 'd') { var a = m.appendChild(el('a', null, 'Открыть журнал')); a.href = 'zhurnal.html'; }
    } else {
      m.appendChild(el('p', null, 'Нет связи с сервером.'));
      var b = m.appendChild(el('button', 'btn', 'Попробовать ещё раз'));
      b.addEventListener('click', start);
    }
  }

  function loadMe() {
    return post('/tren/me', {}).then(function (r) {
      if (r.status !== 200 || !r.data.ok) { fail(r); return false; }
      S.me = r.data;
      if (!zalOf(S.zal)) S.zal = S.me.zaly[0].id;
      return true;
    });
  }

  function home() {
    S.ser = null;
    window.scrollTo(0, 0);
    app.textContent = '';
    app.appendChild(el('h1', null, 'Тренажёр неравенств'));
    var tabs = app.appendChild(el('div', 'tabs'));
    S.me.zaly.forEach(function (z) {
      var b = tabs.appendChild(el('button', z.id === S.zal ? 'on' : ''));
      b.appendChild(document.createTextNode(z.name));
      b.appendChild(el('small', null, z.sub));
      b.addEventListener('click', function () { S.zal = z.id; lsSet('tren:zal', z.id); home(); });
    });
    var z = zalOf(S.zal);
    if (z.prov === 'none') {
      var c = app.appendChild(el('div', 'card'));
      var nr = S.me.razdely.filter(function (r) { return r.zal === z.id; }).length;
      c.appendChild(el('p', null, z.prov_n ? 'Проверка пройдена на ' + z.prov_n + ' из ' + nr + '. Осталось ' + (nr - z.prov_n) + '.'
        : 'Сначала — проверка: по одной задаче из каждого раздела, всего ' + nr + '. Узнаем, с чего тебе начать.'));
      var b1 = c.appendChild(el('button', 'btn main', z.prov_n ? 'Продолжить проверку' : 'Начать проверку'));
      b1.addEventListener('click', function () { series('prov', z.id); });
      var b2 = c.appendChild(el('button', 'link', 'Пропустить'));
      b2.addEventListener('click', function () {
        b2.disabled = true;
        post('/tren/prop', { zal: z.id }).then(function () { return loadMe(); }).then(function (ok) { if (ok) home(); });
      });
    } else {
      var go = app.appendChild(el('button', 'btn main', 'Продолжить'));
      go.addEventListener('click', function () { series('dalee', z.id); });
    }
    var row = app.appendChild(el('div', 'row3'));
    function small(label, n, fn, off) {
      var b = row.appendChild(el('button', 'btn'));
      b.appendChild(el('b', null, n == null ? '' : String(n)));
      b.appendChild(document.createTextNode(label));
      b.disabled = !!off;
      b.addEventListener('click', fn);
    }
    small('Мои ошибки', z.osh, function () { series('osh', z.id); }, !z.osh_ready);
    small('Повторить', z.zv, function () { series('zv', z.id); }, !z.zv);
    small('Вперемешку', '10', function () { series('mix', S.mixAll ? 'all' : z.id); });
    var tg = app.appendChild(el('label', 'toggle'));
    var cb = tg.appendChild(el('input'));
    cb.type = 'checkbox';
    cb.checked = S.mixAll;
    cb.addEventListener('change', function () { S.mixAll = cb.checked; });
    tg.appendChild(document.createTextNode('«Вперемешку» — из № 13 и № 20 вместе'));
    if (z.osh && !z.osh_ready) app.appendChild(el('p', 'small mute', 'Ошибки вернутся близнецами через пару дней — так проверим, что ход запомнился.'));

    app.appendChild(el('h2', null, 'Разделы'));
    var tiles = app.appendChild(el('div', 'tiles'));
    S.me.razdely.filter(function (r) { return r.zal === z.id; }).forEach(function (r) {
      var t = tiles.appendChild(el('button', 'tile'));
      t.appendChild(el('span', 'nm', r.name));
      t.appendChild(el('span', 'lv ' + r.lvl, S.me.lvl_name[r.lvl]));
      if (r.n) t.appendChild(el('span', 'st', 'верно с первого раза: ' + r.ok + ' из ' + r.n));
      t.appendChild(el('span', 'st', !r.n ? 'задач: ' + r.total : r.new ? 'новых задач: ' + r.new : 'новых нет — повторяем'));
      t.addEventListener('click', function () { series('raz', z.id, r.id); });
    });
    if (S.me.streak) app.appendChild(el('p', 'small mute center', 'Решаешь ' + S.me.streak + ' ' + plural(S.me.streak, 'день', 'дня', 'дней') + ' подряд'));
    var lv = app.appendChild(el('p', 'small mute'));
    lv.textContent = 'Уровень раздела: знаком — есть верный ответ; умею — из последних пяти верны четыре; освоено — «умею» и через три дня снова верно.';
  }
  function plural(n, a, b, c) { n = Math.abs(n) % 100; if (n > 10 && n < 15) return c; n %= 10; return n === 1 ? a : n > 1 && n < 5 ? b : c; }

  var TITLE = { prov: 'Проверка', raz: '', osh: 'Мои ошибки', zv: 'Повторить', mix: 'Вперемешку', dalee: 'Продолжить' };
  function series(sc, zal, raz) {
    app.textContent = '';
    app.appendChild(el('div', 'msg mute', 'Собираю задачи…'));
    post('/tren/seriya', { sc: sc, zal: zal, raz: raz || '' }).then(function (r) {
      if (r.status !== 200 || !r.data.ok) { fail(r); return; }
      var d = r.data;
      if (!d.tasks.length) {
        app.textContent = '';
        var m = app.appendChild(el('div', 'msg'));
        m.appendChild(el('p', null, d.note || 'Здесь пока нет задач.'));
        var b = m.appendChild(el('button', 'btn', 'Назад'));
        b.addEventListener('click', home);
        return;
      }
      S.ser = { sc: sc, zal: zal, raz: raz || '', tasks: d.tasks, i: 0, res: [], why: d.why, note: d.note,
        title: TITLE[sc] || ((razOf(zal, raz) || {}).name || '') };
      task();
    }, function () { fail(null); });
  }

  function task() {
    var ser = S.ser, t = ser.tasks[ser.i];
    window.scrollTo(0, 0);
    app.textContent = '';
    var top = app.appendChild(el('div', 'top'));
    var back = top.appendChild(el('button', 'link', '← Назад'));
    back.addEventListener('click', function () { loadMe().then(function (ok) { if (ok) home(); }); });
    top.appendChild(el('span', 'prog', (ser.i + 1) + ' из ' + ser.tasks.length));
    var star = top.appendChild(el('button', 'star' + (t.star ? ' on' : ''), t.star ? '★ в «Повторить»' : '☆ В «Повторить»'));
    star.addEventListener('click', function () {
      t.star = !t.star;
      star.className = 'star' + (t.star ? ' on' : '');
      star.textContent = t.star ? '★ в «Повторить»' : '☆ В «Повторить»';
      post('/tren/zv', { id: t.id, on: t.star ? 1 : 0 });
    });
    var head = ser.title + (ser.sc === 'raz' ? '' : '');
    if (head) app.appendChild(el('div', 'small mute', head));
    if (ser.i === 0 && (ser.why || ser.note)) app.appendChild(el('div', 'why', [ser.why, ser.note].filter(Boolean).join('. ')));

    var cond = app.appendChild(el('div', 'cond'));
    if (t.cond_text) rich(cond.appendChild(el('div', 'tx')), t.cond_text);
    if (t.cond_latex) tex(cond.appendChild(el('div', 'disp')), t.cond_latex, true);
    if (t.image) pic(cond, t.image);
    var t0 = Date.now();
    var after = el('div');

    if (t.opts) {
      var box = app.appendChild(el('div', 'opts'));
      var btns = [];
      t.opts.forEach(function (o, k) {
        var b = box.appendChild(el('button', 'opt'));
        b.type = 'button';
        b.appendChild(el('span', 'no', String(k + 1)));
        var body = b.appendChild(el('span', 'body'));
        if (t.vid === 'line') numberLine(body, o); else tex(body, o);
        btns.push(b);
        b.addEventListener('click', function () {
          if (box.dataset.done) return;
          box.dataset.done = '1';
          b.classList.add('wrongpick');
          send(t, o, Date.now() - t0, after, function (a) {
            btns.forEach(function (x, j) {
              if (t.opts[j] === a.answer) { x.classList.remove('wrongpick'); x.classList.add('right'); }
            });
          }, function () { delete box.dataset.done; b.classList.remove('wrongpick'); });
        });
      });
      app.appendChild(after);
    } else {
      var kbBox = app.appendChild(el('div'));
      var kb = keyboard(kbBox, function (raw, say, goBtn) {
        goBtn.disabled = true;
        goBtn.textContent = 'Проверяю…';
        send(t, raw, Date.now() - t0, after, function (a) {
          if (a.st === 'broken') { say(a.msg); goBtn.disabled = false; goBtn.textContent = 'Проверить'; return false; }
          kb.hide();
          return true;
        }, function () { goBtn.disabled = false; goBtn.textContent = 'Проверить'; say('Нет связи — нажми «Проверить» ещё раз.'); });
      });
      app.appendChild(after);
    }
  }

  function send(t, v, ms, after, onAns, onFail) {
    var ser = S.ser;
    post('/tren/otvet', { id: t.id, sc: ser.sc, v: v, ms: ms }).then(function (r) {
      if (r.status !== 200 || !r.data.ok) { if (r.status === 401 || r.status === 404) fail(r); else onFail(); return; }
      var a = r.data;
      if (onAns(a) === false) return;
      if (a.first) ser.res.push(a.st === 'ok');
      after.textContent = '';
      var v1 = after.appendChild(el('div', 'verdict ' + (a.st === 'ok' ? 'ok' : 'bad'),
        a.st === 'ok' ? 'Верно' : a.st === 'approx' ? 'Нужен точный ответ' : 'Неверно'));
      v1.setAttribute('role', 'status');
      if (a.msg && a.st !== 'ok') after.appendChild(el('p', 'small', a.msg));
      if (a.st !== 'ok') {
        var p = after.appendChild(el('p'));
        p.appendChild(document.createTextNode('Верный ответ: '));
        tex(p.appendChild(el('span')), a.answer);
      }
      if (!a.first && a.st !== 'broken') after.appendChild(el('p', 'small mute', 'Эту задачу ты уже решал — в счёт идёт первый ответ.'));
      var nx = after.appendChild(el('button', 'btn main', ser.i + 1 < ser.tasks.length ? 'Дальше' : 'Итог'));
      nx.addEventListener('click', function () {
        ser.i++;
        if (ser.i < ser.tasks.length) task(); else done();
      });
      var sol = after.appendChild(el('div', 'sol'));
      sol.appendChild(el('h2', null, 'Решение'));
      solution(sol, a.solution);
      if (a.notes) trapNotes(sol, a.notes);
      if (a.hint) rich(sol.appendChild(el('p', 'small')), a.hint);
      var nx2 = sol.appendChild(el('button', 'btn', ser.i + 1 < ser.tasks.length ? 'Дальше' : 'Итог'));
      nx2.addEventListener('click', function () { nx.click(); });
    }, function () { onFail(); });
  }

  function done() {
    var ser = S.ser;
    window.scrollTo(0, 0);
    app.textContent = '';
    var m = app.appendChild(el('div', 'msg'));
    var okN = ser.res.filter(Boolean).length;
    m.appendChild(el('h1', null, ser.res.length ? 'Верно с первого раза: ' + okN + ' из ' + ser.res.length : 'Серия закончена'));
    if (ser.res.length > okN) m.appendChild(el('p', 'mute', 'Ошибки попали в «Мои ошибки» — вернутся задачами-близнецами.'));
    var again = m.appendChild(el('button', 'btn main', 'Ещё задачи'));
    again.addEventListener('click', function () { series(ser.sc === 'prov' ? 'dalee' : ser.sc, ser.zal, ser.raz); });
    var b = m.appendChild(el('button', 'link', 'К разделам'));
    b.addEventListener('click', function () { loadMe().then(function (ok) { if (ok) home(); }); });
    loadMe();
  }

  /* ── D: таблица «ученик × раздел» (С8) ── */
  var D = { data: null, zal: '13' };
  function dLoad() {
    app.textContent = '';
    app.appendChild(el('div', 'msg mute', 'Загружаю…'));
    post('/tren/d', {}).then(function (r) {
      if (r.status !== 200 || !r.data.ok) { fail(r); return; }
      D.data = r.data;
      dTable();
    }, function () { fail(null); });
  }
  function fmtDay(at) {
    if (!at) return '';
    var d = new Date(at);
    return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function dTable() {
    var data = D.data;
    document.querySelector('main').classList.add('wide');
    app.textContent = '';
    app.appendChild(el('h1', null, 'Тренажёр неравенств — ученики'));
    var tabs = app.appendChild(el('div', 'tabs'));
    data.zaly.forEach(function (z) {
      var b = tabs.appendChild(el('button', z.id === D.zal ? 'on' : '', z.name));
      b.addEventListener('click', function () { D.zal = z.id; dTable(); });
    });
    if (!data.journals.length) { app.appendChild(el('p', 'mute', 'Пока никто не решал.')); return; }
    var raz = data.razdely.filter(function (r) { return r.zal === D.zal; }).sort(function (a, b) { return a.ord - b.ord; });
    var list = el('div', 'olist');
    data.journals.forEach(function (j) {
      app.appendChild(el('h2', null, j.title));
      var w = app.appendChild(el('div', 'dwrap'));
      var t = w.appendChild(el('table', 'd'));
      var hr = t.appendChild(el('tr'));
      hr.appendChild(el('th', null, 'Ученик'));
      raz.forEach(function (r) { hr.appendChild(el('th', null, r.name)); });
      hr.appendChild(el('th', null, 'Ошибок ждут'));
      hr.appendChild(el('th', null, 'Последний раз'));
      j.kids.forEach(function (k) {
        var tr = t.appendChild(el('tr'));
        tr.appendChild(el('td', 'nm', (k.fam + ' ' + k.name).trim()));
        raz.forEach(function (r) {
          var c = k.cells[r.zal + '/' + r.id];
          var td = tr.appendChild(el('td', 'c'));
          if (c) {
            td.appendChild(el('span', 'lv ' + c.lvl, data.lvl_name[c.lvl]));
            td.appendChild(el('div', null, c.ok + ' из ' + c.n));
            td.appendChild(el('div', 'mute', fmtDay(c.last)));
          } else td.appendChild(el('span', 'mute', '—'));
          td.addEventListener('click', function () { dCell(list, k, r); });
        });
        tr.appendChild(el('td', null, String(k.osh || '')));
        tr.appendChild(el('td', null, fmtDay(k.last)));
      });
    });
    app.appendChild(list);
  }
  function dCell(list, k, r) {
    list.textContent = '';
    list.appendChild(el('h2', null, (k.fam + ' ' + k.name).trim() + ' · ' + r.name));
    list.appendChild(el('p', 'mute', 'Загружаю…'));
    post('/tren/d/otvety', { who: k.who, zal: r.zal, raz: r.id }).then(function (res) {
      list.lastChild.remove();
      var o = (res.data && res.data.otvety) || [];
      if (!o.length) { list.appendChild(el('p', 'mute', 'Ответов нет.')); return; }
      o.forEach(function (x) {
        var it = list.appendChild(el('div', 'it'));
        var h = it.appendChild(el('div'));
        h.appendChild(el('b', null, x.st === 'ok' ? '✓ верно' : x.st === 'broken' ? '… битая запись' : x.st === 'approx' ? '✗ приближение' : '✗ неверно'));
        h.appendChild(document.createTextNode(' · ' + (x.st === 'broken' ? 'не в счёт' : x.first ? 'первый ответ' : 'повтор') + ' · ' + fmtDay(x.at) + ' · ' + Math.round((x.ms || 0) / 1000) + ' с · ' + x.task));
        if (x.cond_latex) tex(it.appendChild(el('div')), x.cond_latex);
        var p = it.appendChild(el('div'));
        p.appendChild(document.createTextNode('Ввёл: '));
        tex(p.appendChild(el('span')), x.vid === 'vvod' ? rawTex(x.raw) : x.raw);
        if (x.st !== 'ok') {
          var q = it.appendChild(el('div', 'mute'));
          q.appendChild(document.createTextNode('Верно: '));
          tex(q.appendChild(el('span')), x.answer);
        }
        if (x.trap) it.appendChild(el('div', null, 'Попал в ловушку № ' + x.trap));
      });
      list.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function start() {
    if (!window.katex) { setTimeout(start, 100); return; }
    if (MODE === 'd') { dLoad(); return; }
    app.textContent = '';
    app.appendChild(el('div', 'msg mute', 'Загружаю…'));
    loadMe().then(function (ok) { if (ok) home(); }, function () { fail(null); });
  }
  start();
});
</script>
</body>
