<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика 9 класс — Школа Гагарина</title>
<meta name="description" content="Материалы уроков математики 9 класса: теория, живые чертежи, домашние задания.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#16131a">
<script>
  /* тема ставится до отрисовки, иначе ночью экран на миг вспыхнет белым */
  try { if (localStorage.getItem('tema') === 'night') document.documentElement.dataset.theme = 'night'; } catch (_) {}
</script>
<link rel="stylesheet" href="_движок/fonts/gf.css">
<link rel="stylesheet" href="style.css?v=154b982e">
</head>
<body>

<header class="hero">
  <!-- живая стена: фон всей шапки, панели лежат поверх -->
  <div class="gif-wall" id="gifWall" aria-hidden="true"></div>
  <div class="shell">
    <div class="top">
      <div>
        <div class="kicker">Школа Гагарина · 9 класс · 2026/27</div>
        <div class="title-row">
          <h1>Математика</h1>
          <a class="year" id="year" href="https://dmitrydruzhkovv-arch.github.io/matematika-gagarina/" target="_blank" rel="noopener">📅 Программа года <span>↗</span></a>
        </div>
      </div>
    </div>
    <div class="board">
      <section class="cal" id="cal" aria-label="Календарь"></section>
      <aside class="day" id="day" aria-label="Расписание дня"></aside>
    </div>
  </div>
</header>

<!-- домашка: бумажный фон -->
<section class="zone-dz">
  <div class="shell" id="zadano"></div>
</section>

<!-- витрина уроков: свой фон, отдельная часть страницы -->
<section class="zone-store">
  <div class="shell">
    <div class="store-h">
      <h2>Уроки</h2>
      <span class="sec-sub">выбери предмет — или листай полки</span>
    </div>
    <div class="subjects" id="subjects"></div>
    <div id="store"></div>
  </div>
</section>

<footer class="foot">
  <div class="shell" id="foot"></div>
</footer>

<!-- часы и переключатель темы: висят на экране всегда, кроме открытого урока -->
<div class="dock" id="dock">
  <span class="clock mono" id="clock"></span>
  <button class="tema tema-day" data-tema="day" title="Дневная тема" aria-label="Дневная тема">Λ</button>
  <button class="tema tema-night" data-tema="night" title="Ночная тема" aria-label="Ночная тема">D</button>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></article>

<script src="plan.js?v=cad5f7e4"></script>
<script src="raspisanie.js?v=c191abc8"></script>
<script src="covers.js?v=81a80950"></script>
<script src="data.js?v=f6df12d3"></script>
<script src="salyut.js?v=fc6b3de4"></script>
<script src="fon.js?v=40b1c599"></script>
<script src="app.js?v=099bbacf"></script>
</body>
</html>
