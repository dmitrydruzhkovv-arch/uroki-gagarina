<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Сводки недели</title>
<!-- Сводки родителям — что ушло бы каждому в воскресенье в 18:00 (ТЗ 22 D, шаг 1, Кодер 28.10.2026).
     Только для учителя: ключ — тот же, что у журнала на этом устройстве. Никому ничего не отправляет.
     Сервер: POST /cabinet/zhurnal/svodki (флаг ZHURNAL_SVODKA). Стенд: svodki.html?api=http://127.0.0.1:<порт>/cabinet -->
<style>
  :root { --bg: #f2f2f6; --card: #fff; --ink: #1c1c1e; --mut: #6b6b72; --line: #e3e3e8; --chat: #cddcbf; --acc: #3d7fd9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #1d1d22; --ink: #ececf0; --mut: #9a9aa3; --line: #2c2c33; --chat: #22301c; --acc: #6aa2ff; } }
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--ink); padding: 16px 16px 40px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; } .sub { color: var(--mut); margin: 4px 0 16px; font-size: 15px; }
  .wk { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .wk b { flex: 1; text-align: center; font-size: 17px; }
  .wk button { min-width: 48px; min-height: 48px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; font-size: 20px; }
  .wk button:disabled { opacity: .3; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 22px 0 8px; }
  .st { background: var(--chat); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
  .b { background: var(--card); border-radius: 14px 14px 14px 5px; padding: 10px 12px; white-space: pre-wrap; font-size: 15px; }
  .b i { color: var(--mut); }
  .none { color: var(--mut); font-size: 15px; padding: 2px 4px 4px; }
  .msg { background: var(--card); border-radius: 14px; padding: 16px; color: var(--mut); }
  .msg a { color: var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Сводки недели</h1>
  <p class="sub" id="sub">Так их увидят родители в воскресенье в 18:00. Пока никому не уходит.</p>
  <div class="wk"><button id="prev" aria-label="Прошлая неделя">‹</button><b id="wk">…</b><button id="next" aria-label="Следующая неделя" disabled>›</button></div>
  <div id="out"><p class="msg">Собираю…</p></div>
</main>
<script>
(function () {
  'use strict';
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  // ключ учителя — тот же, что у журнала на этом устройстве: Кабинет, журнал или вход по логину
  var KEY = lsGet('zh:key', '') || lsGet('kab:key', '') || lsGet('zh:us', '');
  var APIS = (function () {
    try {
      var q = new URLSearchParams(location.search).get('api') || '';
      if (/^http:\/\/(127\.0\.0\.1|localhost)(:\d{2,5})?(\/[\w\/-]*)?$/.test(q)) return [q.replace(/\/$/, '')];
    } catch (e) { /* старый браузер — боевой адрес */ }
    var list = ['https://194-87-110-53.nip.io/cabinet', 'https://hw.157-228-128-116.nip.io/cabinet'], saved = lsGet('kab:api', '');
    return list.indexOf(saved) > 0 ? [saved].concat(list.filter(function (a) { return a !== saved; })) : list;
  })();
  var out = document.getElementById('out'), mon = null, cur = null;

  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function ru(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function day(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function msg(html) { out.innerHTML = '<p class="msg">' + html + '</p>'; }
  // текст сводки — HTML Телеграма от сервера: содержимое уже экранировано, разрешены только <b> и <i>
  function bubble(el, t) {
    var only = t.replace(/<\/?[bi]>/g, '');
    if (only.indexOf('<') < 0) el.innerHTML = t; else el.textContent = t;
  }
  function post(i, body) {
    return fetch(APIS[i] + '/zhurnal/svodki', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .catch(function (e) { if (i + 1 < APIS.length) return post(i + 1, body); throw e; });
  }
  function load(week) {
    if (!KEY) { msg('Открой <a href="zhurnal.html">журнал</a> как учитель на этом устройстве, потом вернись сюда.'); return; }
    msg('Собираю…');
    post(0, week ? { week: week } : {}).then(function (r) {
      if (r.status === 401) { msg('Журнал не узнал учителя. Войди в <a href="zhurnal.html">журнал</a> и открой эту страницу снова.'); return null; }
      if (r.status === 404) { msg('Сводки на сервере ещё не включены.'); return null; }
      return r.json();
    }).then(function (r) {
      if (!r) return;
      if (!r.ok) { msg('Не получилось собрать. Попробуй ещё раз.'); return; }
      show(r);
    }, function () { msg('Нет связи с сервером. Проверь интернет и обнови страницу.'); });
  }
  function show(r) {
    mon = day(r.mon);
    if (!cur) cur = r.mon;
    var sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    document.getElementById('wk').textContent = (r.mon === cur ? 'Эта неделя · ' : '') + ru(mon) + ' – ' + ru(sun);
    document.getElementById('next').disabled = r.mon >= cur;
    var go = r.items.filter(function (x) { return x.text; }).length;
    document.getElementById('sub').textContent = 'Так их увидят родители в воскресенье в 18:00. Пока никому не уходит. Сводок: ' + go +
      (r.items.length > go ? ', без сводки: ' + (r.items.length - go) : '') + '.';
    out.innerHTML = '';
    var j = null;
    r.items.forEach(function (x) {
      if (x.j !== j) { j = x.j; var h = document.createElement('h2'); h.textContent = x.title; out.appendChild(h); }
      var st = document.createElement('div'), b = document.createElement('div');
      st.className = 'st';
      if (x.text) { b.className = 'b'; bubble(b, x.text); } else { b.className = 'none'; b.textContent = x.name + ': на этой неделе ничего не было — сводка не уйдёт.'; }
      st.appendChild(b);
      out.appendChild(st);
    });
    if (!r.items.length) msg('В журналах пока нет учеников.');
  }
  function shift(n) { if (!mon) return; var d = new Date(mon); d.setDate(d.getDate() + 7 * n); load(iso(d)); }
  document.getElementById('prev').onclick = function () { shift(-1); };
  document.getElementById('next').onclick = function () { shift(1); };
  load();
})();
</script>
</body>
</html>
