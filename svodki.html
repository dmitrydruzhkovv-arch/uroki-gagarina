<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Сводки недели</title>
<!-- Сводки родителям — что ушло бы каждому в воскресенье в 18:00 (ТЗ 22 D, шаг 1, Кодер 28.10.2026).
     Шаг 2: «✍️ Дописать» у каждой сводки — слово за неделю, «Сверх урока», статус темы у индивидуала (POST …/svodki/put).
     Только для учителя: ключ — тот же, что у журнала на этом устройстве. Никому ничего не отправляет.
     Шаг 3: «👪 Ссылка родителю» — ссылка в бота, родитель жмёт «Получать сводку» (POST …/svodki/rod, флаг ZHURNAL_ROD).
     Сервер: POST /cabinet/zhurnal/svodki (флаг ZHURNAL_SVODKA). Стенд: svodki.html?api=http://127.0.0.1:<порт>/cabinet -->
<style>
  :root { --bg: #f2f2f6; --card: #fff; --ink: #1c1c1e; --mut: #6b6b72; --line: #e3e3e8; --chat: #cddcbf; --acc: #3d7fd9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #1d1d22; --ink: #ececf0; --mut: #9a9aa3; --line: #2c2c33; --chat: #22301c; --acc: #6aa2ff; } }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }   /* иначе .ed { display: grid } держал «Дописать» всегда раскрытым (28.10–30.10) */
  body { font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--ink); padding: 16px 16px 40px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; } .sub { color: var(--mut); margin: 4px 0 0; font-size: 15px; } .sub + .wk { margin-top: 16px; }
  .wk { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .wk b { flex: 1; text-align: center; font-size: 17px; }
  .wk button { min-width: 48px; min-height: 48px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; font-size: 20px; }
  .wk button:disabled { opacity: .3; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 22px 0 8px; }
  .st { background: var(--chat); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
  .b { background: var(--card); border-radius: 14px 14px 14px 5px; padding: 10px 12px; white-space: pre-wrap; font-size: 15px; }
  .b i { color: var(--mut); }
  .none { color: var(--mut); font-size: 15px; padding: 2px 4px 4px; }
  .msg { background: var(--card); border-radius: 14px; padding: 16px; color: var(--mut); }
  .msg a { color: var(--acc); }
  /* «Дописать» (шаг 2): слово за неделю, «Сверх урока», статус темы у индивидуала */
  button { font: inherit; color: var(--ink); }
  .more { margin-top: 8px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: rgba(255,255,255,.55); font-weight: 600; }
  .ed { background: var(--card); border-radius: 14px; padding: 12px; margin-top: 8px; display: grid; gap: 14px; }
  .ed h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin-bottom: 6px; }
  .ed textarea, .ed input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .ed textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .go { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--acc); color: #fff; font-weight: 600; }
  .go:disabled { opacity: .4; }
  .ok { color: var(--mut); font-size: 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); font-size: 15px; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .ev { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .ev span { flex: 1; }
  .x { min-width: 44px; min-height: 44px; border: 0; border-radius: 12px; background: var(--bg); font-size: 18px; }
  .les { margin-bottom: 10px; } .les b { font-weight: 600; }
  .hint { color: var(--mut); font-size: 14px; margin-top: 4px; }
  /* заходы ученика за неделю (ZHURNAL_STAT) — только тебе, в сводку родителю не входят */
  .zah { color: var(--mut); font-size: 14px; padding: 0 4px 8px; }
  .zah b { color: var(--ink); font-weight: 600; }
  /* ссылка родителю (шаг 3) */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .lnk { font-size: 14px; word-break: break-all; background: var(--bg); border-radius: 10px; padding: 10px; user-select: all; }
  .who { display: flex; align-items: center; gap: 8px; }
  .who span { flex: 1; }
  .sec { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .warn { color: #b45309; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Сводки недели</h1>
  <p class="sub" id="sub">Так их увидят родители в воскресенье в 18:00. Пока никому не уходит.</p>
  <p class="sub">Текст собирается из журнала сам: поправил журнал — поменялась сводка.</p>
  <div class="wk"><button id="prev" aria-label="Прошлая неделя">‹</button><b id="wk">…</b><button id="next" aria-label="Следующая неделя" disabled>›</button></div>
  <div id="out"><p class="msg">Собираю…</p></div>
</main>
<script>
(function () {
  'use strict';
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  // ключ учителя — тот же, что у журнала на этом устройстве: Кабинет, журнал или вход по логину
  var KEY = lsGet('zh:key', '') || lsGet('kab:key', '') || lsGet('zh:us', '');
  var APIS = (function () {
    try {
      var q = new URLSearchParams(location.search).get('api') || '';
      if (/^http:\/\/(127\.0\.0\.1|localhost)(:\d{2,5})?(\/[\w\/-]*)?$/.test(q)) return [q.replace(/\/$/, '')];
    } catch (e) { /* старый браузер — боевой адрес */ }
    var list = ['https://194-87-110-53.nip.io/cabinet', 'https://hw.157-228-128-116.nip.io/cabinet'], saved = lsGet('kab:api', '');
    return list.indexOf(saved) > 0 ? [saved].concat(list.filter(function (a) { return a !== saved; })) : list;
  })();
  var out = document.getElementById('out'), mon = null, cur = null;

  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function ru(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function day(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function msg(html) { out.innerHTML = '<p class="msg">' + html + '</p>'; }
  // текст сводки — HTML Телеграма от сервера: содержимое уже экранировано, разрешены только <b> и <i>
  function bubble(el, t) {
    var only = t.replace(/<\/?[bi]>/g, '');
    if (only.indexOf('<') < 0) el.innerHTML = t; else el.textContent = t;
  }
  function post(i, body, path) {
    return fetch(APIS[i] + '/zhurnal/svodki' + (path || ''), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .catch(function (e) { if (i + 1 < APIS.length) return post(i + 1, body, path); throw e; });
  }
  var last = null, open = {}, openR = {};   // last — ответ за открытую неделю; open / openR — у каких учеников раскрыто «Дописать» / «Родители»
  var BOT = /[?&]test=chat\b/.test(location.search) ? 'Lemma_test1_bot' : 'D_mathh_bot';
  function load(week, keep) {
    if (!KEY) { msg('Открой <a href="zhurnal.html">журнал</a> как учитель на этом устройстве, потом вернись сюда.'); return Promise.resolve(); }
    if (!keep) msg('Собираю…');
    return post(0, week ? { week: week } : {}).then(function (r) {
      if (r.status === 401) { msg('Журнал не узнал учителя. Войди в <a href="zhurnal.html">журнал</a> и открой эту страницу снова.'); return null; }
      if (r.status === 404) { msg('Сводки на сервере ещё не включены.'); return null; }
      return r.json();
    }).then(function (r) {
      if (!r) return;
      if (!r.ok) { msg('Не получилось собрать. Попробуй ещё раз.'); return; }
      show(r, keep);
    }, function () { msg('Нет связи с сервером. Проверь интернет и обнови страницу.'); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function show(r, keep) {
    last = r;
    mon = day(r.mon);
    if (!cur) cur = r.mon;
    var sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    document.getElementById('wk').textContent = (r.mon === cur ? 'Эта неделя · ' : '') + ru(mon) + ' – ' + ru(sun);
    document.getElementById('next').disabled = r.mon >= cur;
    var go = r.items.filter(function (x) { return x.text; }).length;
    document.getElementById('sub').textContent = 'Так их увидят родители в воскресенье в 18:00. ' +
      (r.rod ? 'По воскресеньям пока не уходит; подключённый родитель видит сводку сразу, но без твоего слова за неделю — оно до воскресенья 18:00 черновик. Сводок: '
        : 'Пока никому не уходит. Сводок: ') + go +
      (r.items.length > go ? ', без сводки: ' + (r.items.length - go) : '') + '.';
    var y = window.scrollY;
    if (!keep) { open = {}; openR = {}; }
    out.innerHTML = '';
    var j = null;
    r.items.forEach(function (x) {
      if (x.j !== j) { j = x.j; out.appendChild(el('h2', '', x.title)); }
      out.appendChild(card(x));
    });
    if (!r.items.length) msg('В журналах пока нет учеников.');
    if (keep) window.scrollTo(0, y);
  }
  // сохранить и пересобрать неделю: сводка сразу показывает, что вышло
  function save(body, status) {
    status.textContent = 'Сохраняю…';
    return post(0, body, '/put').then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (r) {
      if (!r.ok) { status.textContent = 'Не сохранилось. Попробуй ещё раз.'; return; }
      return load(last.mon, true);
    }, function () { status.textContent = 'Нет связи — не сохранилось.'; });
  }
  // «Дневник: 4 дня из 7 · последний раз вчера 21:10 · Задано 5, Оценки 2» — что ученик открывал за неделю (ТЗ 20, сессия 2)
  var EV = [['ocenki', 'Оценки'], ['uroki', 'Уроки'], ['chat', 'Чат'], ['card', 'карточки уроков']];   // «Задано» — первый экран, его видит каждый заход
  function when(ms) {
    var d = new Date(ms), t = new Date(), y = new Date(); y.setDate(y.getDate() - 1);
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return d.toDateString() === t.toDateString() ? 'сегодня ' + hm : d.toDateString() === y.toDateString() ? 'вчера ' + hm : ru(d) + ' ' + hm;
  }
  function zah(x) {
    var z = x.stat, row = el('div', 'zah'), bits = [];
    if (!z) return null;
    z = { days: +z.days || 0, last: +z.last || 0, ev: z.ev || {} };   // в разметку идут только числа
    if (!z.days) bits.push(z.last ? 'Дневник на этой неделе не открывал(а), последний раз ' + when(z.last) : 'Дневник ещё не открывал(а)');
    else {
      bits.push('Дневник: <b>' + z.days + ' ' + (z.days === 1 ? 'день' : z.days < 5 ? 'дня' : 'дней') + ' из 7</b>, последний раз ' + when(z.last));
      var ev = EV.filter(function (e) { return +z.ev[e[0]]; }).map(function (e) { return e[1] + ' ' + (+z.ev[e[0]]); });
      if (ev.length) bits.push('открывал(а): ' + ev.join(', '));
    }
    if (+x.due) bits.push('домашек к сроку: ' + (+x.done) + ' из ' + (+x.due) + ' сделано');
    row.innerHTML = '📊 ' + bits.join(' · ');
    return row;
  }
  function card(x) {
    var st = el('div', 'st'), b = el('div'), k = x.j + '.' + x.sid, zr = zah(x);
    if (zr) st.appendChild(zr);
    if (x.text) { b.className = 'b'; bubble(b, x.text); } else { b.className = 'none'; b.textContent = x.name + ': на этой неделе ничего не было — сводка не уйдёт.'; }
    st.appendChild(b);
    var btns = el('div', 'btns'), more = el('button', 'more', open[k] ? 'Свернуть' : '✍️ Дописать');
    btns.appendChild(more);
    st.appendChild(btns);
    var ed = editor(x);
    ed.hidden = !open[k];
    st.appendChild(ed);
    more.onclick = function () { open[k] = !open[k]; ed.hidden = !open[k]; more.textContent = open[k] ? 'Свернуть' : '✍️ Дописать'; };
    if (x.rod) {
      var n = (x.rod.who || []).length, rb = el('button', 'more'), rp = rodPanel(x);
      var label = function () { return openR[k] ? 'Свернуть' : n ? '👪 Родители: ' + n : '👪 Ссылка родителю'; };
      rb.textContent = label();
      rp.hidden = !openR[k];
      rb.onclick = function () { openR[k] = !openR[k]; rp.hidden = !openR[k]; rb.textContent = label(); };
      btns.appendChild(rb);
      st.appendChild(rp);
    }
    return st;
  }
  // «👪 Ссылка родителю» (ТЗ 22 D, шаг 3): ссылка в бота — родитель жмёт «Получать сводку» и сразу видит сводку
  function rodPost(body, status, btn) {
    status.textContent = 'Делаю…';
    if (btn) btn.disabled = true;
    var fail = function (t) { status.textContent = t; if (btn) btn.disabled = false; };
    return post(0, body, '/rod').then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (r) {
      if (!r.ok) { fail('Не получилось. Попробуй ещё раз.'); return; }
      return load(last.mon, true);
    }, function () { fail('Нет связи — не получилось.'); });
  }
  function rodPanel(x) {
    var ed = el('div', 'ed'), base = { j: x.j, sid: x.sid }, rod = x.rod, s0 = el('div', 'ok');
    var who = rod.who || [];
    if (who.length) {
      var w = el('div'); w.appendChild(el('h3', '', 'Получают сводку'));
      who.forEach(function (p) {
        var row = el('div', 'who'), off = el('button', 'sec', 'Отключить');
        row.appendChild(el('span', '', (p.nm || 'без имени в Телеграме') + (p.at ? ' · с ' + ru(new Date(p.at)) : '')));
        off.onclick = function () { if (confirm('Отключить? Сводка этому человеку больше не придёт.')) rodPost(Object.assign({ op: 'off', id: p.id }, base), s0); };
        row.appendChild(off); w.appendChild(row);
      });
      ed.appendChild(w);
    }
    var l = el('div'); l.appendChild(el('h3', '', 'Ссылка родителю'));
    if (rod.start) {
      var url = 'https://t.me/' + BOT + '?start=' + rod.start;
      var say = 'Здравствуйте! По этой ссылке раз в неделю в Телеграм будет приходить короткая сводка: что проходили, что задано, отметки. Откройте и нажмите «Получать сводку».';
      l.appendChild(el('div', 'lnk', url));
      var r1 = el('div', 'row'), share = el('a', 'go', 'Отправить в Телеграме'), cp = el('button', 'sec', 'Скопировать');
      share.href = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(say);
      share.target = '_blank'; share.rel = 'noopener';
      share.style.cssText = 'display:inline-flex;align-items:center;text-decoration:none';
      cp.onclick = function () {
        var done = function () { s0.textContent = 'Скопировано — вставь родителю в личку.'; };
        if (navigator.clipboard) navigator.clipboard.writeText(say + '\n' + url).then(done, function () { s0.textContent = 'Не скопировалось — выдели ссылку пальцем.'; });
        else s0.textContent = 'Выдели ссылку пальцем и скопируй.';
      };
      r1.appendChild(share); r1.appendChild(cp); l.appendChild(r1);
      l.appendChild(el('div', 'hint', 'Отправь один раз, в личку. По ней подключится ' + (rod.left === 1 ? 'ещё один человек' : 'до двух человек') + ', потом она перестанет работать.'));
      var nw = el('button', 'sec', 'Новая ссылка');
      nw.style.marginTop = '8px';
      nw.onclick = function () { if (confirm('Сделать новую? Эта ссылка перестанет работать. Кто уже подключён — останется.')) rodPost(Object.assign({ op: 'link' }, base), s0); };
      l.appendChild(nw);
    } else {
      if (x.talk) l.appendChild(el('div', 'warn', 'Открытых работ: ' + (+x.open) + '. Первая сводка будет тяжёлой — лучше сначала поговорить с родителем.'));
      var mk = el('button', 'go', 'Сделать ссылку');
      mk.style.marginTop = '8px';
      mk.onclick = function () { rodPost(Object.assign({ op: 'link' }, base), s0, mk); };
      l.appendChild(mk);
      l.appendChild(el('div', 'hint', who.length ? 'Ещё один родитель — сделай новую ссылку.' : 'Родитель нажмёт её, согласится одной кнопкой и сразу увидит сводку этой недели. Тебе придёт сообщение.'));
    }
    l.appendChild(s0);
    ed.appendChild(l);
    return ed;
  }
  var TYPES = [['ol', 'Олимпиада'], ['pr', 'Пробник'], ['kn', 'Конкурс'], ['dr', 'Другое']];
  var US = [[1, 'Познакомились'], [2, 'С подсказкой'], [3, 'Без подсказки']];
  function editor(x) {
    var ed = el('div', 'ed'), base = { j: x.j, sid: x.sid };
    // слово за неделю
    var w = el('div'); w.appendChild(el('h3', '', 'Слово за неделю'));
    var ta = el('textarea'); ta.maxLength = 300; ta.value = x.wk || '';
    ta.placeholder = 'Одно предложение: что получилось или над чем поработать дома';
    var r1 = el('div', 'row'), b1 = el('button', 'go', 'Сохранить'), s1 = el('span', 'ok', x.wk ? 'В сводке — строкой «Дмитрий».' : '');
    b1.disabled = true;
    ta.oninput = function () { b1.disabled = ta.value.trim() === (x.wk || ''); s1.textContent = ''; };
    b1.onclick = function () { b1.disabled = true; save(Object.assign({ op: 'wk', mon: last.mon, c: ta.value }, base), s1); };
    r1.appendChild(b1); r1.appendChild(s1);
    w.appendChild(ta); w.appendChild(r1); ed.appendChild(w);
    // статус темы — у индивидуала, у каждого урока недели
    if (x.les && x.les.length) {
      var u = el('div'); u.appendChild(el('h3', '', 'Как получается тема'));
      var s3 = el('div', 'ok');
      x.les.forEach(function (l) {
        var box = el('div', 'les'), t = el('div'); t.appendChild(el('b', '', l.date)); t.appendChild(document.createTextNode(' — ' + (l.topic || 'без темы')));
        var ch = el('div', 'chips');
        US.forEach(function (o) {
          var c = el('button', 'chip' + (l.us === o[0] ? ' on' : ''), o[1]);
          c.onclick = function () { save(Object.assign({ op: 'us', les: l.id, v: l.us === o[0] ? 0 : o[0] }, base), s3); };   // ещё раз — снять
          ch.appendChild(c);
        });
        box.appendChild(t); box.appendChild(ch); u.appendChild(box);
      });
      u.appendChild(s3); ed.appendChild(u);
    }
    // сверх урока
    var v = el('div'); v.appendChild(el('h3', '', 'Сверх урока'));
    var s2 = el('div', 'ok');
    (x.ev || []).forEach(function (e) {
      var row = el('div', 'ev'), name = (TYPES.filter(function (t) { return t[0] === e.t && t[0] !== 'dr'; })[0] || [0, ''])[1];
      row.appendChild(el('span', '', e.date + ' · ' + (name ? name + ': ' : '') + e.name + (e.res ? ' — ' + e.res : '')));
      var del = el('button', 'x', '×'); del.setAttribute('aria-label', 'Убрать');
      del.onclick = function () { save(Object.assign({ op: 'evdel', id: e.id }, base), s2); };
      row.appendChild(del); v.appendChild(row);
    });
    var t0 = 'ol', chips = el('div', 'chips');
    TYPES.forEach(function (t) {
      var c = el('button', 'chip' + (t[0] === t0 ? ' on' : ''), t[1]);
      c.onclick = function () { t0 = t[0]; Array.prototype.forEach.call(chips.children, function (z) { z.classList.toggle('on', z === c); }); };
      chips.appendChild(c);
    });
    var nm = el('input'); nm.placeholder = 'Что: школьный этап, ОГЭ по математике…'; nm.maxLength = 80;
    var rs = el('input'); rs.placeholder = 'Результат: 1 место из 100, 18 баллов'; rs.maxLength = 60;
    var dt = el('input'); dt.type = 'date';
    var today = new Date(), sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    dt.value = iso(today >= mon && today <= sun ? today : mon);
    var r2 = el('div', 'row'), b2 = el('button', 'go', 'Добавить');
    b2.disabled = true;
    nm.oninput = function () { b2.disabled = !nm.value.trim(); };
    b2.onclick = function () {
      var d = dt.value ? day(dt.value) : mon; b2.disabled = true;
      save(Object.assign({ op: 'ev', t: t0, name: nm.value, res: rs.value, date: ru(d) }, base), s2);
    };
    r2.appendChild(b2);
    var add = el('button', 'chip', '+ Добавить'), form = el('div');   // форма — по нажатию: олимпиада бывает не каждую неделю
    form.hidden = true;
    add.onclick = function () { form.hidden = false; add.hidden = true; nm.focus(); };
    [chips, nm, rs, dt, r2].forEach(function (z) { if (z !== chips) z.style.marginTop = '8px'; form.appendChild(z); });
    form.appendChild(el('div', 'hint', 'Попадёт в сводку той недели, на которую пришлась дата.'));
    v.appendChild(add); v.appendChild(form); v.appendChild(s2);
    ed.appendChild(v);
    return ed;
  }
  function shift(n) { if (!mon) return; var d = new Date(mon); d.setDate(d.getDate() + 7 * n); load(iso(d)); }
  document.getElementById('prev').onclick = function () { shift(-1); };
  document.getElementById('next').onclick = function () { shift(1); };
  load();
})();
</script>
</body>
