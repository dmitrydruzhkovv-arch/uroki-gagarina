<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жребий</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150d2e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="_движок/fonts/gf.css">
<!--
  Жребий (D 25.11.2026) — второй генератор: шар-лототрон, 3D-кубик, колесо; номера или имена из журнала.
  Открывается из журнала кнопкой «🎡 Жребий»: zhrebiy.html?n=<учеников>&j=<журнал>.
  Имена журнал кладёт в window.ZR_NAMES своего окна; эта вкладка забирает их через window.opener
  и держит только в sessionStorage — закрыл вкладку, имён нет. В адрес и на сервер имена не попадают.
  Выбор — crypto, каждый раз независимо (повторы возможны — слово D). Анимация лишь подстраивается под выбранного.
  Тот же файл лежит в школьном журнале (shkola_zhurnal/site) — отличается только путь к шрифтам.
-->
<style>
[hidden]{ display:none !important; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; background:#150d2e;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; touch-action:manipulation; }
/* фон — три мягких пятна цвета, перекрашиваются под того, кто выпал */
.blob{ position:fixed; border-radius:50%; filter:blur(80px); transition:background-color 1.4s; will-change:transform; pointer-events:none; }
#b1{ width:75vmax; height:75vmax; left:-25vmax; top:-30vmax; background:#6d28d9; opacity:.75; animation:dr1 24s ease-in-out infinite alternate; }
#b2{ width:80vmax; height:80vmax; right:-30vmax; bottom:-38vmax; background:#db2777; opacity:.6; animation:dr2 28s ease-in-out infinite alternate; }
#b3{ width:45vmax; height:45vmax; left:45%; top:25%; background:#0891b2; opacity:.35; animation:dr3 20s ease-in-out infinite alternate; }
@keyframes dr1{ to{ transform:translate(14vmax,10vmax) scale(1.12); } }
@keyframes dr2{ to{ transform:translate(-12vmax,-8vmax) scale(.92); } }
@keyframes dr3{ to{ transform:translate(-20vmax,12vmax) scale(1.2); } }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
.scene{ position:fixed; inset:0; z-index:2; }
.scene canvas{ position:absolute; inset:0; width:100%; height:100%; }
/* верхняя полоса */
.bar{ position:fixed; z-index:6; top:calc(10px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left)); right:calc(12px + env(safe-area-inset-right)); display:flex; align-items:center; gap:8px; pointer-events:none; }
.bar > *{ pointer-events:auto; }
.sp{ flex:1; pointer-events:none; }
.seg{ display:flex; gap:2px; padding:3px; border-radius:26px; background:rgba(255,255,255,.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.seg button{ height:44px; padding:0 16px; border-radius:22px; font-weight:700; font-size:16px; color:rgba(255,255,255,.85); white-space:nowrap; }
.seg button[aria-pressed="true"]{ background:#fff; color:#21114a; }
.ic{ width:48px; height:48px; border-radius:24px; background:rgba(255,255,255,.14); display:grid; place-items:center; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.ic svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
@media (max-width:640px){
  #modeSeg{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); }
  .seg button{ padding:0 13px; }
}
#hint{ position:fixed; z-index:5; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom)); text-align:center; font-size:clamp(15px,2.2vmin,21px); font-weight:600; color:rgba(255,255,255,.7); pointer-events:none; transition:opacity .4s; }
@media (max-width:640px){ #hint{ bottom:calc(76px + env(safe-area-inset-bottom)); } }
#toast{ position:fixed; z-index:7; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 22px; border-radius:18px; background:rgba(20,10,40,.85); font-weight:700; font-size:17px; text-align:center; }

/* ── шар: большой лотерейный шар с именем ── */
#drum{ transition:opacity .5s; }
#big{ --d:min(66vmin,640px); --c:#7c3aed; position:fixed; z-index:3; left:50%; top:52%; width:var(--d); height:var(--d); margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2); border-radius:50%;
  background:radial-gradient(circle at 34% 27%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 24%), radial-gradient(circle at 50% 46%, var(--c) 52%, color-mix(in srgb, var(--c) 55%, #000) 100%);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7), 0 0 140px -20px var(--c); display:grid; place-items:center; pointer-events:none; }
#big .disc{ width:68%; height:68%; border-radius:50%; background:radial-gradient(circle at 40% 35%, #fff 60%, #ece8f5 100%); display:grid; place-items:center; box-shadow:inset 0 -8px 22px rgba(0,0,0,.14), 0 2px 0 rgba(255,255,255,.4); }
#big .disc span{ color:#1d1040; font-weight:800; line-height:1.02; text-align:center; letter-spacing:-.02em; padding:0 6%; overflow-wrap:anywhere; }

/* ── кубик ── */
#dz{ --s:min(34vmin,270px); --s:min(max(34vmin,min(58vw,34vh)),270px); position:fixed; left:50%; top:52%; width:var(--s); height:var(--s); margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2); perspective:calc(var(--s)*5); }
#shadow{ position:absolute; left:8%; right:8%; top:calc(var(--s)*1.02); height:calc(var(--s)*.24); border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,0)); }
#lift, .tilt, #cube{ position:absolute; inset:0; transform-style:preserve-3d; }
.tilt{ transform:rotateX(-17deg) rotateY(23deg); }
.face, .core{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.core{ background:#1d1040; inset:3%; }
.face{ --c:#7c3aed; border-radius:17%; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.5), rgba(255,255,255,0) 45%), linear-gradient(150deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow:inset 0 0 0 calc(var(--s)*.018) rgba(255,255,255,.4), inset 0 calc(var(--s)*-.07) calc(var(--s)*.12) rgba(0,0,0,.25);
  color:#fff; font-weight:800; line-height:1.02; text-align:center; letter-spacing:-.02em; text-shadow:0 calc(var(--s)*.012) 0 rgba(0,0,0,.22); transition:box-shadow .3s; }
.face .t{ padding:0 7%; overflow-wrap:anywhere; }
.face.star{ --c:#f59e0b; color:#fff7d6; }
.face.dim .t{ opacity:.28; }   /* после падения соседние грани тише: выпавшая — главная, перевёрнутые имена не мешают */
.face.win{ box-shadow:inset 0 0 0 calc(var(--s)*.03) #fff, inset 0 calc(var(--s)*-.07) calc(var(--s)*.12) rgba(0,0,0,.25), 0 0 calc(var(--s)*.25) rgba(255,255,255,.7); }
.pips{ width:74%; height:74%; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); }
.pips i{ width:64%; height:64%; place-self:center; border-radius:50%; background:#fff; box-shadow:inset 0 calc(var(--s)*-.012) 0 rgba(0,0,0,.25); visibility:hidden; }
.pips i.on{ visibility:visible; }
#ring{ position:fixed; inset:0; z-index:4; pointer-events:none; }
#ring .nm{ position:absolute; transform:translate(-50%,-50%); padding:9px 16px; border-radius:22px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  font-weight:800; font-size:clamp(16px,2.8vmin,28px); white-space:nowrap; transition:transform .25s, background .25s, color .25s, opacity .3s; opacity:0; }
#ring.on .nm{ opacity:1; }
#ring .nm.hot{ background:rgba(255,255,255,.4); }
#ring .nm.win{ background:#fff; color:#1d1040; transform:translate(-50%,-50%) scale(1.3); }
#arrow{ position:fixed; z-index:4; width:0; height:0; pointer-events:none; }
#arrow svg{ position:absolute; overflow:visible; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); }

/* ── колесо ── */
#hub{ position:fixed; z-index:3; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 38% 30%, #fff 55%, #e9e4f3 100%); color:#1d1040;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5), inset 0 -6px 16px rgba(0,0,0,.12); pointer-events:none; transition:width .45s cubic-bezier(.2,1.4,.4,1), height .45s cubic-bezier(.2,1.4,.4,1), margin .45s cubic-bezier(.2,1.4,.4,1), box-shadow .45s; }
#hub span{ font-weight:800; line-height:1.02; text-align:center; letter-spacing:-.02em; padding:0 8%; overflow-wrap:anywhere; }
#hub.big{ box-shadow:0 0 0 10px var(--c,#7c3aed), 0 30px 80px -20px rgba(0,0,0,.7), 0 0 120px -10px var(--c,#7c3aed); }

/* ── настройки ── */
#set{ position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:rgba(8,3,20,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); touch-action:auto; }
.card{ width:min(440px,calc(100vw - 24px)); max-height:calc(100vh - 40px); overflow:auto; background:#1f1540; border-radius:26px; padding:22px 20px 18px; box-shadow:0 30px 80px -20px #000; }
.card h2{ font-size:21px; font-weight:800; margin-bottom:10px; }
.card .lab{ font-size:15px; font-weight:700; color:rgba(255,255,255,.6); margin:16px 0 8px; }
.rng{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0; }
.rng .l{ font-size:17px; font-weight:600; color:rgba(255,255,255,.75); width:32px; }
.step{ display:flex; align-items:center; gap:6px; }
.step button{ width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,.1); font-size:26px; font-weight:700; line-height:1; }
.step .val{ min-width:92px; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.06); }
.kids{ display:flex; flex-wrap:wrap; gap:8px; }
.kids button{ min-height:44px; padding:0 14px; border-radius:22px; background:rgba(255,255,255,.14); font-weight:700; font-size:16px; }
.kids button.off{ background:transparent; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22); color:rgba(255,255,255,.45); text-decoration:line-through; }
.tog{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; margin-top:14px; padding:10px 0; text-align:left; font-size:17px; font-weight:600; }
.tog i{ flex:none; width:52px; height:32px; border-radius:16px; background:rgba(255,255,255,.18); position:relative; transition:background .2s; }
.tog i::after{ content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .2s; }
.tog[aria-checked="true"] i{ background:#22c55e; }
.tog[aria-checked="true"] i::after{ transform:translateX(20px); }
.row{ display:flex; gap:10px; margin-top:16px; }
.btn{ flex:1; height:52px; border-radius:16px; font-size:17px; font-weight:700; background:rgba(255,255,255,.1); }
.btn.pri{ background:linear-gradient(135deg,#8b5cf6,#ec4899); }
</style>
</head>
<body>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="scene" id="scShar" hidden>
  <canvas id="drum"></canvas>
  <div id="big" hidden><div class="disc"><span></span></div></div>
</div>
<div class="scene" id="scKub" hidden>
  <div id="dz">
    <div id="shadow"></div>
    <div id="lift"><div class="tilt"><div id="cube">
      <div class="core" style="transform:translateZ(calc(var(--s)*.47))"></div>
      <div class="core" style="transform:rotateY(180deg) translateZ(calc(var(--s)*.47))"></div>
      <div class="core" style="transform:rotateY(90deg) translateZ(calc(var(--s)*.47))"></div>
      <div class="core" style="transform:rotateY(-90deg) translateZ(calc(var(--s)*.47))"></div>
      <div class="core" style="transform:rotateX(90deg) translateZ(calc(var(--s)*.47))"></div>
      <div class="core" style="transform:rotateX(-90deg) translateZ(calc(var(--s)*.47))"></div>
      <div class="face" style="transform:translateZ(calc(var(--s)/2))"></div>
      <div class="face" style="transform:rotateY(180deg) translateZ(calc(var(--s)/2))"></div>
      <div class="face" style="transform:rotateY(90deg) translateZ(calc(var(--s)/2))"></div>
      <div class="face" style="transform:rotateY(-90deg) translateZ(calc(var(--s)/2))"></div>
      <div class="face" style="transform:rotateX(90deg) translateZ(calc(var(--s)/2))"></div>
      <div class="face" style="transform:rotateX(-90deg) translateZ(calc(var(--s)/2))"></div>
    </div></div></div>
  </div>
  <div id="ring"></div>
  <div id="arrow" hidden><svg id="arrowSvg"></svg></div>
</div>
<div class="scene" id="scKol" hidden>
  <canvas id="wheel"></canvas>
  <div id="hub"><span></span></div>
</div>

<div class="bar">
  <div class="seg" id="modeSeg" role="group" aria-label="Способ">
    <button data-m="shar">Шар</button><button data-m="kub">Кубик</button><button data-m="kol">Колесо</button>
  </div>
  <span class="sp"></span>
  <div class="seg" id="whatSeg" role="group" aria-label="Что выбирать">
    <button data-w="name">Имена</button><button data-w="num">Номера</button>
  </div>
  <button class="ic" id="setBtn" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button class="ic" id="fsBtn" title="На весь экран" aria-label="На весь экран" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="hint"></div>
<div id="toast" hidden></div>
<div id="say" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<div id="set" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setH">
    <h2 id="setH">Настройки</h2>
    <div id="sKids"><div class="lab">Кто сегодня есть</div><div class="kids" id="kids"></div></div>
    <div id="sNum">
      <div class="lab">Номера</div>
      <div class="rng"><span class="l">от</span><div class="step"><button data-st="lo" data-d="-1" aria-label="Меньше">−</button><button class="val" id="vLo" data-ask="lo"></button><button data-st="lo" data-d="1" aria-label="Больше">+</button></div></div>
      <div class="rng"><span class="l">до</span><div class="step"><button data-st="hi" data-d="-1" aria-label="Меньше">−</button><button class="val" id="vHi" data-ask="hi"></button><button data-st="hi" data-d="1" aria-label="Больше">+</button></div></div>
      <div class="row" id="byJrow"><button class="btn" id="byJ"></button></div>
    </div>
    <button class="tog" id="tgSnd" role="switch" aria-checked="true"><span>Звук</span><i></i></button>
    <div class="row"><button class="btn pri" id="setOk">Готово</button></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const MAXN = 99999;
  const clampN = v => { v = Math.round(+v); return isFinite(v) ? Math.max(0, Math.min(MAXN, v)) : 0; };
  const J = (Q.get('j') || '').replace(/[^\w.-]/g, '').slice(0, 40);
  const SITE = location.pathname.split('/')[1] || '';
  const SK = 'zr:' + SITE + ':' + J;
  const mk = s => ({ get(k) { try { return JSON.parse(s.getItem(k)); } catch (_) { return null; } }, set(k, v) { try { s.setItem(k, JSON.stringify(v)); } catch (_) { /* приватный режим */ } } });
  const ss = mk(sessionStorage), ls = mk(localStorage);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── имена: из окна журнала → только в память этой вкладки ──
  let NAMES = null;
  try {
    const o = window.opener && window.opener.ZR_NAMES;
    if (o && o.j === J && Array.isArray(o.list) && o.list.length) { NAMES = o.list.map(s => String(s).slice(0, 40)); ss.set(SK + ':names', NAMES); }
  } catch (_) { /* окно журнала уже закрыто или чужое */ }
  if (!NAMES) { const s = ss.get(SK + ':names'); if (Array.isArray(s) && s.length) NAMES = s.map(String); }
  let N = NAMES ? NAMES.length : clampN(Q.get('n'));

  // ── состояние вкладки ──
  const st = ss.get(SK) || {};
  let mode = ['shar', 'kub', 'kol'].includes(st.mode) ? st.mode : (['shar', 'kub', 'kol'].includes(ls.get('zr:mode')) ? ls.get('zr:mode') : 'shar');
  let what = NAMES ? (st.what === 'num' ? 'num' : 'name') : 'num';
  let lo = clampN(st.lo), hi = clampN(st.hi);
  if (st.hi == null) {
    if (N) { lo = 1; hi = N; }
    else { const fr = ls.get('zr:free') || {}; lo = fr.lo == null ? 1 : clampN(fr.lo); hi = fr.hi == null ? 30 : clampN(fr.hi); }
  }
  if (lo > hi) [lo, hi] = [hi, lo];
  const off = st.off && typeof st.off === 'object' ? st.off : {};
  let sound = ls.get('zr:sound'); if (sound === null) sound = true;
  function save() {
    ss.set(SK, { mode, what, lo, hi, off });
    ls.set('zr:mode', mode); ls.set('zr:sound', sound);
    if (!N) ls.set('zr:free', { lo, hi });
  }

  // ── честный случай ──
  function rnd(n) {
    if (n <= 1) return 0;
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  const R = (a, b) => a + Math.random() * (b - a);
  const RI = (a, b) => Math.floor(R(a, b + 1));
  const PICK = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // кто участвует: имена журнала или номера диапазона (отсутствующие — вне игры)
  function pool() {
    if (what === 'name' && NAMES) { const a = NAMES.map((t, i) => ({ t, n: i + 1 })).filter(x => !off[x.n]); return { len: a.length, at: i => a[i], arr: a }; }
    const useOff = N && lo === 1 && hi === N, size = hi - lo + 1;
    if (size <= 3000) { const a = []; for (let v = lo; v <= hi; v++) if (!(useOff && off[v])) a.push({ t: String(v), n: v }); return { len: a.length, at: i => a[i], arr: a }; }
    return { len: size, at: i => ({ t: String(lo + i), n: lo + i }), arr: null };
  }
  // k показанных: все, если влезают (в порядке журнала), иначе k случайных и среди них выпавший
  function sample(P, k, w) {
    const wi = P.at(w);
    if (P.arr && P.len <= k) return { list: P.arr.slice(), win: P.arr.indexOf(wi) };
    const pick = new Set([w]);
    while (pick.size < Math.min(k, P.len)) pick.add(rnd(P.len));
    const list = shuffle([...pick].map(i => P.at(i)));
    return { list, win: list.findIndex(x => x.n === wi.n) };
  }
  const COL = ['#f43f5e', '#06b6d4', '#f59e0b', '#8b5cf6', '#10b981', '#f97316', '#3b82f6', '#ec4899', '#84cc16', '#6366f1', '#ef4444', '#14b8a6'];

      const w = b.dataset.st, dd = +b.dataset.d; let n = 0;
      (function step() { setVal(w, (w === 'lo' ? lo : hi) + dd * (n > 25 ? 10 : 1)); n++; hold = setTimeout(step, n === 1 ? 420 : n > 10 ? 50 : 110); })();
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'contextmenu'].forEach(ev => b.addEventListener(ev, stopHold));
  });
  addEventListener('blur', stopHold);
  // число целиком — нажать на него (поле ввода на айфоне в Яндекс Браузере не берёт касание, поэтому prompt)
  setEl.querySelectorAll('[data-ask]').forEach(b => {
    b.onclick = () => {
      const w = b.dataset.ask, v = prompt(w === 'lo' ? 'От какого числа' : 'До какого числа', w === 'lo' ? lo : hi);
      if (v === null || !/\d/.test(v)) return;
      const x = clampN(v.replace(/[^\d]/g, ''));
      if (w === 'lo') { lo = x; if (hi < lo) hi = lo; } else { hi = x; if (lo > hi) lo = hi; }
      renderSet();
    };
  });

  // ── на весь экран, экран не гаснет ──
  const de = document.documentElement;
  $('fsBtn').hidden = !(de.requestFullscreen || de.webkitRequestFullscreen);
  $('fsBtn').onclick = () => {
    const r = document.fullscreenElement || document.webkitFullscreenElement ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
    if (r && r.catch) r.catch(() => {});
  };
  function wake() { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {}); }
  document.addEventListener('visibilitychange', wake); wake();

  let rsT = 0;
  addEventListener('resize', () => { fxSize(); clearTimeout(rsT); rsT = setTimeout(() => { if (!busy) MODS[mode].resize(); else pend = true; }, 150); });
  fxSize(); renderWhat();
  // шрифт мог не успеть — подписи на canvas перерисуем, когда он придёт
  setMode(mode);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!busy) MODS[mode].refresh(); else pend = true; });
  window.__zr = { pool, get busy() { return busy; } };   // для проверки на стенде
})();
