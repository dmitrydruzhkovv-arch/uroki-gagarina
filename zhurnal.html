<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал — Математика 9 класс</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16131a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  try { if (localStorage.getItem('tema') === 'night') document.documentElement.dataset.theme = 'night'; } catch (_) {}
</script>
<link rel="stylesheet" href="_движок/fonts/gf.css">
<link rel="stylesheet" href="style.css">
<!--
  Журнал оценок (D, 29.09.2026). Эта страница — пустая оболочка: фамилий, имён и оценок
  в ней нет (152-ФЗ). Данные приходят с нашего сервера в России (vk_bot/zhurnal.py):
  ученику — по коду класса, только смотреть; D — по ключу Кабинета, можно менять.
-->
<style>
/* Журнал живёт в стилях сайта (style.css): те же цвета тем Λ / D, те же цвета предметов
   (.k-algebra, .k-geometriya, .k-veroyatnost → --g заливка, --s акцент, --glow свечение),
   те же часы с переключателем. Здесь — только своё: вкладки, таблица, окна. */
[hidden]{ display:none !important; }
:root{
  --z-line2:#d9d3e6; --z-head:#f2eff9; --z-hover:#f6f3fb; --z-focus:#16131a;
  --z-shadow:0 18px 50px -18px rgba(40,24,70,.35);
  /* расцветка плиток оценок — вся здесь. --mNb фон, --mNt цифра, --m5s / --m2s свет. Выбор D из вариантов
     (_стенд_журнала/варианты_плиток.mjs): «Лайм» в обеих темах (ночь — 03.10, день — 04.10). Пятёрка — лайм со светом,
     плохие оценки (2, 1, прочерк, незачёт) — алая плитка с красным светом; у четвёрки цифра зелёная, у тройки охристая,
     плитки у них серые, без света. */
  --m5b:linear-gradient(160deg,#e4fb6e,#a8e02a); --m5t:#2a3d00; --m5s:0 4px 14px -3px rgba(132,204,22,.8), 0 0 24px -6px rgba(132,204,22,.65);
  --m2b:linear-gradient(160deg,#ff5a5a,#dc2626); --m2c:#fff; --m2s:0 4px 14px -3px rgba(220,38,38,.6), 0 0 22px -6px rgba(220,38,38,.5);
  --m2u:#fff; --m2uc:#dc2626;   /* счётчик дней в углу плохой оценки; «!» — наоборот, этим цветом залит */
  --m2k:rgba(60,0,10,.34);      /* подложка под счётчиком дней: мелкие белые цифры на алом читаются */
  --m2t:#b42318;                /* красный текст на обычном фоне: «2 долга» у имени */
  --m4b:#e9e5f1; --m4t:#35701a; --m3b:#e9e5f1; --m3t:#8f5d02; --mnb:#ece9f2; --mnt:#5f5870;
  --z-tile:#f4f2f9; --z-chip:#efecf6; --z-rule:#ebe6f2;
  --z-ring:#fff;   /* светлая подложка под рамкой выбора, наведения и сдачи: рамка видна и на чёрной, и на белой плитке */
  --z-sent:#7c3aed; --z-sent2:#c4b5fd; --z-redo:#c026d3;
}
:root[data-theme="night"]{
  --z-line2:#3a2447; --z-head:#231430; --z-hover:#231430; --z-focus:#ff5cc8;
  --z-shadow:0 0 0 1px rgba(255,92,200,.18), 0 24px 60px -20px rgba(217,70,239,.45);
  /* ночь — «Лайм»: пятёрка кислотная, плохие оценки алые; у четвёрки цифра зеленоватая, у тройки желтоватая */
  --m5b:linear-gradient(160deg,#f0ff8a,#a6f01f); --m5t:#1c2b00; --m5s:0 0 18px -1px rgba(190,255,60,.85), 0 0 38px -6px rgba(170,240,40,.75);
  --m2b:linear-gradient(160deg,#ff5a5a,#d61f1f); --m2c:#fff; --m2s:0 0 16px -2px rgba(255,60,60,.9), 0 0 30px -8px rgba(255,60,60,.7);
  --m2u:#fff; --m2uc:#d61f1f; --m2t:#ffa6bd;
  --m4b:rgba(255,255,255,.085); --m4t:#b9e69c; --m3b:rgba(255,255,255,.085); --m3t:#ecca78; --mnb:rgba(255,255,255,.04); --mnt:#9a86ad;
  --z-tile:rgba(255,255,255,.04); --z-chip:rgba(255,255,255,.07); --z-rule:rgba(255,255,255,.07);
  --z-sent:#a78bfa; --z-sent2:#ddd6fe; --z-redo:#e879f9;
}
body{ background:var(--store); min-height:100vh; }
/* обложка журнала (D, 03.10) — та же живая стена, что за календарём на главной: fon.js и его стили в style.css.
   Шапка журнала ниже календаря, поэтому плитки мельче (data-cols / data-rows), а слева, под заголовком
   и вкладками, стена притушена сильнее */
.zh-hero{ position:relative; overflow:hidden; isolation:isolate; }
.zh-hero .shell{ position:relative; z-index:1; }
.zh-hero .gif-wall{ display:flex; align-items:center; }
.zh-hero .gw-plane{ position:relative; flex:0 0 128%; left:-12%; top:auto; width:auto; height:auto; gap:12px; }   /* высота — по своим плиткам, стоит по центру шапки: на любой ширине накрывает её целиком */
.zh-hero .gif-wall::after{ background:
  linear-gradient(90deg, var(--h-bg) 0%, color-mix(in srgb, var(--h-bg) 82%, transparent) 30%, color-mix(in srgb, var(--h-bg) 30%, transparent) 62%, color-mix(in srgb, var(--h-bg) 18%, transparent) 100%),
  linear-gradient(180deg, color-mix(in srgb, var(--h-bg) 55%, transparent) 0%, transparent 34%, transparent 70%, color-mix(in srgb, var(--h-bg) 70%, transparent) 100%); }
@media (min-width:701px){ .zh-hero{ min-height:186px; } }
@media (max-width:700px){ .zh-hero .gw-plane{ flex-basis:160%; left:-30%; gap:10px; } }
@media (orientation:landscape) and (max-height:520px){ .zh-hero .gif-wall{ display:none; } }
input, textarea{ font:inherit; color:inherit; }

/* шапка — как на главной */
.zh-hero{
  background:
    radial-gradient(900px 400px at 85% -10%, rgba(168,85,247,.20), transparent 60%),
    radial-gradient(700px 360px at 0% 110%, rgba(79,70,229,.14), transparent 60%),
    var(--h-bg);
  color:var(--h-txt); padding:22px 0 22px; border-bottom:1px solid var(--h-line);
}
[data-theme="night"] .zh-hero{
  background:
    radial-gradient(800px 380px at 90% -20%, rgba(217,70,239,.35), transparent 60%),
    radial-gradient(700px 400px at -5% 120%, rgba(190,18,60,.28), transparent 60%),
    var(--h-bg);
  border-bottom-color:rgba(255,92,200,.28);
}
.zh-back{ display:inline-block; font-size:14px; font-weight:700; color:var(--h-soft); text-decoration:none; }
.zh-back:hover{ color:var(--h-txt); }
.zh-title{ display:flex; align-items:baseline; gap:6px 16px; flex-wrap:wrap; margin-top:10px; }
.zh-title .kicker{ margin-top:0; }
@media (max-width:700px){ .zh-hero{ padding-top:60px; } }

/* вкладки предметов — заливка предмета, как кнопки на главной */
.tabs{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:18px; }
/* все три всегда яркие, в цвете предмета; выбранная — приподнята, с кольцом и свечением */
.tab{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 10px; border-radius:14px; font-weight:800; font-size:15px;
  color:var(--on); background:var(--g); box-shadow:0 8px 18px -14px var(--glow), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .18s var(--ease), box-shadow .2s; }
.tab i{ font-style:normal; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:17px; background:rgba(255,255,255,.28); }
.k-veroyatnost.tab i{ background:rgba(255,255,255,.7); }
.tab:hover{ transform:translateY(-1px); }
.tab:active{ transform:scale(.96); }
.tab[aria-selected="true"]{ transform:translateY(-3px) scale(1.04);
  box-shadow:0 0 0 3px var(--h-bg), 0 0 0 5px var(--s), 0 16px 30px -12px var(--glow); }
.tab[aria-selected="true"] i{ animation:tab-pop .45s var(--ease); }
@keyframes tab-pop{ 0%{ transform:scale(.7) rotate(-12deg); } 60%{ transform:scale(1.18) rotate(6deg); } 100%{ transform:none; } }
[data-theme="night"] .tab{ box-shadow:0 0 18px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); }
[data-theme="night"] .tab[aria-selected="true"]{ box-shadow:0 0 0 3px var(--h-bg), 0 0 0 5px var(--s), 0 0 34px -2px var(--glow); }
.tab .sh{ display:none; }
/* «Все» (D, 03.10): чёрная, как «Математика»; значок — полоски в цветах предметов журнала */
.tab.vse i{ display:flex; gap:2px; padding:7px 6px; align-items:stretch; background:rgba(255,255,255,.14); }
.tab.vse i b{ flex:1; border-radius:2px; background:var(--g); }
[data-theme="night"] .tab.vse{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), 0 0 18px -8px var(--glow); }
@media (max-width:560px){
  .tabs{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .tab{ flex-direction:column; justify-content:center; gap:5px; padding:9px 4px; font-size:13.5px; text-align:center; }
  .tab .lg{ display:none; } .tab .sh{ display:inline; }
  .tab i{ width:32px; height:32px; font-size:18px; }
  .tab.vse{ grid-column:1 / -1; flex-direction:row; gap:8px; padding:6px 12px; }   /* под тремя предметами — узкая полоса во всю ширину */
  .tab.vse i{ width:26px; height:26px; padding:6px 5px; }
  .tab.vse[aria-selected="true"]{ transform:translateY(-2px); }
  .st{ grid-column:1 / -1; margin-left:0; }
}
.st{ margin-left:auto; font-size:13px; color:var(--h-dim); display:flex; align-items:center; gap:6px; }
.st em{ font-style:normal; }
.st i{ width:8px; height:8px; border-radius:50%; background:var(--h-ghost); }
.st.ok i{ background:#16a34a; } .st.wait i{ background:#f59e0b; } .st.bad i{ background:#dc2626; }
[data-theme="night"] .st.ok i{ background:#6ee7b7; box-shadow:0 0 8px #6ee7b7; }

.zh-main{ padding-top:18px; }

/* панель учителя */
.tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; color:var(--sub); }
.btn{ padding:8px 14px; border-radius:11px; font-weight:700; text-align:center; background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1px var(--z-line2); }
.btn:hover{ background:var(--z-hover); }
.btn.pri{ background:var(--g); color:var(--on); box-shadow:0 10px 22px -14px var(--glow); }
.btn.danger{ color:#dc2626; }
[data-theme="night"] .btn.danger{ color:#ff7aa8; }
.warn{ color:#b45309; font-weight:600; }
[data-theme="night"] .warn{ color:#fcd34d; }
.codebox b{ color:var(--ink); }

/* таблица */
.wrap{ overflow:auto; max-height:calc(100vh - 120px); max-height:calc(100dvh - 120px); background:var(--card);
  border-radius:18px; box-shadow:inset 0 0 0 1px var(--line), 0 14px 40px -28px rgba(40,24,70,.35);
  -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
table.zt{ border-collapse:separate; border-spacing:0; font-size:14px; }
.zt th, .zt td{ border-right:1px solid transparent; border-bottom:1px solid transparent; }   /* линий сетки нет (плитки, ниже) — поля держат шаг */
.zt thead th{ position:sticky; top:0; z-index:2; background:var(--card); }
.zt thead tr:first-child th{ height:46px; }
.zt thead tr:nth-child(2) th{ top:46px; height:22px; }
.zt .nm{ position:sticky; left:0; z-index:3; background:var(--card); text-align:left; padding:6px 10px;
  min-width:128px; max-width:150px; font-weight:600; box-shadow:1px 0 0 var(--z-line2); }
.zt thead .nm{ z-index:4; font-size:12px; color:var(--muted); }
.zt tbody .nm b{ display:block; font-weight:800; font-size:15.5px; line-height:1.15; }   /* имя — крупно, фамилия — мелко и серым (D, 01.10) */
.zt tbody .nm span{ display:block; font-size:11.5px; color:var(--muted); font-weight:500; }
/* имя и фамилия — каждая в одну строку (D, 04.10): «Воротников · 2 долга» переносилось, строка становилась выше остальных,
   и плитки в ней растягивались. Не помещается — многоточием сжимается только сама фамилия (.fm): «· это ты» и число долгов
   остаются целыми. На широком экране столбец имён шире, и фамилии видны целиком */
.zt tbody .nm b, .zt tbody .nm span{ white-space:nowrap; max-width:130px; }
.zt tbody .nm b, .zt tbody .nm .fm{ overflow:hidden; text-overflow:ellipsis; }
.zt tbody .nm span{ display:flex; }
.zt tbody .nm .fm{ font-style:normal; min-width:0; }
.zt tbody .nm em{ flex:none; }
@media (min-width:1000px){ .zt .nm{ max-width:230px; } .zt tbody .nm b, .zt tbody .nm span{ max-width:210px; } }
.dt{ padding:3px 6px; font-size:13px; white-space:nowrap; cursor:pointer; border-top:3px solid transparent; text-align:center; }
.dt b{ display:block; font-weight:700; }
.dt small{ display:block; font-size:10.5px; color:var(--muted); font-weight:600; }
.dt:hover{ color:var(--s); }
.dt a{ display:block; color:inherit; text-decoration:none; }
.dt.go b i{ font-style:normal; font-size:11px; margin-left:3px; color:var(--s); }
.dt.go:hover b{ text-decoration:underline; text-underline-offset:3px; }
a.btn{ text-decoration:none; display:inline-flex; align-items:center; }
.dt.today b::after{ content:' · сегодня'; font-weight:700; font-size:10.5px; color:var(--s); }
.sub{ font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
td.c{ position:relative; width:46px; min-width:46px; height:44px; text-align:center; font-weight:800; font-size:15px; padding:2px; white-space:nowrap; }
td.c.long{ font-size:11px; white-space:normal; line-height:1.1; font-weight:600; }
.m5{ background:var(--m5b); color:var(--m5t); } .m4{ background:var(--m4b); color:var(--m4t); }
.m3{ background:var(--m3b); color:var(--m3t); } .m2{ background:var(--m2b); color:var(--m2c); }
.mn{ background:var(--mnb); color:var(--mnt); font-weight:600; }
.edit td.c{ cursor:pointer; }
.zt tfoot th.nm{ font-size:12px; color:var(--muted); vertical-align:top; }
.zt tfoot td{ vertical-align:top; padding:6px; font-size:12px; color:var(--sub); cursor:pointer; max-width:92px; }
.zt tfoot td:hover{ background:var(--z-hover); }
/* галочка D в углу темы и домашки: «урок готов», «домашка задана» — видит только он */
.edit .zt tfoot td[data-les]{ position:relative; padding-right:26px; min-width:124px; }   /* шире: галочка не должна ломать слова темы */
.rdy{ position:absolute; top:5px; right:5px; width:19px; height:19px; padding:0; border-radius:6px; display:grid; place-items:center; font-size:13px; line-height:1; font-weight:900;
  color:transparent; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--z-line2); }
.rdy:hover{ box-shadow:inset 0 0 0 1.5px #16a34a; }
.rdy[aria-pressed="true"]{ background:#16a34a; color:#fff; box-shadow:none; }
[data-theme="night"] .rdy[aria-pressed="true"]{ background:#34d399; color:#062b1c; }
/* журналы: переключатель над предметами */
.jsw{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.jr{ padding:6px 12px; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--h-soft); box-shadow:inset 0 0 0 1px var(--h-line); }
.jr[aria-pressed="true"]{ background:var(--h-txt); color:var(--h-bg); box-shadow:none; }
.jr.add{ color:var(--h-dim); border:1px dashed var(--h-line); box-shadow:none; }
/* оформление: точка в начале строки, кнопки Ж К Ч • */
.li{ display:block; padding-left:1.05em; text-indent:-1.05em; }
.li::before{ content:'•'; display:inline-block; width:1.05em; text-indent:0; color:var(--s); font-weight:900; }
.tl .li{ padding-left:.9em; text-indent:-.9em; } .tl .li::before{ width:.9em; }
.dlg .lbl{ display:flex; align-items:center; gap:8px; }
.fmtbar{ margin-left:auto; display:inline-flex; gap:4px; text-transform:none; letter-spacing:0; }
.fmtbar button{ width:30px; height:28px; padding:0; display:grid; place-items:center; line-height:1; border-radius:8px; font-size:14px; color:var(--ink); box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--card); }
.fmtbar button:hover{ background:var(--z-hover); }
/* «Математика» — чёрная с белой М (D, 01.10) */
.k-mat{ --g:linear-gradient(135deg,#3a3642 0%,#16131a 60%,#000 100%); --s:#16131a; --on:#fff; --t:#ecebef; --d:#16131a; --glow:rgba(0,0,0,.45); }
[data-theme="night"] .k-mat{ --g:linear-gradient(135deg,#2c2436 0%,#0a070d 70%,#000 100%); --s:#f3ecff; --on:#fff; --t:rgba(255,255,255,.08); --d:#f3ecff; --glow:rgba(255,255,255,.35); }
/* лента дней индивидуала: предмет дня — цветом под днём недели и датой */
.dt.sjc:hover{ color:var(--on); }
.dt.sjc.go b i{ color:inherit; opacity:.75; }   /* стрелка «урок на сайте» на цветной шапке — цветом текста, а не предмета (иначе оранжевая на оранжевом) */
.dt.sjc.today b::after{ color:inherit; }
/* выбор предмета дня в окне «День» */
.sjpick{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.sjpick button{ padding:9px 14px; min-width:44px; border-radius:12px; font-weight:800; font-size:14px; color:var(--on); background:var(--g); opacity:.45;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3); transition:opacity .15s, transform .15s var(--ease); }
.sjpick.go button{ opacity:1; }
.sjpick button[aria-pressed="true"]{ opacity:1; transform:translateY(-2px); box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--s), 0 10px 20px -12px var(--glow); }
.dlg input[type="date"]{ width:auto; min-width:170px; font-weight:700; }
.fprev{ white-space:pre-line; font-size:14px; background:var(--z-head); border-radius:10px; padding:8px 10px; margin-top:6px; }
.fprev-h{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:2px; }
/* тема дня: по две строки на урок, на один урок — четыре */
.tl{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; word-break:break-word; line-height:1.3; }
.tl.one{ -webkit-line-clamp:4; }
.hw .tl{ white-space:pre-line; }
.tl .no{ font-weight:800; color:var(--muted); }
.tl.site{ color:var(--sub); font-style:italic; }
.zt tfoot td{ min-width:138px; }
.clamp{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; white-space:pre-line; word-break:break-word; }
.tp td{ color:var(--ink); font-weight:600; }
.addc{ padding:0 10px; vertical-align:middle; }
.empty{ padding:40px 20px; text-align:center; color:var(--sub); }

/* легенда (D, 03.10): отдельная карточка ниже таблицы — значок и два-три слова, по столбцам */
.lgd{ margin-top:30px; padding:16px 20px 18px; border-radius:18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px 30px;
  font-size:13px; line-height:1.3; color:var(--sub); background:color-mix(in srgb, var(--card) 60%, transparent); box-shadow:inset 0 0 0 1px var(--line); }
.lgd h4{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.lgd ul{ list-style:none; display:grid; gap:7px; }
.lgd li{ display:flex; align-items:center; gap:9px; }
.lgd .ch{ display:inline-flex; gap:3px; flex:none; justify-content:flex-end; min-width:105px; }   /* значки — столбцом справа, подписи — слева в линию */
.lgd .dbt .ch{ min-width:54px; }
.lgd .ch i{ display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 4px; border-radius:6px; font-style:normal; font-weight:800; font-size:12px; box-shadow:0 0 0 1px rgba(127,127,127,.14); }
.lgd .ch i small{ align-self:flex-start; margin:2px -1px 0 2px; padding:0 2px; border-radius:3px; font:800 8.5px/1.3 'JetBrains Mono',ui-monospace,monospace; color:var(--m2u); background:var(--m2k); }

.fpv.x-docx{ background:linear-gradient(135deg,#60a5fa,#2563eb); } .fpv.x-xlsx{ background:linear-gradient(135deg,#4ade80,#16a34a); }

.btn.sm{ padding:5px 10px; font-size:13px; }

.note{ font-size:13px; color:var(--muted); margin-top:4px; }
/* сдача ДЗ (шаг 4): 📷 — есть фото; кольцо «сдано» и пунктир «на доработку» — в блоке плиток */
td.c .cam{ position:absolute; bottom:1px; right:2px; font-size:10px; font-style:normal; line-height:1; }
.zt tbody tr.me th.nm{ background:color-mix(in srgb, #7c3aed 12%, var(--card)); box-shadow:inset 4px 0 0 #7c3aed, 1px 0 0 var(--z-rule); }
.zt tbody tr.me td.c.d.mine{ cursor:pointer; }
.stbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; color:var(--sub); }
.btn.queue{ background:#7c3aed; color:#fff; box-shadow:0 10px 22px -14px #7c3aed; }
.thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.thumbs button{ width:84px; height:84px; border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--z-head); padding:0; }
.thumbs img{ width:100%; height:100%; object-fit:cover; display:block; }
.pop-sub{ background:var(--z-head); border-radius:12px; padding:8px 10px; margin-bottom:10px; font-size:13px; color:var(--sub); }
.pop-sub .thumbs button{ width:64px; height:64px; }
.pop-sub .pop-x button.ok{ background:#16a34a; color:#fff; box-shadow:none; }
.pop-sub .pop-x button.redo{ color:#c026d3; }
.dlg .big{ display:flex; align-items:center; gap:12px; margin:6px 0; }
.dlg .big i{ font-style:normal; display:grid; place-items:center; min-width:48px; height:48px; padding:0 8px; border-radius:12px; font-size:22px; font-weight:800; box-shadow:inset 0 0 0 1px var(--z-line2); }
.dlg .kod{ font-size:26px; letter-spacing:.3em; text-align:center; font-family:'JetBrains Mono',ui-monospace,monospace; }
.dlg .err{ color:#dc2626; font-size:14px; margin-top:8px; min-height:1em; }
.view{ position:fixed; inset:0; z-index:60; background:#0e0a12; display:flex; flex-direction:column; }
.view .vstage{ flex:1; min-height:0; display:grid; place-items:center; padding:8px; }

.view .vtools{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px; }
.view .vtools button{ min-width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,.12); color:#fff; font-weight:700; padding:0 10px; display:grid; place-items:center; }
.view .vtools button[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px #fff; }
.view .vtools button span{ width:20px; height:20px; border-radius:50%; display:block; }
.view .vtools button b{ border-radius:50%; background:#fff; display:block; }

.view #vN{ color:#fff; align-self:center; }
.thumbs button{ position:relative; }
.thumbs .inked{ position:absolute; right:3px; bottom:3px; font-style:normal; font-size:13px; background:#fff; border-radius:6px; padding:0 2px; }

.view .vbar button{ padding:10px 16px; border-radius:12px; background:#fff; color:#1a1720; font-weight:700; }
.view .vtools button.vrot{ display:flex; gap:5px; margin-left:8px; } .view .vtools button.vrot + .vrot{ margin-left:0; }
/* файл урока на весь экран (D, 07.10): картинка или листы PDF листаются внутри журнала */
.fview .vtools{ justify-content:flex-end; }
.fview .vname{ flex:1 1 180px; min-width:0; padding:0 4px; color:#fff; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fview .vdoc{ flex:1; min-height:0; position:relative; outline:none; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:8px; display:flex; flex-direction:column; }
/* margin:auto — по центру, а когда лист шире или выше экрана — листается от края, ничего не обрезано */
.fview .vpages{ flex:none; margin:auto; display:flex; flex-direction:column; gap:10px; }
.fview .vpage{ flex:none; margin:0 auto; background:#fff; border-radius:4px; overflow:hidden; box-shadow:0 10px 40px -10px rgba(0,0,0,.6); }
.fview .vpage canvas{ width:100%; height:100%; display:block; border-radius:0; box-shadow:none; background:#fff; }
.fview .vimg{ flex:none; margin:auto; display:block; border-radius:6px; background:#fff; box-shadow:0 10px 40px -10px rgba(0,0,0,.6); }
.fview .vmsg{ margin:auto; max-width:340px; color:#d8cfe6; font-size:15px; text-align:center; }
.view .vcount{ color:#fff; align-self:center; }
/* телефон: сверху имя файла и «Свернуть», под ними размер и «Скачать»; рамки браузера убирать незачем */
@media (max-width:560px){ .fview .vtools{ justify-content:center; } .fview .vtools button{ order:2; } .fview .vname{ flex:1 1 calc(100% - 136px); } .fview .vtools [data-v="x"]{ order:1; } .fview .vtools [data-v="fs"]{ display:none; } }
#footLinks:not(:empty)::before{ content:' · '; }
/* дни и месяцы (D, 01.10): одна дата на день, жирная черта между днями, листаем по месяцам */
.zt th.dend, .zt td.dend{ border-right:2px solid transparent; }   /* конец дня; у плиток и подписей поле шире — в блоке плиток */
.months{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.mo{ padding:6px 12px; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--sub); box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--card); }
.mo[aria-selected="true"]{ background:var(--g); color:var(--on); box-shadow:0 8px 18px -12px var(--glow); }
/* ── таблица плитками (D, 03.10) — как дни календаря на главной, в обеих темах ──
   Сетки линий нет. Клетка — скруглённая плитка: пустая едва видна, оценка красит её целиком.
   Пятёрка светится и «дышит», двойка и кол светятся красным, четвёрка и тройка — просто плитки.
   Рамок у оценок нет; между днями — просвет. Цвета — переменные --m… и --z-… в начале файла.
   :root в начале каждого правила — чтобы оно было сильнее прежних правил таблицы выше. */
:root .zt .nm{ box-shadow:1px 0 0 var(--z-rule); }
:root .zt td.c{ border:2px solid transparent; border-radius:11px; background:var(--z-tile) padding-box; box-shadow:none; }
:root .zt td.c.m5{ --z-tile:var(--m5b); z-index:1; }
:root .zt td.c.m4{ --z-tile:var(--m4b); }
:root .zt td.c.m3{ --z-tile:var(--m3b); }
:root .zt td.c.m2{ --z-tile:var(--m2b); z-index:1; }
:root .zt td.c.mn{ --z-tile:var(--mnb); }
/* свет — отдельным слоем точно по плитке; красный горит ровно, у пятёрки на ноутбуке дышит прозрачностью (без перерисовки тени) */
:root .zt td.c.m5::after, :root .zt td.c.m2::after{ content:''; position:absolute; inset:0; border-radius:9px; pointer-events:none; }
:root .zt td.c.m5::after{ box-shadow:var(--m5s); }
:root .zt td.c.m2::after{ box-shadow:var(--m2s); }
@keyframes z-glow{ 50%{ opacity:.5; } }
@media (hover:hover) and (pointer:fine){ :root .zt td.c.m5::after{ animation:z-glow 3.2s ease-in-out infinite; } }   /* дышит только на ноутбуке: на телефоне сотни вечных анимаций — батарея и рывки */
/* между днями — просвет: правое поле шире, а угол скруглён с запасом, чтобы плитка осталась плиткой */
:root .zt td.c.dend{ border-right-width:12px; width:56px; min-width:56px; border-radius:11px 21px 21px 11px / 11px; }
/* рамки — внутри плитки (тенью внутрь), а не контуром по клетке: у последней клетки дня поле справа шире */
:root .zt td.c.sub-sent{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 4px var(--z-sent); animation:z-sent 1.8s ease-in-out infinite; }   /* сдано, ждёт проверки */
@keyframes z-sent{ 50%{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 4px var(--z-sent2); } }
:root .zt td.c.sub-redo::before{ content:''; position:absolute; inset:3px; border:2px solid var(--z-ring); outline:2px dashed var(--z-redo); outline-offset:-2px; border-radius:7px; pointer-events:none; }   /* на доработке: пунктир по светлой подложке */
:root .edit .zt td.c:not(.cur):hover{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 3px var(--s); }   /* выбранную клетку наведение не перебивает */
:root .zt tbody tr.me td.c.d.mine:hover{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 3px var(--z-sent); }

<script>
(function () {
  'use strict';

  // все предметы; у журнала — свои из них (meta.subj). mat — «Математика» у индивидуалов (D, 01.10)
  var ALLSUBJ = [
    { id: 'alg', name: 'Алгебра', short: 'Алгебра', k: 'k-algebra', icon: '🧮', kurs: 'algebra' },
    { id: 'geo', name: 'Геометрия', short: 'Геометрия', k: 'k-geometriya', icon: '📐', kurs: 'geometriya' },
    { id: 'ver', name: 'Вероятность и статистика', short: 'Вероятность', k: 'k-veroyatnost', icon: '🎲', kurs: 'veroyatnost' },
    { id: 'mat', name: 'Математика', short: 'Математика', k: 'k-mat', icon: 'М', kurs: '' }
  ];
  var SUBJ = ALLSUBJ.slice(0, 3);
  // журнал в работе: g9 — Гагарин; индивидуалы и группы — свои (D, 01.10, ТЗ 16 «класс из одного»)
  var MAIN_J = 'g9', J = MAIN_J, META = { title: '9 класс · Школа Гагарина', subj: ['alg', 'geo', 'ver'], kind: 'cls' }, JOURNALS = [], creating = '';
  // лента (D, 01.10): у индивидуала и мини-группы не вкладки предметов, а одна лента дней; предмет — у дня, цветом
  function feed() { return META.kind !== 'cls'; }
  // «Все» (D, 03.10): у класса — ещё одна вкладка, все предметы одной лентой дней; день — в цвете предмета, как у индивидуала
  var ALL = 'all';
  function mix() { return feed() || tab === ALL; }
  function inTab(l) { return feed() || (tab === ALL ? SUBJ.some(function (s) { return s.id === l.subj; }) : l.subj === tab); }
  function tabOk() { return tab === ALL ? feed() || SUBJ.length > 1 : SUBJ.some(function (x) { return x.id === tab; }); }   // у индивидуала вкладок нет — «Все» просто помнится до возврата к классу
  function setMeta(m) {
    META = m || META;
    SUBJ = feed() ? ALLSUBJ.slice() : (META.subj || []).map(function (id) { return ALLSUBJ.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean);
    if (!SUBJ.length) SUBJ = ALLSUBJ.slice(0, 3);
    if (!tabOk()) tab = SUBJ[0].id;
    var kk = document.querySelector('.zh-title .kicker');
    if (kk) kk.textContent = META.title + ' · 2026/27';
  }
  var QUICK = ['5', '4', '3', '2', '1', 'н', '–'];
  var LS = { kabKey: 'kab:key', key: 'zh:key', pass: 'zh:pass', tab: 'zh:tab', api: 'kab:api', cache: 'zh:cache', out: 'zh:out', next: 'zh:next', j: 'zh:j', sk: 'zh:sk' };
  // кэш и неотправленные правки — у каждого журнала свои (у Гагарина — прежние ключи)
  function lk(base) { return J === MAIN_J ? base : base + ':' + J; }
  var KINDS = ['stu', 'les', 'mark', 'cfg', 'file', 'sub'];
  var DEBT_DAYS = 14;   // двойку пересдать за две недели (D, 30.09)

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без памяти — только на этот раз */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* нечего чистить */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  // оформление темы и домашки (D, 01.10): **жирный**, *курсив*, __подчёркнутый__, строка с «• » или «- » — точка.
  // Сначала esc — HTML из текста не пройдёт
  // маркер — только на границе слова (начало строки, пробел, скобка, кавычка), внутри — не пробел с краёв
  var FMT_B = /(^|[\s(«"'>])\*\*(\S(?:.*?\S)?)\*\*(?=$|[\s.,;:!?)»"'<])/g,
    FMT_U = /(^|[\s(«"'>])__([^_\s](?:[^_]*[^_\s])?)__(?=$|[\s.,;:!?)»"'<])/g,
    FMT_I = /(^|[\s(«"'>])\*([^*\s](?:[^*]*[^*\s])?)\*(?=$|[\s.,;:!?)»"'<])/g;
  function fmt(t) {
    var L = esc(t).split('\n').map(function (ln) {
      var li = /^\s*(?:•|-|–)\s+/.test(ln);
      if (li) ln = ln.replace(/^\s*(?:•|-|–)\s+/, '');
      ln = ln.replace(FMT_B, '$1<b>$2</b>').replace(FMT_U, '$1<u>$2</u>').replace(FMT_I, '$1<i>$2</i>');
      return { li: li, h: li ? '<span class="li">' + ln + '</span>' : ln };
    });
    // строка с точкой — сама с новой строки: перенос рядом с ней дал бы пустую строку
    return L.map(function (x, i) { return x.h + (i < L.length - 1 && !x.li && !L[i + 1].li ? '\n' : ''); }).join('');
  }
  function plain(t) { return String(t || '').replace(FMT_B, '$1$2').replace(FMT_U, '$1$2').replace(FMT_I, '$1$2').replace(/^\s*•\s+/gm, ''); }

  /* ── адрес сервера: как у Кабинета — прямой RF и запасной через шлюз (с VPN) ── */
  var APIS = (function () {
    try {
      var q = new URLSearchParams(location.search).get('api') || '';
      if (/^http:\/\/(127\.0\.0\.1|localhost)(:\d{2,5})?(\/[\w\/-]*)?$/.test(q)) return [q.replace(/\/$/, '')];
    } catch (e) { /* старый браузер — боевой адрес */ }
    var list = ['https://194-87-110-53.nip.io/cabinet', 'https://hw.157-228-128-116.nip.io/cabinet'];
    var saved = lsGet(LS.api, '');
    return list.indexOf(saved) > 0 ? [saved].concat(list.filter(function (a) { return a !== saved; })) : list;
  })();
  var API = APIS[0];
  function nextApi() { if (APIS.length > 1) API = APIS[(APIS.indexOf(API) + 1) % APIS.length]; }

  function post(path, body, headers) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    var h = { 'Content-Type': 'application/json' };
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    if (body && typeof body === 'object' && !('j' in body) && path.indexOf('/zhurnal/') === 0 && path !== '/zhurnal/view') body.j = J;
    return fetch(API + path, { method: 'POST', headers: h, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(guard);
        return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; });
      }, function (e) { clearTimeout(guard); throw e; });
  }

  /* ── состояние ── */
  var S = blank();
  // ключ Кабинета на этом устройстве — D узнан сам
  var teacherKey = lsGet(LS.key, '') || lsGet(LS.kabKey, '');
  var mode = teacherKey ? 'teacher' : 'view';
  if (mode === 'teacher' && /^[a-z0-9]{2,16}$/.test(lsGet(LS.j, ''))) J = lsGet(LS.j, '');
  if (mode === 'teacher' && lsGet('zh:mk', '') === J) creating = J;   // журнал заведён, но сервер его ещё не видел
  var outbox = mode === 'teacher' ? lsGet(lk(LS.out), []) : [];
  var tab = lsGet(LS.tab, 'alg');
  if (/^#(alg|geo|ver|mat|all)$/.test(location.hash)) tab = location.hash.slice(1);
  if (mode === 'teacher' && J !== MAIN_J) setMeta(lsGet(lk(LS.cache), {}).meta || { title: 'Журнал', subj: ['mat'], kind: 'ind' });
  if (!tabOk()) tab = SUBJ[0].id;
  var botEntry = /[#&][ts]=/.test(location.hash);   // пришёл по ссылке из бота или по личной ссылке
  var loaded = false, cur = null, pendingRender = false, scrollPos = {};
  var meId = null, sdachaOn = false;   // ученик, вошедший через бота (сдача ДЗ, шаг 4)
  LS.ck = 'zh:ck'; LS.vhod = 'zh:vhod';
  function ck() { return lsGet(LS.ck, ''); }
  function sk() { return lsGet(LS.sk, ''); }   // личная ссылка ученика без Телеграма: <журнал>.<ключ>
  function stuH() { return sk() ? { 'X-Stu-Key': sk() } : { 'X-Chat-Key': ck() }; }
  function chatBase() { return API.replace(/\/cabinet$/, ''); }
  var BOT = /[?&]test=chat\b/.test(location.search) ? 'Lemma_test1_bot' : 'D_mathh_bot';

  function blank() { return { stu: {}, les: {}, mark: {}, cfg: {}, file: {}, sub: {} }; }
  function fromObjects(list) {
    var n = blank();
    (list || []).forEach(function (o) {
      if (!n[o.k] || !o.d || typeof o.d !== 'object') return;
      var d = o.d; d.id = o.id; d.ts = o.ts; n[o.k][o.id] = d;
    });
    return n;
  }
  function vals(o) { return Object.keys(o).map(function (k) { return o[k]; }); }

  /* ── даты: учебный год, сентябрь → май ── */
  function dkey(date) {
    var m = /^(\d{1,2})\.(\d{1,2})/.exec(date || '');
    if (!m) return 99999;
    var mo = +m[2];
    return (mo >= 8 ? 0 : 10000) + mo * 100 + (+m[1]);
  }
  // 'ДД.ММ' → дата учебного года: сентябрь—декабрь этого года, январь—август следующего
  function realDate(date) {
    var m = /^(\d{1,2})\.(\d{1,2})/.exec(date || '');
    if (!m) return null;
    var now = new Date(), y0 = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1;
    return new Date(+m[2] >= 8 ? y0 : y0 + 1, +m[2] - 1, +m[1]);
  }
  function ddmm(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function todayStr() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function lessons(subj) {
    // «Все»: предметы этого журнала; два предмета в один день — в порядке вкладок, уроки одного предмета рядом
    var all = subj === ALL && !feed();
    var si = function (l) { for (var i = 0; i < SUBJ.length; i++) if (SUBJ[i].id === l.subj) return i; return -1; };
    return vals(S.les).filter(function (l) { return feed() || (all ? si(l) >= 0 : l.subj === subj); }).sort(function (a, b) {
      return dkey(a.date) - dkey(b.date) || (all ? si(a) - si(b) : 0) || (a.ord || 0) - (b.ord || 0) || (a.id < b.id ? -1 : 1);
    });
  }
  function students() {
    return vals(S.stu).sort(function (a, b) {
      return (a.ord || 0) - (b.ord || 0) || String(a.fam).localeCompare(String(b.fam), 'ru');
    });
  }
  // урок сайта для урока журнала: тот же предмет и дата. Два урока в один день (сдвоенный) —
  // первый к первому, второй ко второму; на сайте один — оба ведут в него
  function siteLink(l) {
    var x = siteLesson(l.subj, l.date, lessons(l.subj).filter(function (y) { return y.date === l.date; }).indexOf(l));
    return x ? './#' + x.kurs + '-' + x.u.n : '';
  }
  // урок сайта (его ведёт Хирон) по предмету, дате и номеру урока в этот день; нет — null
  function siteLesson(subj, date, nth, exact) {
    if (J !== MAIN_J) return null;   // сайт уроков — 9 класс Гагарина; у остальных журналов тема и домашка только свои
    try {
      var sj = SUBJ.filter(function (s) { return s.id === subj; })[0];
      var kurs = (window.DATA && DATA.kursy || []).filter(function (k) { return k.id === sj.kurs; })[0];
      if (!kurs) return null;
      var same = kurs.uroki.filter(function (u) { return u.date === date; }).sort(function (a, b) { return a.n - b.n; });
      if (!same.length || (exact && nth >= same.length)) return null;
      return { kurs: kurs.id, u: same[Math.min(Math.max(nth, 0), same.length - 1)] };
    } catch (e) { return null; }
  }
  // домашка сайта коротко, для клетки журнала: первая строка каждого задания, учебник, веб-ДЗ, срок
  function siteHw(u) {
    var dz = u && u.dz, out = [];
    if (!dz) return '';
    (dz.web || []).forEach(function (x) { out.push('На телефоне: ' + x.label); });
    (dz.print || []).concat(dz.tetrad || []).forEach(function (t) { out.push(String(t).split('\n')[0]); });
    (dz.uchit || []).forEach(function (t) { out.push('Выучить: ' + String(t).split('\n')[0]); });
    if ((dz.book || []).length) out.push('Учебник: ' + dz.book.map(function (x) { return '№ ' + x.no + (x.bukvy ? ' (' + x.bukvy + ')' : ''); }).join('; '));
    return out.join('\n') + (out.length && dz.due ? '\nк ' + dz.due : '');
  }
  // тема и домашка в журнале: своя — если D написал, иначе с сайта (Хирону не заливать в два места)
  function topicOf(l) {
    if (l.topic) return { t: l.topic };
    var x = siteLesson(l.subj, l.date, lessons(l.subj).filter(function (y) { return y.date === l.date; }).indexOf(l), true);
    return { t: x ? x.u.title || '' : '', site: !!x };
  }
  // домашка дня на сайте — у сдвоенного урока она бывает записана у любого из двух
  function siteDayHw(subj, date) {
    for (var n = 0, x; (x = siteLesson(subj, date, n, true)); n++) if (siteHw(x.u)) return siteHw(x.u);
    return '';
  }
  function hwOf(l) {
    if (l.hw) return { t: l.hw };
    var t = siteDayHw(l.subj, l.date);
    return { t: t, site: !!t };
  }

  // что за оценка: 5-балльная («4», «2 (55 доделать)»), из 100 («85», «85/100», «70%»), дробью («4/5»),
  // зачёт / незачёт, «н» — не был, «–» — прочерк. red — долг: пересдать за DEBT_DAYS дней
  function markInfo(v) {
    var s = String(v || '').trim().toLowerCase();
    if (!s) return { cls: '' };
    if (/^незач/.test(s)) return { cls: 'm2', red: true };
    if (/^(зач|✓)/.test(s)) return { cls: 'm4' };
    if (s[0] === 'н') return { cls: 'mn' };
    if (/^[–-](?:\s|\(|$)/.test(s)) return { cls: 'm2' };   // прочерк — плохая оценка на вид (D, 03.10); не долг: срока пересдачи у него нет. «-2 балла» — не прочерк
    var m = /^(\d+(?:[.,]\d+)?)\s*(?:\/\s*(\d+))?\s*(%)?/.exec(s);
    if (!m) return { cls: '' };
    var n = parseFloat(m[1].replace(',', '.')), of = m[2] ? +m[2] : 0, cls;
    if (of || m[3] || n > 5) {
      var pc = Math.min(100, of ? n / of * 100 : n);
      cls = pc >= 85 ? 'm5' : pc >= 65 ? 'm4' : pc >= 45 ? 'm3' : 'm2';
    } else cls = ['m2', 'm2', 'm2', 'm3', 'm4', 'm5'][Math.floor(n)] || 'm2';
    return { cls: cls, red: cls === 'm2' };
  }
  function markCls(v) { return markInfo(v).cls; }
  // оценка и комментарий: «2 (55 доделать)» (старая запись) → 2 и «55 доделать». Новые записи — поле c
  function splitMark(m) {
    var v = String(m && m.v || '').trim();
    var x = /^(незач[её]т|незач|зач[её]т|зач|н|–|-|\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?%?)\s*(.*)$/i.exec(v);
    var g = x ? x[1] : v, note = x ? x[2].replace(/^\(\s*|\s*\)$/g, '').trim() : '';
    return { g: g, c: (m && m.c) || note };
  }
  // долг по клетке: до какого числа пересдать и сколько дней осталось (0 — сегодня последний день)
  function debtOf(l, v) {
    if (!markInfo(v).red) return null;
    var d = realDate(l.date);
    if (!d) return null;
    d.setDate(d.getDate() + DEBT_DAYS);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return { until: ddmm(d), left: Math.round((d - t) / 864e5) };
  }
  function debtCount(sid) {
    return Object.keys(S.mark).filter(function (id) {
      var p = id.split('.'), l = S.les[p[0]];
      if (l && p[2] === 'd' && l.sh && prevSameDay(l, l.date, l.subj)) return false;   // ДЗ сдвоенного урока не видна — не считаем
      return p[1] === sid && l && inTab(l) && debtOf(l, S.mark[id].v);   // долги открытого предмета (Атлас, 30.09); во «Все» — по всем предметам журнала
    }).length;
  }
  // клетка целиком: класс, содержимое, подсказка
  function cellView(id) {
    var parts = id.split('.'), l = S.les[parts[0]], m = S.mark[id], v = m ? m.v : '';
    var inf = markInfo(v), dbt = l ? debtOf(l, v) : null, cls = 'c ' + parts[2] + ' ' + inf.cls + (splitMark(m).g.length > 3 ? ' long' : '');
    var sm = splitMark(m), inner = esc(sm.g);
    if (/[0-9a-zа-яё]/i.test(sm.c)) inner += '<i class="cmt" aria-label="есть комментарий"></i>';
    if (dbt) { cls += ' debt' + (dbt.left < 0 ? ' zlate' : ''); inner += '<sup>' + (dbt.left < 0 ? '!' : dbt.left + 'д') + '</sup>'; }
    var sb = parts[2] === 'd' ? S.sub[parts[0] + '.' + parts[1]] : null;
    if (sb) {
      cls += sb.st === 'sent' ? ' sub-sent' : sb.st === 'redo' ? ' sub-redo' : '';
      inner += '<i class="cam" aria-label="сдано фото">📷</i>';
    }
    if (parts[2] === 'd' && parts[1] === meId) cls += ' mine';
    if (mode !== 'teacher') { /* A и ✎ — пометки для D, детям без легенды непонятны */ }
    else if (m && m.by === 'auto') inner += '<i class="src" aria-hidden="true">A</i>';
    else if (m && m.av) inner += '<i class="src" aria-hidden="true">✎</i>';
    return { cls: cls, inner: inner };
  }
  // подсказка к клетке: кто, когда, что за урок, кто поставил, долг
  function cellTip(id) {
    var parts = id.split('.'), l = S.les[parts[0]], p = S.stu[parts[1]], m = S.mark[id];
    if (!l || !p) return '';
    var shared = parts[2] === 'd' && sharedCount(l) > 1;
    var t = '<b>' + esc(p.fam + ' ' + p.name) + '</b>' + esc(l.date) + ' · ' + (parts[2] === 'd' ? (shared ? 'ДЗ, общая на ' + sharedCount(l) + ' урока' : 'ДЗ') : 'урок') +
      (l.topic ? '\n' + esc(plain(l.topic).slice(0, 90)) : '');
    var sm = splitMark(m);
    var sb1 = parts[2] === 'd' ? S.sub[parts[0] + '.' + parts[1]] : null;
    if (!m || (!m.v && !sm.c)) return t + (sb1 ? '\n📷 ' + ({ sent: 'Сдано, ждёт проверки', redo: 'На доработке', checked: 'Сдано и проверено' }[sb1.st] || '') : '\nОценки нет');
    t += '\nОценка: ' + esc(sm.g || '—') + (sm.c ? '\nКомментарий: ' + esc(sm.c) : '');
    if (m.by === 'auto') t += '\nПоставила автоматика' + (m.an ? ': ' + esc(m.an) : '');
    else if (m.av) t += '\nD исправил. Автоматика ставила ' + esc(m.av) + (m.an ? ' (' + esc(m.an) + ')' : '');
    var dbt = debtOf(l, m.v);
    var sb0 = parts[2] === 'd' ? S.sub[parts[0] + '.' + parts[1]] : null;
    if (sb0) t += '\n📷 ' + ({ sent: 'Сдано, ждёт проверки', redo: 'На доработке', checked: 'Сдано и проверено' }[sb0.st] || '');
    if (dbt) t += '\n' + (dbt.left < 0 ? 'Долг: срок пересдачи вышел ' + dbt.until : 'Долг: пересдать до ' + dbt.until + (dbt.left === 0 ? ' — сегодня последний день' : ', осталось ' + dbt.left + ' дн.'));
    return t;
  }

  /* ── месяцы и средний балл (D, 01.10) ── */
  var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  var monthSel = {};   // предмет → '09' | 'all'; при открытии — текущий месяц
  function monthOf(date) { var m = /^\d{1,2}\.(\d{1,2})/.exec(date || ''); return m ? ('0' + m[1]).slice(-2) : ''; }
  function months(L) {
    var out = [];
    L.forEach(function (l) { var m = monthOf(l.date); if (m && out.indexOf(m) < 0) out.push(m); });   // L уже по порядку учебного года
    return out;
  }
  function defaultMonth(MS) {
    var now = monthOf(todayStr()), tk = dkey(todayStr()), best = MS[0];
    if (MS.indexOf(now) >= 0) return now;
    MS.forEach(function (m) { if (dkey('01.' + m) <= tk) best = m; });   // каникулы — последний прошедший месяц
    return best || 'all';
  }
  // показать месяц урока l, если сейчас открыт другой (не «Весь год»). → true, если переключили
  function goMonth(l) {
    var key = mix() ? tab : l.subj, sel = monthSel[key], m = monthOf(l.date);
    if (!sel || sel === 'all' || !m || m === sel) return false;
    monthSel[key] = m; resetScroll(key);
    return true;
  }
  // забыть прокрутку предмета: таблица заново встанет к сегодняшним урокам. Старая таблица
  // больше не своя — иначе render() первым делом запишет её прокрутку обратно
  function resetScroll(subj) { delete scrollPos[subj]; var w = $('wrap'); if (w && w.dataset.subj === subj) w.dataset.subj = ''; }
  // кому показан средний балл: нажал на ученика — видно, ещё раз — спрятано. Помнится на этом устройстве
  var avgOn = lsGet('zh:avg', {});
  // оценка → число для среднего: 1–5 как есть, из 100 → 5/4/3/2, незачёт → 2; зачёт, «н», «–» не считаются
  function gradeVal(v) {
    var s = String(v || '').trim().toLowerCase();
    if (!s) return null;
    if (/^незач/.test(s)) return 2;
    if (/^(зач|✓|н|–|-)/.test(s)) return null;
    var m = /^(\d+(?:[.,]\d+)?)\s*(?:\/\s*(\d+))?\s*(%)?/.exec(s);
    if (!m) return null;
    var n = parseFloat(m[1].replace(',', '.')), of = m[2] ? +m[2] : 0;
    if (of || m[3] || n > 5) { var pc = Math.min(100, of ? n / of * 100 : n); return pc >= 85 ? 5 : pc >= 65 ? 4 : pc >= 45 ? 3 : 2; }
    return Math.max(1, Math.min(5, n));
  }
  // средний по строке за показанный период. Пустая клетка ДЗ, когда домашка была задана и следующий урок
  // предмета уже прошёл, а фото не сдано и ученик был на уроке, — как 2 («несданное — двойка», D 01.10)
  function rowAvg(sid, LY, LA, today) {
    var sum = 0, n = 0, tk = dkey(today);
    LY.forEach(function (x) {
      x.cols.forEach(function (c) {
        var m = S.mark[c.l.id + '.' + sid + '.' + c.w], g = gradeVal(splitMark(m).g);
        if (g == null && c.w === 'd' && !(m && m.v)) {
          var hw = String(hwOf(c.l).t || '').trim(), next = LA.filter(function (l) { return dkey(l.date) > dkey(c.l.date) && (feed() || l.subj === c.l.subj); })[0];   // во «Все» — следующий урок того же предмета
          var absent = /^н/i.test(String((S.mark[x.l.id + '.' + sid + '.u'] || {}).v || ''));
          if (hw && hw !== '—' && next && dkey(next.date) < tk && !S.sub[c.l.id + '.' + sid] && !absent) g = 2;
        }
        if (g != null) { sum += g; n++; }
      });
    });
    return n ? { v: (sum / n).toFixed(1).replace('.', ','), n: n } : null;
  }

  /* ── сдвоенный урок: одна домашка на оба (D, 30.09) ──
     У второго урока дня sh=1 — его ДЗ-клетки нет, домашка общая, живёт в клетке ДЗ первого урока
     и стоит после второго: урок · урок · ДЗ */
  function layout(L) {
    // пара «урок + сдвоенный»: тот же день, а у класса — и тот же предмет (во «Все» в один день рядом стоят разные)
    var pair = function (a, b) { return b.sh && a.date === b.date && (feed() || a.subj === b.subj); };
    return L.map(function (l, i) {
      var joinedNext = L[i + 1] && pair(l, L[i + 1]);
      var own = l, j = i;
      while (j > 0 && pair(L[j - 1], L[j])) j--;
      own = L[j];
      var cols = [{ l: l, w: 'u' }];
      if (!joinedNext) cols.push({ l: own, w: 'd', n: i - j + 1 });
      return { l: l, own: own, cols: cols, joinedNext: !!joinedNext };
    });
  }
  // на сколько уроков общая ДЗ, клетка которой у урока l (1 — обычная)
  function sharedCount(l) {
    var L = lessons(l.subj), i = L.indexOf(l), n = 1;
    while (i >= 0 && L[i + n] && L[i + n].sh && L[i + n].date === l.date) n++;
    return n;
  }
  function prevSameDay(l, date, subj) {   // урок того же дня перед l (для галочки «общая ДЗ»)
    var L = lessons(subj).filter(function (x) { return x.date === date && x !== l; });
    if (!l) return L[L.length - 1] || null;
    return L.filter(function (x) { return (x.ord || 0) < (l.ord || 0); }).pop() || null;
  }
  // файлы урока: без w — те, что у темы; 'hw' — в блоке домашки; '*' — все (урок удаляют)
  function filesOf(lid, w) {
    return vals(S.file).filter(function (f) { return f.les === lid && (w === '*' || (f.w || '') === (w || '')); }).sort(function (a, b) { return (a.ord || 0) - (b.ord || 0); });
  }
  // файлы блока домашки, клетка которой у урока own; у сдвоенного — со всех его уроков: домашку могли объединить позже
  function hwFiles(own) {
    var L = lessons(own.subj), i = L.indexOf(own), out = [];
    for (var k = 0, n = i < 0 ? 0 : sharedCount(own); k < n; k++) out = out.concat(filesOf(L[i + k].id, 'hw'));
    return out;
  }
  function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' МБ' : Math.max(1, Math.round(n / 1024)) + ' КБ'; }

  /* ── правки D: операция на сервер, побеждает более поздняя ── */
  function newCode() {   // без похожих знаков: 0/о, 1/l, 3/з
    var a = 'abcdefghkmnprstuvwxyz2456789', out = '';
    for (var i = 0; i < 8; i++) out += (i === 4 ? '-' : '') + a[Math.floor(Math.random() * a.length)];
    return out;
  }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function stamp(k, id) { var p = S[k][id]; return Math.max(Date.now(), (p && p.ts || 0) + 1); }
  function put(k, id, d) {
    var ts = stamp(k, id), o = {};
    Object.keys(d).forEach(function (x) { o[x] = d[x]; });
    o.id = id; o.ts = ts; S[k][id] = o;
    queue({ t: 'put', k: k, id: id, d: d, ts: ts });
  }
  function del(k, id) {
    var ts = stamp(k, id);
    delete S[k][id];
    queue({ t: 'del', k: k, id: id, ts: ts });
  }
  function queue(op) {
    outbox = outbox.filter(function (x) { return !(x.k === op.k && x.id === op.id); });
    outbox.push(op);
    save();
    clearTimeout(queue.t);
    queue.t = setTimeout(sync, 500);
  }
  function save() { lsSet(lk(LS.out), outbox); var c = {}; KINDS.forEach(function (k) { c[k] = S[k]; }); c.meta = META; lsSet(lk(LS.cache), c); }

  var busy = false, again = false, retryT = null, stNote = '';   // stNote — «проверено, ушло в Телеграм»: не затирать «сохранено»
  function sync() {
    if (mode !== 'teacher') return;
    if (busy) { again = true; return; }
    busy = true; setSt('wait', outbox.length ? 'сохраняю…' : 'сверяю…');
    var sending = outbox.slice(0, 1500);
    var jSent = J;
    post('/zhurnal/sync', { ops: sending, j: J, create: creating === J }, { Authorization: 'Bearer ' + teacherKey })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw { badKey: true };
        if (jSent !== J) throw { gone: true };   // пока шёл запрос, D переключил журнал — ответ уже не про него
        if (r.status === 404 && jSent !== MAIN_J && creating !== J) { switchJournal(MAIN_J, true); throw { gone: true }; }   // журнала нет — к Гагарину
        if (r.status === 200 && r.data.ok && (r.data.j || MAIN_J) !== J) throw { http: 'old' };   // сервер не знает журналов — данные чужого не брать (Гагарин — как раньше)
        lsSet(LS.api, API.indexOf('https://hw.') === 0 ? API : '');
        if (r.status !== 200 || !r.data.ok) throw { http: r.status };
        outbox = outbox.filter(function (o) {
          return !sending.some(function (s) { return s.k === o.k && s.id === o.id && s.ts === o.ts; });
        });
        if (creating === J) { creating = ''; lsDel('zh:mk'); }
        if (r.data.meta) setMeta(r.data.meta);
        if (r.data.journals) { JOURNALS = r.data.journals; renderJournals(); }
        var next = fromObjects(r.data.objects);
        outbox.forEach(function (op) {   // правки, сделанные пока шёл запрос, — сверху
          if (op.t === 'put') { var o = JSON.parse(JSON.stringify(op.d)); o.id = op.id; o.ts = op.ts; next[op.k][op.id] = o; }
          else delete next[op.k][op.id];
        });
        var changed = JSON.stringify(next) !== JSON.stringify(S);
        S = next; loaded = true; save();
        setSt('ok', stNote || 'сохранено'); stNote = '';
        if (changed || !sync.once) render();
        sync.once = true;
        if (pendingSwitch && !outbox.length) setTimeout(function () { switchJournal(pendingSwitch); }, 0);
      })
      .catch(function (e) {
        if (e && e.gone) return;
        if (e && e.badKey) {
          // неотправленные оценки не трогаем: сервер мог просто перезапускаться
          setSt('bad', 'ключ не подошёл — правки ждут на этом устройстве');
          $('footLinks').innerHTML = '<button class="link" data-act="teacher">Ввести ключ учителя заново</button> · <button class="link" data-act="asview">Смотреть по коду класса</button>';
          if (!loaded) $('main').innerHTML = '<div class="gate"><h2>Ключ учителя не подошёл</h2><p>Журнал на этом устройстве пока не открывался.</p>' +
            '<p style="margin-top:14px"><button class="btn pri" data-act="teacher">Ввести ключ</button> <button class="btn" data-act="asview">Смотреть по коду</button></p></div>';
          clearTimeout(retryT); retryT = setTimeout(sync, 60000);
          return;
        }
        if (!e || !e.http) nextApi();
        setSt('bad', 'нет связи — правки сохранятся, когда появится сеть');
        clearTimeout(retryT); retryT = setTimeout(sync, 6000);
      })
      .then(function () {
        busy = false;
        if (again) { again = false; sync(); }
      });
  }
  function setSt(cls, txt) { var st = $('st'); st.hidden = false; st.className = 'st ' + cls; $('stTxt').textContent = txt; }

  /* ── ученик: смотреть по коду класса ── */
  // code — введённый руками код класса; без него — пропуск этого устройства из прошлого входа
  function view(code, tries) {
    if (!loaded) $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
    var body = code ? { code: code } : { pass: lsGet(LS.pass, '') };
    post('/zhurnal/view', body)
      .then(function (r) {
        if (r.status === 403) {
          lsDel(LS.pass);
          gate(code ? 'Код не подошёл. Проверь его или спроси у учителя.' : 'Учитель сменил код класса — введи новый.');
          return;
        }
        if (r.status === 429) { gate('Слишком много неверных попыток. Подожди 10 минут.'); return; }
        if (r.status !== 200 || !r.data.ok) throw { http: r.status };
        lsSet(LS.api, API.indexOf('https://hw.') === 0 ? API : '');
        if (r.data.pass) lsSet(LS.pass, r.data.pass);
        if (r.data.j) J = r.data.j;
        if (r.data.meta) setMeta(r.data.meta);
        S = fromObjects(r.data.objects); loaded = true; render();
      })
      .catch(function (e) {
        if (!e || !e.http) nextApi();
        if ((tries || 0) < 1) return view(code, 1);
        $('main').innerHTML = '<div class="gate"><h2>Нет связи с журналом</h2><p>Проверь интернет. Если включён VPN — попробуй без него.</p>' +
          '<p style="margin-top:14px"><button class="btn pri" data-act="retry">Ещё раз</button></p></div>';
      });
  }
  function gate(err) {
    loaded = false;
    $('main').innerHTML =
      '<div class="gate"><h2>Код класса</h2><p>Журнал открывается по коду. Его говорит учитель на уроке.</p>' +
      '<form id="gateForm"><input id="gateIn" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" aria-label="Код класса" placeholder="код">' +
      '<button class="btn pri" type="submit">Открыть</button></form><div class="err">' + esc(err || '') + '</div></div>';
    var f = $('gateForm');
    f.onsubmit = function (ev) { ev.preventDefault(); var c = $('gateIn').value.trim(); if (c) view(c); };
    setTimeout(function () { var i = $('gateIn'); if (i) i.focus(); }, 50);
  }

  /* ── отрисовка ── */
  function renderTabs() {
    var st = $('st');
    $('tabs').innerHTML = feed() ? '' : SUBJ.map(function (s) {
      return '<button class="tab ' + s.k + '" role="tab" data-tab="' + s.id + '" aria-selected="' + (s.id === tab) + '">' +
        '<i>' + s.icon + '</i><span class="lg">' + esc(s.name) + '</span><span class="sh">' + esc(s.short) + '</span></button>';
    }).join('') + (SUBJ.length > 1 ? '<button class="tab vse k-mat" role="tab" data-tab="' + ALL + '" aria-selected="' + (tab === ALL) + '" title="Все предметы подряд: день — в цвете предмета">' +
      '<i>' + SUBJ.map(function (s) { return '<b class="' + s.k + '"></b>'; }).join('') + '</i><span class="lg">Все</span><span class="sh">Все предметы</span></button>' : '');
    $('tabs').appendChild(st);   // статус сохранения — в строке предметов, справа
    // «← Уроки» ведёт на сайт 9 класса Гагарина: ученику индивидуального журнала там делать нечего (D, 01.10)
    // пока журнал грузится по входу из бота или личной ссылке, чей он — ещё неизвестно: тоже прячем
    $('zhBack').hidden = mode !== 'teacher' && (feed() || (!loaded && (botEntry || !!ck() || !!sk())));
    document.body.className = (mix() ? 'k-mat' : SUBJ.filter(function (s) { return s.id === tab; })[0].k) + (mode === 'teacher' ? ' edit' : '');
  }

  /* ── журналы (D, 01.10): Гагарин, индивидуалы, мини-группы — у D переключатель, у ученика — если их несколько ── */
  function renderJournals() {
    var el = $('jsw'), list = JOURNALS.length ? JOURNALS : [{ j: J, title: META.title }];
    var show = mode === 'teacher' || list.length > 1;
    el.hidden = !show;
    if (!show) return;
    el.innerHTML = list.map(function (x) {
      return '<button class="jr" data-jr="' + esc(x.j) + '" aria-pressed="' + (x.j === J) + '">' + esc(x.title) + '</button>';
    }).join('') + (mode === 'teacher' && JOURNALS.length ? '<button class="jr add" data-act="newjournal" title="Новый журнал: индивидуал или группа">＋ Журнал</button>' : '');
  }
  var pendingSwitch = '';
  function switchJournal(j, force) {

    h += '<div class="wrap" id="wrap"><table class="zt"><thead><tr><th class="nm" rowspan="2">Ученик</th>';
    DAYS.forEach(function (g) {

  // карточка урока — у всех; D из неё же идёт в правку (✎)

    hideTip();
    var rdy = t.closest('[data-rdy]');
    if (rdy && mode === 'teacher') {   // галочка готовности: пометка D, урок не открываем
      var rl = S.les[rdy.dataset.id], rd = {};
      if (rl) {
        Object.keys(rl).forEach(function (k) { if (k !== 'id' && k !== 'ts') rd[k] = rl[k]; });
        if (rd[rdy.dataset.rdy]) delete rd[rdy.dataset.rdy]; else rd[rdy.dataset.rdy] = 1;
        put('les', rl.id, rd); render();
      }
      return;
    }
    var les = t.closest('[data-les]');
    if (les) { if (cur) closeCell(); openLesson(les.dataset.les); return; }
    if (cur && !t.closest('#pop')) closeCell();
  });

  // кнопка оформления не забирает фокус — выделение в поле остаётся
  document.addEventListener('mousedown', function (ev) { if (ev.target.closest && ev.target.closest('[data-fmt]')) ev.preventDefault(); });

  document.addEventListener('change', function (ev) {
    if (ev.target.classList && ev.target.classList.contains('upFile') && ev.target.files.length) { uploadFiles(ev.target.dataset.lid, ev.target.files, ev.target.dataset.w); return; }
    if (ev.target.id === 'subIn' && ev.target.files.length) { submitPhotos(ev.target); return; }
    var row = ev.target.closest('.srow');
    if (row) saveStudentRow(row);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (cur) closeCell(); else closeDlg(); return; }
    if (!cur || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var inInput = ev.target.tagName === 'INPUT';
    if (!inInput) {
      var k = ev.key.toLowerCase();
      if (/^[1-5]$/.test(k)) { ev.preventDefault(); setMark(k); return; }
      if (k === 'н' || k === 'y') { ev.preventDefault(); setMark('н'); return; }
      if (k === '-') { ev.preventDefault(); setMark('–'); return; }
      if (k === 'backspace' || k === 'delete') { ev.preventDefault(); setMark(''); return; }
      var mv = { arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1] }[k];
      if (mv) { ev.preventDefault(); moveCell(mv[0], mv[1]); }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (mode === 'teacher') sync();
    else if (loaded && meId) meLoad().catch(function () { /* нет связи — покажем, что было */ });
    else if (loaded && lsGet(LS.pass, '')) view('');
  });

  /* ── тема: Λ — дневная, D — ночная; выбор общий с главной (localStorage «tema») ── */
  function markTheme() {
    var night = document.documentElement.dataset.theme === 'night';
    document.querySelectorAll('[data-tema]').forEach(function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.tema === 'night') === night));
    });
    var mc = document.querySelector('meta[name=theme-color]');
    if (mc) mc.content = night ? '#0a0510' : '#16131a';
  }
  function setTheme(v) {
    if (v === 'night') document.documentElement.dataset.theme = 'night';
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('tema', v); } catch (e) { /* без памяти — только на этот раз */ }
    markTheme();
  }
  function tick() {
    var n = new Date();
    $('clock').textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map(function (x) { return ('0' + x).slice(-2); }).join(':');
    setTimeout(tick, 1000 - n.getMilliseconds() + 5);
  }
  markTheme(); tick();

  /* ── старт ── */
  var stEl = document.createElement('span');
  stEl.className = 'st'; stEl.id = 'st'; stEl.hidden = true; stEl.innerHTML = '<i></i><em id="stTxt"></em>';
  document.body.appendChild(stEl);
  renderTabs(); renderJournals();
  if (mode === 'teacher') {
    var cache = lsGet(lk(LS.cache), null);
    if (cache && cache.les) { KINDS.forEach(function (k) { S[k] = cache[k] || {}; }); loaded = true; }
    else $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
    render(); sync();
    setInterval(function () { if (document.visibilityState === 'visible' && !cur) sync(); }, 30000);
  } else {
    // ссылка от учителя вида zhurnal.html#k=КОД — код сразу в дело, из адреса убираем
    var mk = /[#&]k=([^&]+)/.exec(location.hash);
    var byCode = function () {
      if (mk) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ } view(decodeURIComponent(mk[1])); }
      else if (lsGet(LS.pass, '')) view(''); else gate('');
    };
    // личная ссылка ученика без Телеграма (#s=<журнал>.<ключ>) — запомнить и открыть свой журнал
    var ms = /[#&]s=([a-z0-9]{2,16}\.[0-9a-f]{32})\b/.exec(location.hash);
    if (ms) { lsSet(LS.sk, ms[1]); J = ms[1].split('.')[0]; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ } }
    // кнопка «📒 Мой журнал» в боте: одноразовая ссылка #t=… → ключ входа, без 4 цифр
    var mt = /[#&]t=([0-9a-f]{32})\b/.exec(location.hash);
    var afterMe = function (res) { if (res === 'nolink') pickMe(); else if (res !== true) byCode(); };
    var mine = function () { meLoad().then(afterMe, byCode); };
    // сеть подвела — один раз через запасной сервер (VPN); ошибка загрузки журнала сюда не попадает
    var magic = function (token, tries) {
      // с ограничением по времени: при VPN прямой адрес молчит, и без него «Открываю журнал…» висело бы вечно (телефон ученицы, 01.10)
      var ctrl = window.AbortController ? new AbortController() : null, guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 7000);
      fetch(chatBase() + '/chat/login/magic/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }), signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.json(); })
        .then(function (d) { clearTimeout(guard); return d; }, function (e) { clearTimeout(guard); throw e; })
        .then(function (d) {
          if (d.ok && d.key) { lsSet(LS.ck, d.key); lsDel(LS.sk); mine(); return; }
          if (ck()) { mine(); return; }   // ссылку уже открывали — вход помнится
          byCode();
          setTimeout(function () { alert(d.error === 'not student' ? 'Ты больше не в классе в боте — спроси учителя.' : 'Ссылка из бота устарела или уже открывалась. Нажми «📒 Мой журнал» в боте ещё раз.'); }, 300);
        }, function () { if (!tries) { nextApi(); magic(token, 1); } else byCode(); });
    };
    // кнопка-ссылка в меню бота (#b=<ключ входа>, D 02.10): журнал одним нажатием. Ключ — тот же, что страница
    // получает после входа; из адреса убираем. Срок ключа в ссылке вышел, а свой вход ещё помнится — берём свой
    var mb = /[#&]b=((?:main|test)\.\d{1,20}\.(\d{9,12})\.[0-9a-f]{32})\b/.exec(location.hash);
    if (mb) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ }
      if (!(ck() && +mb[2] * 1000 < Date.now())) { lsSet(LS.ck, mb[1]); lsDel(LS.sk); }
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      // сеть подвела — один раз через запасной сервер (VPN): meLoad при сбое сам переключает адрес
      var direct = function (tries) {
        meLoad().then(function (res) {
          if (res === 'nolink') pickMe();
          else if (res !== true) { byCode(); setTimeout(function () { alert('Вход из бота не сработал. Нажми в боте «Меню» (/start) — кнопка журнала обновится.'); }, 300); }
        }, function () { if (!tries) direct(1); else byCode(); });
      };
      direct(0);
    }
    else if (mt) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ }
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      magic(mt[1], 0);
    }
    // вошёл через бота — журнал открывается без кода класса, со своей строкой и сдачей
    else if (sk() && !mk) {   // по личной ссылке
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      meLoad().then(function (res) { if (res !== true) { byCode(); setTimeout(function () { alert('Ссылка больше не работает — попроси у учителя новую.'); }, 300); } }, byCode);
    }
    else if (ck() && !mk) { $('main').innerHTML = '<div class="empty">Открываю журнал…</div>'; meLoad().then(afterMe, byCode); }
    else byCode();
    $('footLinks').innerHTML = '<button class="link" data-act="recode">Ввести другой код</button> · <button class="link" data-act="teacher">Я учитель</button>';
  }
})();
</script>
</body>
</html>
