<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал — Математика 9 класс</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16131a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  try { if (localStorage.getItem('tema') === 'night') document.documentElement.dataset.theme = 'night'; } catch (_) {}
</script>
<link rel="stylesheet" href="_движок/fonts/gf.css">
<link rel="stylesheet" href="style.css">
<!--
  Журнал оценок (D, 29.09.2026). Эта страница — пустая оболочка: фамилий, имён и оценок
  в ней нет (152-ФЗ). Данные приходят с нашего сервера в России (vk_bot/zhurnal.py):
  ученику — по коду класса, только смотреть; D — по ключу Кабинета, можно менять.
-->
<style>
/* Журнал живёт в стилях сайта (style.css): те же цвета тем Λ / D, те же цвета предметов
   (.k-algebra, .k-geometriya, .k-veroyatnost → --g заливка, --s акцент, --glow свечение),
   те же часы с переключателем. Здесь — только своё: вкладки, таблица, окна. */
[hidden]{ display:none !important; }
:root{
  --z-line2:#d9d3e6; --z-head:#f2eff9; --z-hover:#f6f3fb; --z-focus:#16131a;
  --z-shadow:0 18px 50px -18px rgba(40,24,70,.35);
  /* расцветка плиток оценок — вся здесь. --mNb фон, --mNt цифра, --m5s / --m2s свет. Выбор D из вариантов
     (_стенд_журнала/варианты_плиток.mjs): «Лайм» в обеих темах (ночь — 03.10, день — 04.10). Пятёрка — лайм со светом,
     плохие оценки (2, 1, прочерк, незачёт) — алая плитка с красным светом; у четвёрки цифра зелёная, у тройки охристая,
     плитки у них серые, без света. */
  --m5b:linear-gradient(160deg,#e4fb6e,#a8e02a); --m5t:#2a3d00; --m5s:0 4px 14px -3px rgba(132,204,22,.8), 0 0 24px -6px rgba(132,204,22,.65);
  --m2b:linear-gradient(160deg,#ff5a5a,#dc2626); --m2c:#fff; --m2s:0 4px 14px -3px rgba(220,38,38,.6), 0 0 22px -6px rgba(220,38,38,.5);
  --m2u:#fff; --m2uc:#dc2626;   /* счётчик дней в углу плохой оценки; «!» — наоборот, этим цветом залит */
  --m2k:rgba(60,0,10,.34);      /* подложка под счётчиком дней: мелкие белые цифры на алом читаются */
  --m2t:#b42318;                /* красный текст на обычном фоне: «2 долга» у имени */
  --m4b:#e9e5f1; --m4t:#35701a; --m3b:#e9e5f1; --m3t:#8f5d02; --mnb:#ece9f2; --mnt:#5f5870;
  --z-tile:#f4f2f9; --z-chip:#efecf6; --z-rule:#ebe6f2;
  --z-ring:#fff;   /* светлая подложка под рамкой выбора, наведения и сдачи: рамка видна и на чёрной, и на белой плитке */
  --z-sent:#7c3aed; --z-sent2:#c4b5fd; --z-redo:#c026d3;
}
:root[data-theme="night"]{
  --z-line2:#3a2447; --z-head:#231430; --z-hover:#231430; --z-focus:#ff5cc8;
  --z-shadow:0 0 0 1px rgba(255,92,200,.18), 0 24px 60px -20px rgba(217,70,239,.45);
  /* ночь — «Лайм»: пятёрка кислотная, плохие оценки алые; у четвёрки цифра зеленоватая, у тройки желтоватая */
  --m5b:linear-gradient(160deg,#f0ff8a,#a6f01f); --m5t:#1c2b00; --m5s:0 0 18px -1px rgba(190,255,60,.85), 0 0 38px -6px rgba(170,240,40,.75);
  --m2b:linear-gradient(160deg,#ff5a5a,#d61f1f); --m2c:#fff; --m2s:0 0 16px -2px rgba(255,60,60,.9), 0 0 30px -8px rgba(255,60,60,.7);
  --m2u:#fff; --m2uc:#d61f1f; --m2t:#ffa6bd;
  --m4b:rgba(255,255,255,.085); --m4t:#b9e69c; --m3b:rgba(255,255,255,.085); --m3t:#ecca78; --mnb:rgba(255,255,255,.04); --mnt:#9a86ad;
  --z-tile:rgba(255,255,255,.04); --z-chip:rgba(255,255,255,.07); --z-rule:rgba(255,255,255,.07);
  --z-sent:#a78bfa; --z-sent2:#ddd6fe; --z-redo:#e879f9;
}
body{ background:var(--store); min-height:100vh; }
/* обложка журнала (D, 03.10) — та же живая стена, что за календарём на главной: fon.js и его стили в style.css.
   Шапка журнала ниже календаря, поэтому плитки мельче (data-cols / data-rows), а слева, под заголовком
   и вкладками, стена притушена сильнее */
.zh-hero{ position:relative; overflow:hidden; isolation:isolate; }
.zh-hero .shell{ position:relative; z-index:1; }
.zh-hero .gif-wall{ display:flex; align-items:center; }
.zh-hero .gw-plane{ position:relative; flex:0 0 128%; left:-12%; top:auto; width:auto; height:auto; gap:12px; }   /* высота — по своим плиткам, стоит по центру шапки: на любой ширине накрывает её целиком */
.zh-hero .gif-wall::after{ background:
  linear-gradient(90deg, var(--h-bg) 0%, color-mix(in srgb, var(--h-bg) 82%, transparent) 30%, color-mix(in srgb, var(--h-bg) 30%, transparent) 62%, color-mix(in srgb, var(--h-bg) 18%, transparent) 100%),
  linear-gradient(180deg, color-mix(in srgb, var(--h-bg) 55%, transparent) 0%, transparent 34%, transparent 70%, color-mix(in srgb, var(--h-bg) 70%, transparent) 100%); }
@media (min-width:701px){ .zh-hero{ min-height:186px; } }
@media (max-width:700px){ .zh-hero .gw-plane{ flex-basis:160%; left:-30%; gap:10px; } }
@media (orientation:landscape) and (max-height:520px){ .zh-hero .gif-wall{ display:none; } }
input, textarea{ font:inherit; color:inherit; }

/* шапка — как на главной */
.zh-hero{
  background:
    radial-gradient(900px 400px at 85% -10%, rgba(168,85,247,.20), transparent 60%),
    radial-gradient(700px 360px at 0% 110%, rgba(79,70,229,.14), transparent 60%),
    var(--h-bg);
  color:var(--h-txt); padding:22px 0 22px; border-bottom:1px solid var(--h-line);
}
[data-theme="night"] .zh-hero{
  background:
    radial-gradient(800px 380px at 90% -20%, rgba(217,70,239,.35), transparent 60%),
    radial-gradient(700px 400px at -5% 120%, rgba(190,18,60,.28), transparent 60%),
    var(--h-bg);
  border-bottom-color:rgba(255,92,200,.28);
}
.zh-back{ display:inline-block; font-size:14px; font-weight:700; color:var(--h-soft); text-decoration:none; }
.zh-back:hover{ color:var(--h-txt); }
.zh-title{ display:flex; align-items:baseline; gap:6px 16px; flex-wrap:wrap; margin-top:10px; }
.zh-title .kicker{ margin-top:0; }
@media (max-width:700px){ .zh-hero{ padding-top:60px; } }

/* вкладки предметов — заливка предмета, как кнопки на главной */
.tabs{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:18px; }
/* все три всегда яркие, в цвете предмета; выбранная — приподнята, с кольцом и свечением */
.tab{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 10px; border-radius:14px; font-weight:800; font-size:15px;
  color:var(--on); background:var(--g); box-shadow:0 8px 18px -14px var(--glow), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .18s var(--ease), box-shadow .2s; }
.tab i{ font-style:normal; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:17px; background:rgba(255,255,255,.28); }
.k-veroyatnost.tab i{ background:rgba(255,255,255,.7); }
.tab:hover{ transform:translateY(-1px); }
.tab:active{ transform:scale(.96); }
.tab[aria-selected="true"]{ transform:translateY(-3px) scale(1.04);
  box-shadow:0 0 0 3px var(--h-bg), 0 0 0 5px var(--s), 0 16px 30px -12px var(--glow); }
.tab[aria-selected="true"] i{ animation:tab-pop .45s var(--ease); }
@keyframes tab-pop{ 0%{ transform:scale(.7) rotate(-12deg); } 60%{ transform:scale(1.18) rotate(6deg); } 100%{ transform:none; } }
[data-theme="night"] .tab{ box-shadow:0 0 18px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); }
[data-theme="night"] .tab[aria-selected="true"]{ box-shadow:0 0 0 3px var(--h-bg), 0 0 0 5px var(--s), 0 0 34px -2px var(--glow); }
.tab .sh{ display:none; }
/* «Все» (D, 03.10): чёрная, как «Математика»; значок — полоски в цветах предметов журнала */
.tab.vse i{ display:flex; gap:2px; padding:7px 6px; align-items:stretch; background:rgba(255,255,255,.14); }
.tab.vse i b{ flex:1; border-radius:2px; background:var(--g); }
[data-theme="night"] .tab.vse{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), 0 0 18px -8px var(--glow); }
@media (max-width:560px){
  .tabs{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .tab{ flex-direction:column; justify-content:center; gap:5px; padding:9px 4px; font-size:13.5px; text-align:center; }
  .tab .lg{ display:none; } .tab .sh{ display:inline; }
  .tab i{ width:32px; height:32px; font-size:18px; }
  .tab.vse{ grid-column:1 / -1; flex-direction:row; gap:8px; padding:6px 12px; }   /* под тремя предметами — узкая полоса во всю ширину */
  .tab.vse i{ width:26px; height:26px; padding:6px 5px; }
  .tab.vse[aria-selected="true"]{ transform:translateY(-2px); }
  .st{ grid-column:1 / -1; margin-left:0; }
}
.st{ margin-left:auto; font-size:13px; color:var(--h-dim); display:flex; align-items:center; gap:6px; }
.st em{ font-style:normal; }
.st i{ width:8px; height:8px; border-radius:50%; background:var(--h-ghost); }
.st.ok i{ background:#16a34a; } .st.wait i{ background:#f59e0b; } .st.bad i{ background:#dc2626; }
[data-theme="night"] .st.ok i{ background:#6ee7b7; box-shadow:0 0 8px #6ee7b7; }

.zh-main{ padding-top:18px; }

/* панель учителя */
.tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; color:var(--sub); }
.btn{ padding:8px 14px; border-radius:11px; font-weight:700; text-align:center; background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1px var(--z-line2); }
.btn:hover{ background:var(--z-hover); }
.btn.pri{ background:var(--g); color:var(--on); box-shadow:0 10px 22px -14px var(--glow); }
.btn.danger{ color:#dc2626; }
[data-theme="night"] .btn.danger{ color:#ff7aa8; }
.warn{ color:#b45309; font-weight:600; }
[data-theme="night"] .warn{ color:#fcd34d; }
.codebox b{ color:var(--ink); }

/* таблица */
.wrap{ overflow:auto; max-height:calc(100vh - 120px); max-height:calc(100dvh - 120px); background:var(--card);
  border-radius:18px; box-shadow:inset 0 0 0 1px var(--line), 0 14px 40px -28px rgba(40,24,70,.35);
  -webkit-overflow-scrolling:touch; overscroll-behavior-x:none; }   /* жест двумя пальцами по таблице листает только таблицу: Chrome на Маке не уходит «назад» (D 23.10); вне таблицы — как обычно */
table.zt{ border-collapse:separate; border-spacing:0; font-size:14px; }
.zt th, .zt td{ border-right:1px solid transparent; border-bottom:1px solid transparent; }   /* линий сетки нет (плитки, ниже) — поля держат шаг */
.zt thead th{ position:sticky; top:0; z-index:2; background:var(--card); }
.zt thead tr:first-child th{ height:46px; }
.zt thead tr:nth-child(2) th{ top:46px; height:22px; }
.zt .nm{ position:sticky; left:0; z-index:3; background:var(--card); text-align:left; padding:6px 10px;
  min-width:128px; max-width:150px; font-weight:600; box-shadow:1px 0 0 var(--z-line2); }
.zt thead .nm{ z-index:4; font-size:12px; color:var(--muted); }
.zt tbody .nm b{ display:block; font-weight:800; font-size:15.5px; line-height:1.15; }   /* имя — крупно, фамилия — мелко и серым (D, 01.10) */
.zt tbody .nm span{ display:block; font-size:11.5px; color:var(--muted); font-weight:500; }
/* имя и фамилия — каждая в одну строку (D, 04.10): «Воротников · 2 долга» переносилось, строка становилась выше остальных,
   и плитки в ней растягивались. Не помещается — многоточием сжимается только сама фамилия (.fm): «· это ты» и число долгов
   остаются целыми. На широком экране столбец имён шире, и фамилии видны целиком */
.zt tbody .nm b, .zt tbody .nm span{ white-space:nowrap; max-width:130px; }
.zt tbody .nm b, .zt tbody .nm .fm{ overflow:hidden; text-overflow:ellipsis; }
.zt tbody .nm span{ display:flex; }
.zt tbody .nm .fm{ font-style:normal; min-width:0; }
.zt tbody .nm em{ flex:none; }
@media (min-width:1000px){ .zt .nm{ max-width:230px; } .zt tbody .nm b, .zt tbody .nm span{ max-width:210px; } }
.dt{ padding:3px 6px; font-size:13px; white-space:nowrap; cursor:pointer; border-top:3px solid transparent; text-align:center; }
.dt b{ display:block; font-weight:700; }
.dt small{ display:block; font-size:10.5px; color:var(--muted); font-weight:600; }
.dt:hover{ color:var(--s); }
.dt a{ display:block; color:inherit; text-decoration:none; }
.dt.go b i{ font-style:normal; font-size:11px; margin-left:3px; color:var(--s); }
.dt.go:hover b{ text-decoration:underline; text-underline-offset:3px; }
a.btn{ text-decoration:none; display:inline-flex; align-items:center; }
.dt.today b::after{ content:' · сегодня'; font-weight:700; font-size:10.5px; color:var(--s); }
.sub{ font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
td.c{ position:relative; width:46px; min-width:46px; height:44px; text-align:center; font-weight:800; font-size:15px; padding:2px; white-space:nowrap; }
td.c.long{ font-size:11px; white-space:normal; line-height:1.1; font-weight:600; }
.m5{ background:var(--m5b); color:var(--m5t); } .m4{ background:var(--m4b); color:var(--m4t); }
.m3{ background:var(--m3b); color:var(--m3t); } .m2{ background:var(--m2b); color:var(--m2c); }
.mn{ background:var(--mnb); color:var(--mnt); font-weight:600; }
.edit td.c{ cursor:pointer; }
.zt tfoot th.nm{ font-size:12px; color:var(--muted); vertical-align:top; }
.zt tfoot td{ vertical-align:top; padding:6px; font-size:12px; color:var(--sub); cursor:pointer; max-width:92px; }
.zt tfoot td:hover{ background:var(--z-hover); }
/* галочка D в углу темы и домашки: «урок готов», «домашка задана» — видит только он */
.edit .zt tfoot td[data-les]{ position:relative; padding-right:26px; min-width:124px; }   /* шире: галочка не должна ломать слова темы */
.rdy{ position:absolute; top:5px; right:5px; width:19px; height:19px; padding:0; border-radius:6px; display:grid; place-items:center; font-size:13px; line-height:1; font-weight:900;
  color:transparent; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--z-line2); }
.rdy:hover{ box-shadow:inset 0 0 0 1.5px #16a34a; }
.rdy[aria-pressed="true"]{ background:#16a34a; color:#fff; box-shadow:none; }
[data-theme="night"] .rdy[aria-pressed="true"]{ background:#34d399; color:#062b1c; }
/* журналы: переключатель над предметами */
.jsw{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
.jr{ padding:6px 12px; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--h-soft); box-shadow:inset 0 0 0 1px var(--h-line); }
.jr[aria-pressed="true"]{ background:var(--h-txt); color:var(--h-bg); box-shadow:none; }
.jr.add{ color:var(--h-dim); border:1px dashed var(--h-line); box-shadow:none; }
/* ссылки урока (D, 09.10): видеосвязь и доска — всегда в шапке, у D и у ученика одни и те же */
.ssyl{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
.sl{ display:inline-flex; align-items:center; gap:10px; padding:7px 16px 7px 7px; border-radius:14px; font-weight:800; font-size:15px; text-decoration:none;
  color:#fff; box-shadow:0 10px 22px -12px var(--sl-glow), inset 0 1px 0 rgba(255,255,255,.3); transition:transform .18s var(--ease), box-shadow .2s; }
.sl i{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.24); }
.sl svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.sl em{ font-style:normal; font-weight:700; opacity:.7; }
.sl:hover{ transform:translateY(-2px); box-shadow:0 16px 28px -12px var(--sl-glow), inset 0 1px 0 rgba(255,255,255,.3); }
.sl:active{ transform:scale(.96); }
.sl.tm{ background:linear-gradient(135deg,#22c55e 0%,#0d9488 100%); --sl-glow:rgba(13,148,136,.9); }
.sl.bd{ background:linear-gradient(135deg,#f472b6 0%,#8b5cf6 100%); --sl-glow:rgba(139,92,246,.9); }
[data-theme="night"] .sl{ box-shadow:0 0 22px -6px var(--sl-glow), inset 0 1px 0 rgba(255,255,255,.25); }
.sl-ed{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:15px; color:var(--h-dim); box-shadow:inset 0 0 0 1px var(--h-line); }
.sl-ed:hover{ color:var(--h-txt); }
@media (max-width:560px){ .sl{ flex:1 1 0; justify-content:flex-start; } }
/* оформление: точка в начале строки, кнопки Ж К Ч • */
.li{ display:block; padding-left:1.05em; text-indent:-1.05em; }
.li::before{ content:'•'; display:inline-block; width:1.05em; text-indent:0; color:var(--s); font-weight:900; }
.tl .li{ padding-left:.9em; text-indent:-.9em; } .tl .li::before{ width:.9em; }
.dlg .lbl{ display:flex; align-items:center; gap:8px; }
.fmtbar{ margin-left:auto; display:inline-flex; gap:4px; text-transform:none; letter-spacing:0; }
.fmtbar button{ width:30px; height:28px; padding:0; display:grid; place-items:center; line-height:1; border-radius:8px; font-size:14px; color:var(--ink); box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--card); }
.fmtbar button:hover{ background:var(--z-hover); }
/* «Математика» — чёрная с белой М (D, 01.10) */
.k-mat{ --g:linear-gradient(135deg,#3a3642 0%,#16131a 60%,#000 100%); --s:#16131a; --on:#fff; --t:#ecebef; --d:#16131a; --glow:rgba(0,0,0,.45); }
[data-theme="night"] .k-mat{ --g:linear-gradient(135deg,#2c2436 0%,#0a070d 70%,#000 100%); --s:#f3ecff; --on:#fff; --t:rgba(255,255,255,.08); --d:#f3ecff; --glow:rgba(255,255,255,.35); }
/* лента дней индивидуала: предмет дня — цветом под днём недели и датой */
.dt.sjc:hover{ color:var(--on); }
.dt.sjc.go b i{ color:inherit; opacity:.75; }   /* стрелка «урок на сайте» на цветной шапке — цветом текста, а не предмета (иначе оранжевая на оранжевом) */
.dt.sjc.today b::after{ color:inherit; }
/* выбор предмета дня в окне «День» */
.sjpick{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.sjpick button{ padding:9px 14px; min-width:44px; border-radius:12px; font-weight:800; font-size:14px; color:var(--on); background:var(--g); opacity:.45;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3); transition:opacity .15s, transform .15s var(--ease); }
.sjpick.go button{ opacity:1; }
.sjpick button[aria-pressed="true"]{ opacity:1; transform:translateY(-2px); box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--s), 0 10px 20px -12px var(--glow); }
.dlg input[type="date"]{ width:auto; min-width:170px; font-weight:700; }
.fprev{ white-space:pre-line; font-size:14px; background:var(--z-head); border-radius:10px; padding:8px 10px; margin-top:6px; }
.fprev-h{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:2px; }
/* тема дня: по две строки на урок, на один урок — четыре */
.tl{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; word-break:break-word; line-height:1.3; }
.tl.one{ -webkit-line-clamp:4; }
.hw .tl{ white-space:pre-line; }
.tl .no{ font-weight:800; color:var(--muted); }

.zt tfoot td{ min-width:138px; }

.empty{ padding:40px 20px; text-align:center; color:var(--sub); }

/* легенда (D, 03.10): отдельная карточка ниже таблицы — значок и два-три слова, по столбцам */
.lgd{ margin-top:30px; padding:16px 20px 18px; border-radius:18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px 30px;
  font-size:13px; line-height:1.3; color:var(--sub); background:color-mix(in srgb, var(--card) 60%, transparent); box-shadow:inset 0 0 0 1px var(--line); }

.lgd li{ display:flex; align-items:center; gap:9px; }
.lgd .ch{ display:inline-flex; gap:3px; flex:none; justify-content:flex-end; min-width:105px; }   /* значки — столбцом справа, подписи — слева в линию */

.lgd .ch i{ display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 4px; border-radius:6px; font-style:normal; font-weight:800; font-size:12px; box-shadow:0 0 0 1px rgba(127,127,127,.14); }
.lgd .ch i small{ align-self:flex-start; margin:2px -1px 0 2px; padding:0 2px; border-radius:3px; font:800 8.5px/1.3 'JetBrains Mono',ui-monospace,monospace; color:var(--m2u); background:var(--m2k); }
.lgd .ch i small.late{ background:var(--m2u); color:var(--m2uc); }
.lgd .sjc{ min-width:0; }
.lgd .sjc i{ width:24px; background:var(--g); box-shadow:inset 0 0 0 1px rgba(127,127,127,.25); }
.lgd .tips li{ align-items:baseline; }
.lgd .tips li::before{ content:''; flex:none; width:5px; height:5px; border-radius:50%; background:var(--muted); transform:translateY(-2px); }
@media (max-width:560px){ .lgd{ margin-top:22px; padding:14px 14px 16px; gap:14px; } }

/* вход по коду */
.gate{ max-width:420px; margin:28px auto; background:var(--card); border-radius:20px; padding:26px 22px; text-align:center;
  box-shadow:inset 0 0 0 1px var(--line), 0 18px 50px -30px rgba(40,24,70,.4); }

.gate input{ flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--z-line2); background:var(--store); font-size:20px; text-align:center; letter-spacing:.12em; }
.gate .pick{ display:grid; gap:8px; margin-top:16px; }

[data-theme="night"] .gate .err{ color:#ff7aa8; }
.link{ text-decoration:underline; text-underline-offset:3px; color:var(--sub); font-size:13px; }

/* нижний лист: оценка */
.pop{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:min(440px, calc(100vw - 16px)); z-index:40;
  background:var(--card); color:var(--ink); border-radius:20px; box-shadow:var(--z-shadow), inset 0 0 0 1px var(--line); padding:14px; }
.pop-h{ display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:10px; }
.pop-h span{ color:var(--sub); text-align:right; }
.pop-q{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.pop-q button{ height:46px; border-radius:12px; font-weight:800; font-size:18px; text-align:center; box-shadow:inset 0 0 0 1px var(--z-line2); }
.pop-t{ display:flex; gap:6px; margin-top:8px; }
.pop-t input{ flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--z-line2); background:var(--store); }
.pop-l{ display:block; margin:12px 0 -4px; font-size:13px; font-weight:700; color:var(--muted); }   /* подписи полей: подсказку внутри поля браузер может подменить (у D 16.10 там стояло «null») */
.pop-f{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--sub); }
.pop-f label{ display:flex; align-items:center; gap:6px; cursor:pointer; }

/* окна: урок, ученики */
.dlg-bg{ position:fixed; inset:0; background:rgba(16,10,24,.45); z-index:45; }
[data-theme="night"] .dlg-bg{ background:rgba(5,2,8,.7); }
.dlg{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px, calc(100vw - 16px)); max-height:calc(100dvh - 24px); overflow:auto;
  background:var(--card); color:var(--ink); border-radius:20px; box-shadow:var(--z-shadow); padding:20px; z-index:46; }
.dlg h3{ font-size:20px; font-weight:800; margin-bottom:4px; }
.dlg .meta{ color:var(--muted); font-size:13px; margin-bottom:14px; }
.dlg .txt{ white-space:pre-line; font-size:15px; margin:6px 0 14px; }
.dlg .lbl{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:10px; }
.dlg input, .dlg textarea{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--z-line2); background:var(--store); margin-top:4px; }
.dlg textarea{ min-height:110px; resize:vertical; }
.dlg .row{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
.dlg .row .sp{ flex:1; }
.srow{ display:grid; grid-template-columns:1fr 1fr 36px 36px; gap:6px; margin-top:6px; }
.srow button.lnk{ color:var(--ink); } .srow button.lnk.on{ background:var(--z-head); box-shadow:inset 0 0 0 2px #7c3aed; }
.srow input{ margin-top:0; }
.srow-tg{ grid-column:1 / -1; padding:9px 10px; border-radius:10px; border:1px solid var(--z-line2); background:var(--store); color:inherit; font:inherit; font-size:14px; }
.srow-ph{ grid-column:1 / 3; font-size:14px; }
.srow-call{ grid-column:3 / -1; display:flex; align-items:center; justify-content:center; border-radius:10px; box-shadow:inset 0 0 0 1px var(--z-line2); text-decoration:none; }
.srow-call[hidden]{ display:none; }
.srow button{ border-radius:10px; text-align:center; box-shadow:inset 0 0 0 1px var(--z-line2); color:#dc2626; }

.vyg-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; font-size:13px; color:var(--muted); }
/* выгрузка оценок (D, 08.10): окно с выбором вида и лист. Лист — чёрным по белому в любой теме: его печатают */
.dlg.vyg{ width:min(1040px, calc(100vw - 16px)); }
.vyg-opt{ display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:12px; }
.vyg-opt > div{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.vyg-opt b{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:2px; }
.vyg-opt button{ padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:inset 0 0 0 1.5px var(--z-line2); }
.vyg-opt button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); box-shadow:none; }
.vyg-kr{ display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--z-head); font-size:13px; color:var(--sub); }
.vyg-kr b{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.vyg-kr input{ flex:1 1 260px; min-width:0; height:36px; padding:0 10px; border-radius:10px; border:1.5px solid var(--z-line2); background:var(--card); color:var(--ink); font:inherit; font-size:13px; }
.vyg-kr span{ flex:1 1 240px; }
.vyg-pre{ margin-top:14px; max-height:min(52vh, 560px); overflow:auto; border-radius:12px; box-shadow:inset 0 0 0 1.5px var(--z-line2); background:#fff; padding:14px 16px; }
.vl{ color:#000; font:12px/1.25 Arial, Helvetica, sans-serif; }
.vl h1, .vl h2, .vl h3{ color:#000; letter-spacing:0; text-transform:none; }   /* у сайта заголовки в цвет темы: ночью были бы белыми на белом листе */
.vl h1{ font:700 15px/1.2 Arial, sans-serif; margin:0 0 2px; } .vl .vl-kogda{ font-size:11px; color:#555; margin-bottom:10px; }
.vl h2{ font:700 13.5px/1.2 Arial, sans-serif; margin:12px 0 4px; } .vl h2 small{ font-weight:400; color:#555; font-size:11.5px; margin-left:6px; }
.vl table{ border-collapse:collapse; margin-bottom:6px; }
.vl th, .vl td{ border:1px solid #777; padding:2px 4px; text-align:center; min-width:17px; height:18px; font-size:11.5px; white-space:nowrap; }
.vl th{ background:#eee; font-weight:700; } .vl th.d{ font-size:10.5px; } .vl th.w{ font-weight:400; font-size:9.5px; color:#333; background:#f6f6f6; }
.vl td.nm, .vl th.nm{ text-align:left; padding-right:8px; } .vl td.sr{ font-weight:700; background:#f6f6f6; }
.vl .vl-s{ break-inside:avoid; page-break-inside:avoid; }
.vl .vk{ break-inside:avoid; page-break-inside:avoid; padding:10px 2px 12px; border-bottom:1.5px dashed #555; }
.vl .vk:first-of-type{ border-top:1.5px dashed #555; }
.vl .vk h3{ font:700 15px/1.2 Arial, sans-serif; margin:0 0 6px; } .vl .vk h3 small{ font-weight:400; font-size:11px; color:#555; margin-left:8px; }
.vl .vk-s{ display:flex; gap:8px 12px; align-items:flex-start; flex-wrap:wrap; margin-top:5px; }
.vl .vk-s > b{ flex:0 0 112px; font-size:12px; padding-top:3px; } .vl .vk-s > b i{ display:block; font-style:normal; font-weight:400; font-size:11px; color:#333; }
.vl .vk-t{ display:flex; flex-wrap:wrap; gap:4px 10px; flex:1; min-width:0; } .vl .vk-t table{ margin:0; }
#vygList{ display:none; }
@media print{
  body.vyg-print{ background:#fff !important; }
  body.vyg-print > *:not(#vygList){ display:none !important; }
  body.vyg-print > #vygList{ display:block !important; }
  body.vyg-print .vl th, body.vyg-print .vl td{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
.zh-foot{ padding:22px 0 40px; font-size:13px; color:var(--muted); }

/* ── живой журнал (ТЗ 17, шаги 1–3) ── */
/* долг (двойка, единица, незачёт): в углу плитки — сколько дней осталось на пересдачу, «!» — срок вышел */
td.c sup{ position:absolute; top:1px; right:2px; color:var(--m2u); font-size:9.5px; font-weight:800; line-height:1; font-family:'JetBrains Mono',ui-monospace,monospace; background:var(--m2k); border-radius:4px; padding:1px 3px; }
td.c.zlate sup{ color:var(--m2uc); background:var(--m2u); }
/* кто поставил: А — автоматика, ✎ — D исправил оценку автоматики */
td.c .src{ position:absolute; bottom:2px; left:3px; font-size:9px; font-weight:800; line-height:1; opacity:.75; }
.zt tbody .nm em{ font-style:normal; color:var(--m2t); font-weight:700; }
.sub.dz.sh{ letter-spacing:0; }
.zt tfoot td[colspan="1"], .zt tfoot td[colspan="2"]{ min-width:96px; }
.fcount{ display:inline-block; margin-left:4px; font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; }
/* подсказка: навёл — вспомнил, что было */
.ztip{ position:fixed; z-index:60; max-width:280px; padding:9px 11px; border-radius:12px; font-size:12.5px; line-height:1.4;
  background:var(--night); color:#f3eaf7; box-shadow:var(--z-shadow); pointer-events:none; white-space:pre-line; }
.ztip b{ display:block; font-size:13px; margin-bottom:2px; }
[data-theme="night"] .ztip{ background:#2a1636; box-shadow:0 0 0 1px rgba(255,92,200,.3), 0 18px 40px -16px rgba(217,70,239,.6); }
/* источник оценки в листе D */
.pop-src{ font-size:13px; color:var(--sub); background:var(--z-head); border-radius:10px; padding:8px 10px; margin-bottom:10px; }
.pop-cm{ width:100%; margin-top:8px; padding:9px 12px; border-radius:10px; border:1px solid var(--z-line2); background:var(--store); resize:vertical; font-size:14px; }
td.c .cmt{ position:absolute; top:4px; left:4px; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.8; }   /* есть комментарий — точка в углу, цветом цифры */
.pop-x{ display:flex; gap:6px; margin-top:8px; }
.pop-x button{ flex:1; height:36px; border-radius:10px; font-weight:700; font-size:14px; text-align:center; box-shadow:inset 0 0 0 1px var(--z-line2); }
/* файлы урока в карточке */
/* карточка дня: тема → файлы плитками → домашка */
.dsec{ margin-top:14px; }
.dsec-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:16.5px; line-height:1.25; }
.dsec-h .no{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:800; background:var(--z-head); color:var(--sub); flex:none; }
.sjchip{ padding:3px 9px; border-radius:999px; font-size:12px; font-weight:800; color:var(--on); background:var(--g); flex:none; }
.ftiles{ display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 6px; }
.ft{ position:relative; width:150px; }
.ftb{ width:100%; padding:0; display:flex; flex-direction:column; gap:4px; text-align:left; }
.fpv{ width:150px; height:196px; border-radius:14px; overflow:hidden; display:grid; place-items:center; background:var(--z-head); box-shadow:0 0 0 1px var(--z-line2), 0 8px 18px -14px rgba(40,24,70,.5); transition:transform .15s var(--ease); }
.ftb:hover .fpv{ transform:translateY(-2px); box-shadow:0 0 0 2px var(--s), 0 12px 22px -14px rgba(40,24,70,.6); }
.fpv img{ width:100%; height:100%; object-fit:cover; object-position:left top; display:block; background:#fff; }   /* видно начало страницы — левый верхний угол (D 17.10) */
.fpv img:not([src]){ visibility:hidden; }
@media (max-width:560px){ .ft{ width:calc(50% - 5px); } .fpv{ width:100%; height:auto; aspect-ratio:150/196; } }
.fpv i{ font-style:normal; font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:800; font-size:20px; text-transform:uppercase; letter-spacing:.04em; color:#fff; }
.fpv.x-pdf{ background:linear-gradient(135deg,#f87171,#dc2626); position:relative; }
.fpv.x-pdf img:not([src]){ position:absolute; }
.fpv.x-pdf.cover{ background:#fff; }
.fpv.x-pdf.cover::after{ content:'PDF'; position:absolute; left:6px; bottom:6px; padding:2px 6px; border-radius:6px; font:800 10px 'JetBrains Mono',ui-monospace,monospace; color:#fff; background:#dc2626; } .fpv.x-pptx{ background:linear-gradient(135deg,#fb923c,#ea580c); }
.fpv.x-docx{ background:linear-gradient(135deg,#60a5fa,#2563eb); } .fpv.x-xlsx{ background:linear-gradient(135deg,#4ade80,#16a34a); }
.fnm{ font-size:13px; font-weight:600; line-height:1.2; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; word-break:break-word; }
.ftb .fz{ font-size:11px; color:var(--muted); }
.fnote{ margin-top:8px; } .fnote summary{ cursor:pointer; font-size:14px; font-weight:700; color:var(--sub); padding:6px 0; list-style:none; } .fnote summary::-webkit-details-marker{ display:none; }
.fnote[open] summary{ color:var(--muted); } .fnote textarea{ min-height:56px; }
#vid .v-note{ margin:6px 0 12px; white-space:pre-line; font-size:15px; line-height:1.45; }
.dnote{ margin:0 0 10px; white-space:pre-line; font-size:15px; line-height:1.4; }
.dnote.me{ padding:8px 10px; border-radius:10px; background:var(--z-head); color:var(--sub); font-size:14px; }
.fnm-e{ display:block; width:100%; min-height:36px; margin-top:4px; padding:6px; border-radius:8px; text-align:left; color:inherit; }
.fnm-e:hover{ background:var(--z-hover); } .fnm-e.none{ color:var(--muted); font-weight:600; }
.fnm-in{ display:block; width:100%; margin-top:4px; padding:4px 6px; border-radius:8px; border:1px solid var(--z-line2); background:var(--store); font:600 13px/1.2 inherit; color:inherit; }
.frm{ position:absolute; top:-6px; right:-6px; width:24px; height:24px; padding:0; border-radius:50%; display:grid; place-items:center; font-size:12px; color:#dc2626; background:var(--card); box-shadow:0 0 0 1px var(--z-line2), 0 4px 10px -6px rgba(0,0,0,.4); }
.btn.sm{ padding:5px 10px; font-size:13px; }
/* карточка дня колонками (D, 07.10): тема 1 · тема 2 · домашка — отдельные карточки с цветной шапкой; на телефоне встают друг под друга */
.dlg.day{ display:grid; grid-template-columns:repeat(var(--nb, 3), minmax(0, 1fr)); gap:14px; align-items:stretch; }
@media (max-width:760px){ .dlg.day{ grid-template-columns:1fr; } }
.dlg.day > h3, .dlg.day > .meta, .dlg.day > .note, .dlg.day > .row{ grid-column:1 / -1; margin:0; }
.dlg.day .dsec, .dlg.day .dhw{ margin:0; padding:0 14px 14px; border-radius:16px; background:var(--card); box-shadow:0 0 0 1px var(--z-line2), 0 10px 24px -18px rgba(40,24,70,.5); overflow:hidden; }
.dlg.day .dsec-h, .dlg.day .dhw > .lbl{ display:flex; flex-wrap:nowrap; align-items:flex-start; gap:8px; margin:0 -14px 12px; padding:12px 14px; min-height:64px; font-size:15px; line-height:1.3; font-weight:800; text-transform:none; letter-spacing:0; color:var(--on); background:var(--g); }
.dlg.day .dsec-h b{ flex:1; min-width:0; color:inherit; }
.dlg.day .dsec-h .no{ background:rgba(255,255,255,.92); color:#1a1720; margin-top:-2px; }
.dlg.day .dsec-h .sjchip{ background:rgba(255,255,255,.92); color:#1a1720; }
.dlg.day .dhw > .lbl{ background:#1a1720; color:#fff; }
[data-theme="night"] .dlg.day .dhw > .lbl{ background:#000; box-shadow:inset 0 -1px 0 rgba(255,255,255,.18); }
.dlg.day .dhw .txt{ margin-top:0; }
.dlg.day .cov{ width:100%; margin-top:0; } .dlg.day .ftiles{ margin-top:10px; }
/* плитки в колонке: один файл — во всю ширину (видно без открытия), два и больше — по два в ряд */
.dlg.day .ft{ width:calc(50% - 5px); } .dlg.day .ft:only-child{ width:100%; }
.dlg.day .fpv{ width:100%; height:auto; aspect-ratio:150/196; }
/* обложка темы (D, 07.10): в карточке — над файлами, в таблице — над строкой темы */
.cov{ position:relative; width:min(100%, 300px); margin:10px 0 2px; }
.covb{ display:block; width:100%; padding:0; border-radius:14px; overflow:hidden; box-shadow:0 0 0 1px var(--z-line2), 0 8px 18px -14px rgba(40,24,70,.5); }
.cov img{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; object-position:top; background:var(--z-head); }
.ti + .ti{ margin-top:6px; padding-top:6px; border-top:1px solid var(--z-line2); }
.zt tfoot .tl:not(.one){ -webkit-line-clamp:3; }
.edit .zt tfoot td[data-les]{ padding-right:6px; }   /* галочек готовности больше нет — картинка и текст во всю ширину колонки */
.tcov{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; object-position:top; border-radius:8px; margin:0 0 4px; background:var(--z-head); }
.tcov:not([src]), .cov img:not([src]){ visibility:hidden; }
/* плитку можно подвинуть: ◀ ▶ и «в домашку / к теме»; мышкой — перетащить */
.fmv{ display:flex; gap:3px; margin-top:4px; }
.fmv button{ flex:1; height:24px; padding:0 4px; border-radius:7px; font-size:11px; font-weight:700; color:var(--sub); box-shadow:inset 0 0 0 1px var(--z-line2); white-space:nowrap; }
.fmv button{ text-align:center; } .fmv .fcov{ flex:0 0 30px; font-size:13px; } .fmv button[disabled]{ opacity:.3; cursor:default; }
.fmv button:not([disabled]):hover{ background:var(--z-hover); }
.ft[draggable="true"]{ cursor:grab; } .ft.drag{ opacity:.4; }
.zone-on{ outline:2px dashed var(--s); outline-offset:3px; border-radius:12px; }
.uprow{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
/* файлы в окне «Изменить»: что уже лежит и что уйдёт вместе с «Сохранить» */
.fslot{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0 2px; padding:6px; border-radius:12px; background:var(--z-head); }
.fchip{ display:inline-flex; align-items:center; gap:4px; max-width:100%; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:600; color:var(--sub); background:var(--card); box-shadow:inset 0 0 0 1px var(--z-line2); }
.fchip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.fchip.new{ color:var(--on); background:var(--s); box-shadow:none; }
.fchip button{ width:16px; height:16px; padding:0; border-radius:50%; font-size:10px; line-height:1; color:inherit; background:rgba(255,255,255,.25); }
.pop-sub .pop-x button.redo{ flex:2; }
.pop-move{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.pop-move button{ padding:5px 9px; border-radius:9px; font-size:13px; font-weight:700; box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--card); }
.autorow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 2px; }
.autorow .note{ margin:0; }
.dhw{ margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--z-head); }
.dhw .lbl{ margin-top:0; }
.files{ display:flex; flex-direction:column; gap:6px; margin:6px 0 4px; }
.file{ display:flex; align-items:center; gap:8px; }
.file .zdl{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; text-align:left; box-shadow:inset 0 0 0 1px var(--z-line2); }
.file .zdl:hover{ background:var(--z-hover); }
.file .ext{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; font-weight:700; padding:3px 6px; border-radius:6px; background:var(--z-head); color:var(--sub); flex:none; text-transform:uppercase; }
.file .fn{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file .fz{ font-size:12px; color:var(--muted); white-space:nowrap; }
.file .rm{ width:36px; height:36px; border-radius:10px; text-align:center; color:#dc2626; box-shadow:inset 0 0 0 1px var(--z-line2); flex:none; }
.upl{ position:relative; overflow:hidden; display:inline-flex; align-items:center; cursor:pointer; }
.upl input{ position:absolute; inset:0; opacity:0; cursor:pointer; margin:0; }
.dlg .chk{ display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:14px; color:var(--sub); cursor:pointer; }
.dlg .chk input{ width:auto; margin-top:3px; }
.note{ font-size:13px; color:var(--muted); margin-top:4px; }
/* сдача ДЗ (шаг 4): 📷 — есть фото; кольцо «сдано» и пунктир «на доработку» — в блоке плиток */
td.c .cam{ position:absolute; bottom:1px; right:2px; font-size:10px; font-style:normal; line-height:1; }
.zt tbody tr.me th.nm{ background:color-mix(in srgb, #7c3aed 12%, var(--card)); box-shadow:inset 4px 0 0 #7c3aed, 1px 0 0 var(--z-rule); }
.zt tbody tr.me td.c.d.mine{ cursor:pointer; }
ol.zn{ margin:12px 0 4px; padding-left:22px; line-height:1.5; } ol.zn li{ margin-bottom:6px; }
/* вход учителя по логину и паролю (D 12.10): устройства в окне «Логин и пароль», «Выйти» в панели — справа */
.udev{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--z-line2); font-size:14px; }
.udev span{ flex:1; min-width:0; }
.udev .link{ color:#dc2626; white-space:nowrap; }
[data-theme="night"] .udev .link{ color:#ff7aa8; }
/* «Войти» (D 13.10: «как везде на сайтах»): кнопка под кодом класса и окно с выбором, кто входит */
.gate .ili{ color:var(--muted); font-size:13px; margin:16px 0 8px; }
.gate .btn.vh{ width:100%; padding:12px 14px; font-size:16px; }
.dlg.vhod{ width:min(380px, calc(100vw - 16px)); }
.btn.who{ display:block; width:100%; margin-top:10px; padding:14px 16px; font-size:17px; text-align:left; }
.btn.who small{ display:block; font-size:13px; font-weight:500; opacity:.78; margin-top:2px; }
.dlg .hint{ font-size:13px; color:var(--muted); margin-top:5px; }
.tools .btn.uexit{ margin-left:auto; }
.stbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; color:var(--sub); }
.btn.queue{ background:#7c3aed; color:#fff; box-shadow:0 10px 22px -14px #7c3aed; }
.thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.thumbs button{ width:84px; height:84px; border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--z-head); padding:0; }
.thumbs img{ width:100%; height:100%; object-fit:cover; object-position:left top; display:block; }
.pop-sub{ background:var(--z-head); border-radius:12px; padding:8px 10px; margin-bottom:10px; font-size:13px; color:var(--sub); }
.pop-sub .thumbs button{ width:64px; height:64px; }
.pop-sub .pop-x button.ok{ background:#16a34a; color:#fff; box-shadow:none; }
.pop-sub .pop-x button.redo{ color:#c026d3; }
.dlg .big{ display:flex; align-items:center; gap:12px; margin:6px 0; }
.dlg .big i{ font-style:normal; display:grid; place-items:center; min-width:48px; height:48px; padding:0 8px; border-radius:12px; font-size:22px; font-weight:800; box-shadow:inset 0 0 0 1px var(--z-line2); }
.dlg .kod{ font-size:26px; letter-spacing:.3em; text-align:center; font-family:'JetBrains Mono',ui-monospace,monospace; }
.dlg .err{ color:#dc2626; font-size:14px; margin-top:8px; min-height:1em; }
.view{ position:fixed; inset:0; z-index:60; background:#0e0a12; display:flex; flex-direction:column; }
.view .vstage{ flex:1; min-height:0; display:grid; place-items:center; padding:8px; }
.view canvas{ border-radius:6px; box-shadow:0 10px 40px -10px rgba(0,0,0,.6); background:#222; }
.view .vtools{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px; }
.view .vtools button{ min-width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,.12); color:#fff; font-weight:700; padding:0 10px; display:grid; place-items:center; }
.view .vtools button[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px #fff; }
.view .vtools button span{ width:20px; height:20px; border-radius:50%; display:block; }
.view .vtools button b{ border-radius:50%; background:#fff; display:block; }
.view .vst{ color:#d8cfe6; font-size:12.5px; width:100%; text-align:center; }
.view #vN{ color:#fff; align-self:center; }
.thumbs button{ position:relative; }
.thumbs .inked{ position:absolute; right:3px; bottom:3px; font-style:normal; font-size:13px; background:#fff; border-radius:6px; padding:0 2px; }
.view .vbar{ display:flex; gap:8px; justify-content:center; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px)); }
.view .vbar button{ padding:10px 16px; border-radius:12px; background:#fff; color:#1a1720; font-weight:700; }
.view .vtools button.vrot{ display:flex; gap:5px; margin-left:8px; } .view .vtools button.vrot + .vrot{ margin-left:0; }
/* файл урока на весь экран (D, 07.10): картинка или листы PDF листаются внутри журнала */
.fview .vtools{ justify-content:flex-end; }
.fview .vname{ flex:1 1 180px; min-width:0; padding:0 4px; color:#fff; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fview .vdoc{ flex:1; min-height:0; position:relative; outline:none; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:8px; display:flex; flex-direction:column; }
/* margin:auto — по центру, а когда лист шире или выше экрана — листается от края, ничего не обрезано */
.fview .vpages{ flex:none; margin:auto; display:flex; flex-direction:column; gap:10px; }
.fview .vpage{ flex:none; margin:0 auto; background:#fff; border-radius:4px; overflow:hidden; box-shadow:0 10px 40px -10px rgba(0,0,0,.6); }
.fview .vpage canvas{ width:100%; height:100%; display:block; border-radius:0; box-shadow:none; background:#fff; }
.fview .vimg{ flex:none; margin:auto; display:block; border-radius:6px; background:#fff; box-shadow:0 10px 40px -10px rgba(0,0,0,.6); }
.fview .vmsg{ margin:auto; max-width:340px; color:#d8cfe6; font-size:15px; text-align:center; }
/* видно, что файл листается (D, 16.10: «подумал, что это картинка, а его нужно скроллить»): полоса прокрутки — всегда,
   у нижнего края — тень, пока ниже есть ещё, у многолистового PDF — «Лист 1 из 3 ↓» (нажал — следующий лист) */
.fview .vdoc::-webkit-scrollbar{ width:14px; height:14px; }
.fview .vdoc::-webkit-scrollbar-track{ background:rgba(255,255,255,.07); }
.fview .vdoc::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.5); border-radius:8px; border:3px solid transparent; background-clip:padding-box; }
.fview .vdoc::-webkit-scrollbar-corner{ background:transparent; }
@supports not selector(::-webkit-scrollbar){ .fview .vdoc{ scrollbar-color:rgba(255,255,255,.5) rgba(255,255,255,.07); } }
.fview .vbot{ flex:none; height:0; position:relative; z-index:2; }
.fview .vfade{ position:absolute; left:0; right:14px; bottom:0; height:56px; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6)); pointer-events:none; opacity:0; transition:opacity .2s; }
.fview .vfade.on{ opacity:1; }
.fview .vpgn{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%); padding:10px 16px; min-height:44px; border-radius:999px; background:#fff; color:#1a1720; font-weight:700; font-size:14px; white-space:nowrap; box-shadow:0 8px 24px -8px rgba(0,0,0,.6); }
.fview .vpgn[hidden]{ display:none; }
.view .vcount{ color:#fff; align-self:center; }
/* телефон: сверху имя файла и «Свернуть», под ними размер и «Скачать»; рамки браузера убирать незачем */
@media (max-width:560px){ .fview .vtools{ justify-content:center; } .fview .vtools button{ order:2; } .fview .vname{ flex:1 1 calc(100% - 136px); } .fview .vtools [data-v="x"]{ order:1; } .fview .vtools [data-v="fs"]{ display:none; } }
#footLinks:not(:empty)::before{ content:' · '; }
/* дни и месяцы (D, 01.10): одна дата на день, жирная черта между днями, листаем по месяцам */
.zt th.dend, .zt td.dend{ border-right:2px solid transparent; }   /* конец дня; у плиток и подписей поле шире — в блоке плиток */
.months{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.mo{ padding:6px 12px; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--sub); box-shadow:inset 0 0 0 1px var(--z-line2); background:var(--card); }
.mo[aria-selected="true"]{ background:var(--g); color:var(--on); box-shadow:0 8px 18px -12px var(--glow); }
/* ── таблица плитками (D, 03.10) — как дни календаря на главной, в обеих темах ──
   Сетки линий нет. Клетка — скруглённая плитка: пустая едва видна, оценка красит её целиком.
   Пятёрка светится и «дышит», двойка и кол светятся красным, четвёрка и тройка — просто плитки.
   Рамок у оценок нет; между днями — просвет. Цвета — переменные --m… и --z-… в начале файла.
   :root в начале каждого правила — чтобы оно было сильнее прежних правил таблицы выше. */
:root .zt .nm{ box-shadow:1px 0 0 var(--z-rule); }
:root .zt td.c{ border:2px solid transparent; border-radius:11px; background:var(--z-tile) padding-box; box-shadow:none; }
:root .zt td.c.m5{ --z-tile:var(--m5b); z-index:1; }
:root .zt td.c.m4{ --z-tile:var(--m4b); }
:root .zt td.c.m3{ --z-tile:var(--m3b); }
:root .zt td.c.m2{ --z-tile:var(--m2b); z-index:1; }
:root .zt td.c.mn{ --z-tile:var(--mnb); }
/* свет — отдельным слоем точно по плитке; красный горит ровно, у пятёрки на ноутбуке дышит прозрачностью (без перерисовки тени) */
:root .zt td.c.m5::after, :root .zt td.c.m2::after{ content:''; position:absolute; inset:0; border-radius:9px; pointer-events:none; }
:root .zt td.c.m5::after{ box-shadow:var(--m5s); }
:root .zt td.c.m2::after{ box-shadow:var(--m2s); }
@keyframes z-glow{ 50%{ opacity:.5; } }
@media (hover:hover) and (pointer:fine){ :root .zt td.c.m5::after{ animation:z-glow 3.2s ease-in-out infinite; } }   /* дышит только на ноутбуке: на телефоне сотни вечных анимаций — батарея и рывки */
/* между днями — просвет: правое поле шире, а угол скруглён с запасом, чтобы плитка осталась плиткой */
:root .zt td.c.dend{ border-right-width:12px; width:56px; min-width:56px; border-radius:11px 21px 21px 11px / 11px; }
/* рамки — внутри плитки (тенью внутрь), а не контуром по клетке: у последней клетки дня поле справа шире */
:root .zt td.c.sub-sent{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 4px var(--z-sent); animation:z-sent 1.8s ease-in-out infinite; }   /* сдано, ждёт проверки */
@keyframes z-sent{ 50%{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 4px var(--z-sent2); } }
:root .zt td.c.sub-redo::before{ content:''; position:absolute; inset:3px; border:2px solid var(--z-ring); outline:2px dashed var(--z-redo); outline-offset:-2px; border-radius:7px; pointer-events:none; }   /* на доработке: пунктир по светлой подложке */
:root .edit .zt td.c:not(.cur):hover{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 3px var(--s); }   /* выбранную клетку наведение не перебивает */
:root .zt tbody tr.me td.c.d.mine:hover{ box-shadow:inset 0 0 0 1.5px var(--z-ring), inset 0 0 0 3px var(--z-sent); }
:root .zt td.c.cur{ box-shadow:inset 0 0 0 2px var(--z-ring), inset 0 0 0 4.5px var(--z-focus); animation:none; }
/* шапка дня — та же плитка: сама клетка глухая (под ней едут оценки), плашка — внутри */
:root .zt thead th.dt{ padding:4px 2px; border-top-width:0; }
:root .zt thead th.dt.dend{ padding-right:10px; }   /* + 2px прозрачной границы = те же 12, что у плиток */
:root .zt thead th.dt > *{ display:block; padding:8px 4px; border-radius:11px; background:var(--z-chip); }
:root .zt thead th.dt > a > b{ display:block; }
:root .zt thead th.dt.today > *{ background:color-mix(in srgb, var(--s) 22%, transparent); box-shadow:inset 0 0 0 1.5px var(--s), 0 0 16px -6px var(--glow); }
:root .zt thead th.dt.sjc{ color:var(--on); }
:root .zt thead th.dt.sjc > *{ background:var(--g); box-shadow:0 0 16px -8px var(--glow); }
:root .zt thead th.dt.sjc.today > *{ box-shadow:inset 0 0 0 2px var(--on); }
:root .zt th.sub.dend{ border-right-width:12px; }
/* тема и домашка — под тонкой чертой, без клеток */
:root .zt tfoot tr > *{ border-top:1px solid var(--z-rule); }
:root .zt tfoot td.dend{ border-right:12px solid transparent; }
@media (prefers-reduced-motion:reduce){ :root .zt td.c.m5::after, :root .zt td.c.sub-sent{ animation:none; } }

/* ночь: свои фон таблицы, свечение и мелочи */
[data-theme="night"] .wrap{ --card:#140a1b; background:var(--card);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 24px 70px -34px rgba(217,70,239,.55); }
[data-theme="night"] .zt thead th.dt.sjc.k-mat > *{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
[data-theme="night"] .zt tfoot td:hover{ background:rgba(255,255,255,.04); }
[data-theme="night"] .rdy{ background:transparent; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18); }
[data-theme="night"] .zt tbody tr.me th.nm{ background:color-mix(in srgb, #a78bfa 16%, var(--card)); box-shadow:inset 4px 0 0 #a78bfa; }
/* чёрное «Все» и «Математика» ночью терялись на чёрном: выбранный месяц и главная кнопка — светлые */
[data-theme="night"] .k-mat .mo[aria-selected="true"], [data-theme="night"] .k-mat .btn.pri{ background:#f3ecff; color:#16131a; box-shadow:0 0 18px -6px rgba(243,236,255,.6); }
[data-theme="night"] .lgd{ background:rgba(255,255,255,.03); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }

/* телефон боком: шапка в одну строку, таблица — на весь экран */
@media (orientation:landscape) and (max-height:520px){
  .zh-hero{ padding:8px 0; min-height:0; }
  .tab .lg{ display:none; } .tab .sh{ display:inline; } .tab.vse .lg{ display:inline; } .tab.vse .sh{ display:none; }   /* четыре вкладки — в одну строку */
  .zh-back, .zh-title .kicker{ display:none; }
  .zh-title{ display:none; }
  .tabs{ margin-top:0; margin-right:290px; }   /* справа — «?», часы и тема (fixed), не накрывать вкладки и «сохранено» */ .tab{ padding:5px 12px 5px 6px; font-size:14px; } .tab i{ width:24px; height:24px; font-size:14px; }
  .zh-main{ padding-top:8px; } .months{ margin-bottom:6px; } .mo{ padding:4px 10px; }
  .ssyl{ margin:0 290px 0 0; } .sl{ padding:4px 12px 4px 4px; font-size:14px; } .sl i{ width:26px; height:26px; }
  .wrap{ max-height:calc(100dvh - 16px); }
  .dock{ transform:scale(.8); transform-origin:top right; }
}
/* средний балл — маленькая цифра в углу клетки ученика, по нажатию */
.zt tbody th.nm{ cursor:pointer; }
.zt tbody .nm{ position:sticky; }
.zt tbody .nm i.avg{ position:absolute; top:3px; right:5px; font-style:normal; font-size:11px; font-weight:800; line-height:1;
  padding:2px 4px; border-radius:5px; background:var(--z-head); color:var(--ink); font-family:'JetBrains Mono',ui-monospace,monospace; }

/* ══ «где мы сейчас» (ТЗ 20, сессия 4): слово над датой, последний урок подсвечен, бледный «следующий» ══ */
.dt .rel{ display:block; font-family:inherit; font-size:10px; font-weight:800; letter-spacing:.02em; line-height:1.15; color:var(--s); }
.dt.rel-on.today b::after{ content:none; }   /* «сегодня» уже над датой */
:root .zt thead th.dt.rel-on > *{ padding-top:3px; padding-bottom:3px; }   /* две строки в той же высоте шапки */
:root .zt thead th.dt.last > *{ background:color-mix(in srgb, var(--s) 22%, transparent); box-shadow:inset 0 0 0 1.5px var(--s), 0 0 16px -6px var(--glow); }
:root .zt thead th.dt.sjc.last > *{ background:var(--g); box-shadow:inset 0 0 0 2px var(--on), 0 0 16px -8px var(--glow); }
.dt.sjc .rel{ color:inherit; opacity:.85; }
:root .zt thead th.dt.nx > *{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--z-line2); color:var(--muted); }
.dt.nx .rel{ color:var(--muted); }
.zt th.sub.nx{ opacity:.55; }
.zt td.nx{ width:46px; min-width:46px; height:44px; padding:2px; }
.zt tbody td.nx::before{ content:''; display:block; height:40px; border-radius:11px; box-shadow:inset 0 0 0 1.5px var(--z-rule); }
.zt tfoot td.nx, .zt tfoot td.nx:hover{ min-width:0; background:none; cursor:default; }
.edit .zt [data-nx]{ cursor:pointer; }
.edit .zt tbody td.nx:hover::before{ box-shadow:inset 0 0 0 1.5px var(--s); }

/* ══ итоги четверти (D 22.10; сервер включает их флагом ZHURNAL_ITOG). Переключатель четвертей — справа над таблицей.
   Графы итогов — в конце таблицы предмета; на широком экране стоят справа всегда, дни уезжают под них.
   Клетки глухие (под ними едут дни), плитка — внутри: как у шапки дня ══ */
.qbar{ justify-content:flex-end; align-items:center; }
.qbar-l{ font-size:13px; font-weight:700; color:var(--muted); margin-right:2px; }
.qbar .mo[data-qtr]:not([data-qtr="all"]){ min-width:44px; padding-left:0; padding-right:0; text-align:center; }   /* цель для пальца — не уже 44 */
.zt th.it-s, .zt td.it{ box-sizing:border-box; width:54px; min-width:54px; max-width:54px; background:var(--card); }

.zt td.it .itb.m5{ background:var(--m5b); box-shadow:var(--m5s); } .zt td.it .itb.m2{ background:var(--m2b); box-shadow:var(--m2s); }
.zt td.it .itb.m4{ background:var(--m4b); } .zt td.it .itb.m3{ background:var(--m3b); } .zt td.it .itb.mn{ background:var(--mnb); }
.zt td.it .itb.gh{ background:transparent; border:1.5px dashed var(--z-line2); color:var(--muted); font-size:12.5px; font-weight:700; }   /* подсказка — только учителю */
/* блок итогов — отдельный (D 23.10, вариант 3 «Цвет предмета»): под всеми графами одна подложка бледного цвета предмета,
   ДЗ и КР спокойные, итог — одинаковые плитки цвета предмета с белой цифрой (оценку видно по цифре, не по цвету).
   Подложка — ::before у каждой клетки (клетки липкие, под ними едут дни); -1px — прозрачные рамки клеток тоже под ней */
.zt{ --itP:color-mix(in srgb, var(--s) 11%, var(--card)); --it5:#15803d; --it4:#4d7c0f; --it3:#a8730a; --it2:#dc2626; --itn:#6b6480; }
[data-theme="night"] .zt{ --itP:color-mix(in srgb, var(--s) 15%, var(--card)); --it5:#c6f26b; --it4:#b9e69c; --it3:#ecca78; --it2:#ff7a7a; --itn:#bdb3cf; }
.zt .it-st{ isolation:isolate; }   /* шапка и так липкая сверху, на широком экране клетки липкие справа (ниже) */
@media (max-width:899px){ .zt td.it-st{ position:relative; } }
.zt td.it::before, .zt th.it-s::before, .zt th.it-h::before{ content:''; position:absolute; inset:0 -1px -1px 0; background:var(--itP); z-index:-1; pointer-events:none; }
.zt td.it-l::before, .zt th.it-s.it-l::before, .zt th.it-h::before{ left:10px; }
.zt th.it-h::before{ border-radius:18px 18px 0 0; }
.zt tbody tr:last-child td.it::before{ bottom:-6px; }
.zt tbody tr:last-child td.it-l::before{ border-bottom-left-radius:18px; } .zt tbody tr:last-child td.it4::before{ border-bottom-right-radius:18px; }
.zt th.it-s{ color:var(--s); }
.zt td.it-a b{ color:color-mix(in srgb, var(--s) 70%, var(--ink)); }
.zt td:is(.it3, .iy) .itb, .zt td:is(.it3, .iy) .itb.m5, .zt td:is(.it3, .iy) .itb.m4, .zt td:is(.it3, .iy) .itb.m3, .zt td:is(.it3, .iy) .itb.m2, .zt td:is(.it3, .iy) .itb.mn{ background:color-mix(in srgb, var(--card) 70%, transparent); box-shadow:none; }
.zt td:is(.it3, .iy) .itb.m5{ color:var(--it5); } .zt td:is(.it3, .iy) .itb.m4{ color:var(--it4); } .zt td:is(.it3, .iy) .itb.m3{ color:var(--it3); } .zt td:is(.it3, .iy) .itb.m2{ color:var(--it2); } .zt td:is(.it3, .iy) .itb.mn{ color:var(--itn); }   /* итоги года: всё, кроме последней графы, — спокойно, как КР */
.zt td.it4 .itb, .zt td.it4 .itb.m5, .zt td.it4 .itb.m4, .zt td.it4 .itb.m3, .zt td.it4 .itb.m2, .zt td.it4 .itb.mn{ background:var(--g); color:var(--on); box-shadow:0 6px 18px -6px var(--glow), 0 0 22px -8px var(--glow); font-size:18px; }
.zt td.it4 .itb.gh{ background:transparent; box-shadow:none; color:var(--s); border-color:color-mix(in srgb, var(--s) 45%, var(--card)); font-size:12.5px; }
.zt td.it4 .itb:where(:not(.m5):not(.m4):not(.m3):not(.m2):not(.mn):not(.gh)){ background:transparent; box-shadow:none; }   /* итога нет — пустое место на подложке; :where — рамка выбора (.cur) сильнее */
.zt td.it4 .itb.long, .zt td.it3 .itb.long{ font-size:11px; }
.zt td.it .itb .cmt{ position:absolute; top:4px; left:4px; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.8; }
.zt td.it-a b{ display:grid; place-items:center; height:40px; font-size:14px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
.zt thead th.it-h{ padding:4px 2px 4px 14px; }

.edit .zt td.it3, .edit .zt td.it4, .edit .zt td.iy.ed{ cursor:pointer; }

/* ══ вид ученика (ТЗ 19, шаг 2; сервер включает его флагом ZHURNAL_VID). Ученик своей строки видит не таблицу учителя,
   а свои экраны: «Задано» и карточку урока с кнопкой «Сдать фото». Макет — _стенд_журнала/макет_вид-ученика/.
   Одна колонка до 480 px на любом экране; цвета — те же переменные шапки (--h-…), ночь получается сама.
   Все классы — с приставкой v-: у сайта свои .row, .card, .tabs. Размеров текста три: --t1, --t2, --t3 ══ */
html.vid .zh-hero, html.vid .zh-main, html.vid .dock, html.vid .vq-hint{ display:none; }   /* подсказка «Жми ?» показывает на знак у часов — его тут нет, чат на вкладке */

html.vid[data-theme="night"] body{ background:#000; }
#vid{ --v-bg:var(--h-bg); --v-card:var(--h-panel); --v-ink:var(--h-txt); --v-sub:var(--h-soft); --v-line:var(--h-line); --v-dim:#8a8399;
  --v-red:#b42318; --v-wait:#6d28d9; --v-ok:#35701a; --v-late:#fff5f4;
  --v-pri:linear-gradient(135deg,#fb9a3c 0%,#f07a12 55%,#e0620a 100%); --v-glow:rgba(234,88,12,.42);
  --t1:24px; --t2:16px; --t3:13px;
  position:relative; max-width:480px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--v-bg); color:var(--v-ink); font-size:var(--t2); line-height:1.4; }
[data-theme="night"] #vid{ --v-dim:var(--h-dim); --v-red:#ff9aa8; --v-wait:#c4b5fd; --v-ok:#b9e69c; --v-late:rgba(255,90,90,.09); }

#vid .v-h1 + .v-h1{ margin-top:6px; }
#vid .v-cap{ display:block; font-size:var(--t3); color:var(--v-sub); }
#vid .v-cap .v-dot{ display:inline-block; margin:0 6px 0 0; }
#vid .v-lbl{ font-size:var(--t3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--v-sub); margin:22px 0 8px; }

#vid .v-card + .v-card{ margin-top:10px; }

#vid .v-row{ display:flex; align-items:flex-start; gap:12px; width:100%; padding:14px 12px 14px 14px; color:inherit; }
#vid .v-row + .v-row{ box-shadow:inset 0 1px 0 var(--v-line); }
#vid .v-body{ flex:1; min-width:0; display:block; }
#vid .v-body b{ font-weight:700; }
#vid .v-go{ flex:none; align-self:center; font-size:22px; line-height:1; color:var(--v-dim); }
#vid .v-dot{ flex:none; width:10px; height:10px; border-radius:50%; margin-top:6px; background:var(--s, var(--v-sub)); }
#vid .v-rt{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 8px; align-items:baseline; }
#vid .v-st{ font-size:var(--t3); font-weight:700; white-space:nowrap; }
#vid .v-st.no{ color:var(--v-red); } #vid .v-st.wait{ color:var(--v-wait); } #vid .v-st.ok{ color:var(--v-ok); }
#vid .v-hw{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; }

/* «К следующим урокам» — отдельные плитки, как дни в календаре сайта (D 12.10, вариант 4 из строки_варианты.png).
   Цветом предмета залита только та, по которой от ученика что-то нужно; сдал — плитка гаснет до белой и остаётся со статусом */
#vid .v-tiles{ display:grid; gap:8px; }

#vid .v-out{ display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:12px; font-size:var(--t3); font-weight:700; color:var(--v-ink); text-decoration:none; box-shadow:inset 0 0 0 1px var(--v-line); background:var(--v-card); }
/* живая шапка «Задано» — та же стена, что в журнале (fon.js); её узел переезжает сюда из прежней шапки */
#vid .v-head{ position:relative; overflow:hidden; isolation:isolate; height:124px; margin:-20px -16px 6px; padding:0 16px 14px; display:flex; flex-direction:column; justify-content:flex-end;
  background:radial-gradient(500px 240px at 85% -10%, rgba(168,85,247,.20), transparent 60%), radial-gradient(400px 220px at 0% 110%, rgba(79,70,229,.14), transparent 60%), var(--h-bg);
  box-shadow:inset 0 -1px 0 var(--v-line); }
#vid .v-head > *{ position:relative; z-index:1; }
#vid .v-head .gif-wall{ position:absolute; z-index:0; display:flex; align-items:center; }
#vid .v-head .gw-plane{ position:relative; flex:0 0 160%; left:-30%; top:auto; width:auto; height:auto; gap:10px; grid-template-columns:repeat(5,1fr); }
#vid .v-head .gif-wall::after{ background:linear-gradient(90deg, var(--h-bg) 0%, color-mix(in srgb, var(--h-bg) 78%, transparent) 34%, color-mix(in srgb, var(--h-bg) 26%, transparent) 66%, color-mix(in srgb, var(--h-bg) 14%, transparent) 100%); }
#vid .v-kick{ font-size:var(--t3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--v-sub); padding-right:48px; }
#vid .v-gear{ position:absolute; z-index:2; top:calc(10px + env(safe-area-inset-top, 0px)); right:12px; width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
  color:var(--v-ink); background:color-mix(in srgb, var(--v-card) 82%, transparent); box-shadow:inset 0 0 0 1px var(--v-line); }
#vid .v-gear svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
/* карточка урока */
#vid .v-back{ display:inline-flex; align-items:center; gap:6px; font-size:var(--t3); font-weight:700; color:var(--v-sub); padding:8px 12px 8px 0; margin-bottom:6px; }
#vid .v-cover{ display:block; width:100%; aspect-ratio:2/1; border-radius:16px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--v-line); margin-bottom:14px; }
#vid .v-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
#vid .v-tasks{ white-space:pre-line; line-height:1.6; overflow-wrap:anywhere; }
#vid .v-files{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
#vid .v-file{ display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:6px 12px 6px 6px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--v-line); font-size:var(--t3); font-weight:700; color:var(--v-ink); }
#vid .v-file u{ flex:none; width:34px; height:44px; border-radius:6px; overflow:hidden; text-decoration:none; display:grid; place-items:center; box-shadow:inset 0 0 0 1px var(--v-line); }

#vid .v-status .v-st{ white-space:normal; }

/* оценка — та же расцветка плиток, что в таблице (--m5b …): заливка цветом только у оценок и у главной кнопки */

#vid .v-m.m5{ background:var(--m5b); color:var(--m5t); } #vid .v-m.m4{ color:var(--m4t); } #vid .v-m.m3{ background:var(--m3b); color:var(--m3t); }
#vid .v-m.m2{ background:var(--m2b); color:var(--m2c); } #vid .v-m.mn{ background:var(--mnb); color:var(--mnt); }

/* одна залитая кнопка на экране, прижата к низу */

  background:linear-gradient(180deg, transparent, var(--v-bg) 18px); pointer-events:none; }

/* домашка блоками — вариант А (D 13.10): шапка цвета предмета со сроком, ниже чек-лист. Без #vid: тот же блок стоит
   в окне дня у учителя — «так увидит ученик». Цвета — --h-… страницы и --g/--s/--on предмета */
.v-hwb{ background:var(--h-panel); color:var(--h-txt); border-radius:16px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--h-line); text-align:left; white-space:normal; }
.v-hwt{ background:var(--g); color:var(--on); padding:10px 14px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }

.v-hwh{ font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--h-soft); margin:14px 2px 2px; }
.v-hwi > .v-hwh:first-child{ margin-top:8px; }

  // личная ссылка: ученик без Телеграма открывает свой журнал и сдаёт фото; одноклассникам ключ не виден

  /* ── ссылки урока (D, 09.10): видеосвязь и доска в шапке журнала; лежат в описании журнала (cfg 'meta': tm, bd) ── */
  var SSYL = [

  /* ── выгрузка оценок (D, 08.10): все предметы одним листом — печать, PDF или файл для Excel.

  // предмет по месяцам: целый год в одну таблицу на лист не влезет. → [{m, LA, LY, days: [{date, cols: [{l, w, lab}]}]}]

     Записи — k=itog, <предмет>.<четверть 1–4>.<ученик>.k|i ── */
  var itogCtx = null, itogCache = {};   // открытая четверть (её уроки и предмет) и посчитанные итоги каждой строки
  function isItog(id) { return String(id || '').split('.').length === 4; }   // клетка оценки — <урок>.<ученик>.u|d, итога — из четырёх частей

  // урок четвертной контрольной: в теме «К.Р. четвертная», «Контрольная работа за 1 четверть». Подготовка и разбор — не она,
  // «корень четвертой степени» — тоже: без «контрольная» или «К.Р.» рядом с «четверт…» урок не берём
  function isQkr(l) {

  // среднее до сотых: у границы 3,46 при десятых показалось бы «3,5» и глазом округлилось бы в четвёрку.
  // Считаем в целых сотых: (4,00 + 3,13) / 2 = 3,565 должно дать 3,57, а не 3,56 из-за дробей в памяти компьютера

        var g = gradeVal(splitMark(S.mark[c.l.id + '.' + sid + '.' + c.w]).g);
        if (g != null) (c.w === 'u' ? u : d).push(g);
      });
      if (isQkr(x.l)) {   // контрольную переписывали (два урока) — берём последнюю оценку; оценок нет — последнюю отметку («н»)
        var kg = splitMark(S.mark[x.l.id + '.' + sid + '.u']).g;

    var R = { u: avg2(u), d: avg2(d), kl: kl, kv: kv, km: km && km.v ? km : null, im: im && (im.v || im.c) ? im : null };
    R.k = R.km ? R.km.v : kv;   // в графе КР своя оценка D главнее оценки урока
    // подсказка — средний всех оценок строки за четверть, все равноправны: уроки, контрольные, домашки (D 23.10).
    // Своя КР D заменяет оценку урока контрольной, а если в уроке её нет — добавляется к остальным
    var all = u.concat(d), kg = R.km ? gradeVal(R.km.v) : null;

    R.s = avg2(all);

  }
  // итоги ученика по предмету за четверть вне таблицы («Оценки» вида ученика) — тем же счётом, что у учителя
  function itogOf(subj, q, sid) {
    var LA = lessons(subj).filter(function (l) { return l.subj === subj; });

    return LY.length ? itogRow(sid, { LY: LY, LA: LA, today: todayStr(), subj: subj, q: q }) : null;
  }
  function itogCells(sid) {

  }
  function itogTd(w, sid, R) {

  // поставили оценку в строке — её итоги пересчитываются сразу, таблица не перерисовывается

  function itogTip(di) {

      if (R.kv) return t + '\nОценка: ' + esc(R.kv) + '\nиз урока ' + esc(R.kl.date) + ' «' + esc(plain(topicOf(R.kl).t).slice(0, 50)) + '»';

    if (mode !== 'teacher') return t + '\nЕщё не выставлена';
    return t + '\nЕщё не выставлена' + (R.s ? '\nСредний всех оценок за четверть: ' + R.s.t + ' → ' + R.s.g + '\nСерую цифру видишь только ты' : '');

  // окно оценки итогов — тот же нижний лист, что у клетки: кнопки, своя оценка, комментарий, «дальше вниз»
  function openItog(id) {
    var q = id.split('.'), p = S.stu[q[2]], yr = /^[gea]$/.test(q[1]), R = yr ? null : itogCache[q[2]], isI = q[3] === 'i';

        (R.s ? 'Средний всех оценок: <b>' + R.s.t + '</b> — выходит ' + R.s.g : 'Оценок за четверть пока нет')

        (R.km ? '. Сотрёшь свою — в графе снова будет эта' : '. Поставишь свою — в графе будет твоя') : '';

  function setItog(v) {

  /* ── итоги года (D 23.10): за «Весь год» у предмета — «1 · 2 · 3 · 4 · Год»: четвертные (ставятся в своей четверти)

    var mk = /[#&]k=([^&]+)/.exec(location.hash);
    var byCode = function () {
      if (mk) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ } view(decodeURIComponent(mk[1])); }
      else if (lsGet(LS.pass, '')) view(''); else gate('');
    };
    // личная ссылка ученика без Телеграма (#s=<журнал>.<ключ>) — запомнить и открыть свой журнал
    var ms = /[#&]s=([a-z0-9]{2,16}\.[0-9a-f]{32})\b/.exec(location.hash);
    if (ms) { lsSet(LS.sk, ms[1]); J = ms[1].split('.')[0]; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ } }
    // личный значок (?s=…): ключ в адресе остаётся — и работает, даже когда память браузера пуста или недоступна
    var zn = znUrl();
    if (zn) J = zn.split('.')[0];
    // ссылка классного руководителя #kr=<журнал>.<ключ>: запоминаем на устройстве, из адреса убираем
    // из адреса ключ не убираем: закладка и повторное открытие должны его помнить (D 14.10); в память — после ответа сервера
    var mkr = krUrl();
    // кнопка «📒 Мой журнал» в боте: одноразовая ссылка #t=… → ключ входа, без 4 цифр
    var mt = /[#&]t=([0-9a-f]{32})\b/.exec(location.hash);
    var afterMe = function (res) { if (res === 'nolink') pickMe(); else if (res !== true) byCode(); };
    var mine = function () { meLoad().then(afterMe, byCode); };
    // сеть подвела — один раз через запасной сервер (VPN); ошибка загрузки журнала сюда не попадает
    var magic = function (token, tries) {
      // с ограничением по времени: при VPN прямой адрес молчит, и без него «Открываю журнал…» висело бы вечно (телефон ученицы, 01.10)
      var ctrl = window.AbortController ? new AbortController() : null, guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 7000);
      fetch(chatBase() + '/chat/login/magic/finish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }), signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { return r.json(); })
        .then(function (d) { clearTimeout(guard); return d; }, function (e) { clearTimeout(guard); throw e; })
        .then(function (d) {
          if (d.ok && d.key) { lsSet(LS.ck, d.key); lsDel(LS.sk); mine(); return; }
          if (ck()) { mine(); return; }   // ссылку уже открывали — вход помнится
          byCode();
          setTimeout(function () { alert(d.error === 'not student' ? 'Ты больше не в классе в боте — спроси учителя.' : 'Ссылка из бота устарела или уже открывалась. Нажми «📒 Мой журнал» в боте ещё раз.'); }, 300);
        }, function () { if (!tries) { nextApi(); magic(token, 1); } else byCode(); });
    };
    // кнопка-ссылка в меню бота (#b=<ключ входа>, D 02.10): журнал одним нажатием. Ключ — тот же, что страница
    // получает после входа; из адреса убираем. Срок ключа в ссылке вышел, а свой вход ещё помнится — берём свой
    var mb = /[#&]b=((?:main|test)\.\d{1,20}\.(\d{9,12})\.[0-9a-f]{32})\b/.exec(location.hash);
    // значок открывали раньше, а сейчас адрес без ключа (ссылка «Журнал» с сайта уроков) и другого входа нет — ключ из памяти обратно в адрес
    if (!zn && !ms && !mk && !mkr && !mt && !mb && !sk() && !ck() && !kr() && ZN_RE.test(lsGet('zh:zn', ''))) { znSet(lsGet('zh:zn', '')); zn = znUrl(); if (zn) J = zn.split('.')[0]; }
    if (mb) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ }
      if (!(ck() && +mb[2] * 1000 < Date.now())) { lsSet(LS.ck, mb[1]); lsDel(LS.sk); }
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      // сеть подвела — один раз через запасной сервер (VPN): meLoad при сбое сам переключает адрес
      var direct = function (tries) {
        meLoad().then(function (res) {
          if (res === 'nolink') pickMe();
          else if (res !== true) { byCode(); setTimeout(function () { alert('Вход из бота не сработал. Нажми в боте «Меню» (/start) — кнопка журнала обновится.'); }, 300); }
        }, function () { if (!tries) direct(1); else byCode(); });
      };
      direct(0);
    }
    else if (mt) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* не страшно */ }
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      apiReady.then(function () { magic(mt[1], 0); });   // одноразовая ссылка из бота — тоже по живому адресу
    }
    else if (kr() && !mk && (mkr || !(zn || sk() || ck()))) viewKr(0);
    // вошёл через бота — журнал открывается без кода класса, со своей строкой и сдачей
    else if (zn && !mk) {   // по личному значку
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      var znGo = function (tries) {
        meLoad().then(function (res) {
          if (res === true) return;
          // ключ отключён учителем: из адреса убираем и входим, как умеет это устройство (вход через бота или код)
          znSet('');
          if (sk() || ck()) meLoad().then(afterMe, byCode); else byCode();
          setTimeout(function () { alert('Этот значок больше не работает. Войди заново и сделай новый значок — или спроси учителя.'); }, 300);
        }, function () {   // сеть подвела — один раз через запасной сервер; дальше «Нет связи», а не код класса: ключ-то годен
          if (!tries) { znGo(1); return; }
          $('main').innerHTML = '<div class="gate"><h2>Нет связи с журналом</h2><p>Проверь интернет. Если включён VPN — попробуй без него.</p>' +
            '<p style="margin-top:14px"><button class="btn pri" data-act="retry">Ещё раз</button></p></div>';
        });
      };
      znGo(0);
    }
    else if (sk() && !mk) {   // по личной ссылке
      $('main').innerHTML = '<div class="empty">Открываю журнал…</div>';
      meLoad().then(function (res) { if (res !== true) { byCode(); setTimeout(function () { alert('Ссылка больше не работает — попроси у учителя новую.'); }, 300); } }, byCode);
    }
    else if (ck() && !mk) { $('main').innerHTML = '<div class="empty">Открываю журнал…</div>'; meLoad().then(afterMe, byCode); }
    else byCode();
  }
  }
  boot();
})();
</script>
<!-- знак «?» у часов — чат с учителем, тот же, что на сайте класса (D 07.10); у учителя под ним ученики -->
